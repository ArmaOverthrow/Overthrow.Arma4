  "Willkommen bei Overthrow! Dies ist dein Zuhause. Du wirst hier wieder einsteigen und kannst gegen eine kleine Gebühr hierher schnellreisen, indem du das Hauptmenü mit <color rgba='226,168,79,255'><action name=\"OverthrowMainMenu\"/></color> öffnest."\
  ""\
  "Du besitzt ein Auto, das in deiner Garage geparkt ist, und in deiner Hose befindet sich eine Handfeuerwaffe. Der Feind hält dich für einen Zivilisten, solange er dich nicht mit einer Waffe sieht, und wird nicht auf dich schießen. Sei deshalb vorsichtig, wenn du in seiner Nähe eine Waffe ausrüstest. Oben rechts erscheinen Sterne, wenn du vom Feind als \"wanted\" gesucht wirst."\
  ""\
  "Wenn Overthrow neu für dich ist, findest du im Bereich \"Jobs\" des Overthrow-Hauptmenüs eine Reihe von Tutorials."\
  ""\
  "Weitere Informationen zu den Funktionen und zum Gameplay von Overthrow findest du im \"Feldhandbuch\"."
  "Dein Zuhause (Wiedereinstiegspunkt)"
  "Eine Viertelunze vom feinsten klebrigen Gras. Kann mit kleinem Gewinn an Zivilisten verkauft werden."
  "Cannabis"
  "Gegenstandslimit an diesem Ort erreicht"
  "Gegenstand %1 von %2"
  "Gegenstand entfernt"
  "Deiner Karte wurde eine Wegpunktmarkierung hinzugefügt"
  "Offizier ausschalten"
  "Der Offizier, der diese Basis führt, ist der Grund dafür, dass die umliegenden Städte den Kopf einziehen. Dring ein, töte ihn und verschwinde wieder. Die Garnison wird darüber genauso unglücklich sein, wie du es erwartest – aber die Städte in der Nähe werden sich daran erinnern."
  "Verräter ausschalten"
  "Ein Mitglied des Widerstands ist übergelaufen und befindet sich in Schutzhaft. Wir haben seinen Aufenthaltsort bis zu einem Haus zurückverfolgt."\
  ""\
  "Eliminiere diesen Verräter, bevor er irgendwelche Informationen preisgeben kann."
  "Aufklärung"
  "Besuche eine Basis in der Nähe, um die Stärke ihrer Verteidigung festzustellen. Du musst bis auf 100 m an die Flagge der Basis herankommen, um sie gut auskundschaften zu können."\
  ""\
  "Achte darauf, im auf deiner Karte rot markierten Sperrgebiet nicht gesehen zu werden, sonst wird auf dich geschossen."
  "Tutorial – Einen Waffenhändler finden"
  "Waffenhändler befinden sich in größeren Ortschaften und Städten. Sie sind unabhängige Händler, die Waffen und andere illegale Gegenstände auf Lager haben. Jeder Waffenhändler verkauft sämtliche Munition sowie eine zufällige Waffe jeder Art. Probiere daher verschiedene Städte aus, um die gesuchte Waffe zu finden."\
  ""\
  "Besuche den nächstgelegenen Waffenhändler und sieh dir an, welche Gegenstände er anbietet."
  "Tutorial – Ein Geschäft finden"
  "In vielen Städten auf der Karte gibt es verschiedene Geschäfte, in denen du legale Gegenstände kaufen kannst. Sie sind auf der Karte durch unterschiedliche Symbole gekennzeichnet, die die jeweilige Art des Geschäfts darstellen."\
  ""\
  "Besuche das nächstgelegene Geschäft und sieh dir an, welche Gegenstände dort verfügbar sind, indem du eine Aktion an der Kasse ausführst."
  "In Bearbeitung:"
  "Piratensender"
  "Worte verbreiten sich weiter als Papier. Errichte in dieser Stadt einen Piratensender, um für den Widerstand zu senden. Du musst den Sender selbst über die Option 'Place' im Hauptmenü kaufen. Wenn Soldaten dich beim Platzieren sehen, wirst du gesucht."
  "Tutorial – Ein Camp errichten"
  "Camps können überall platziert werden, solange sie nicht zu nah an einer Basis liegen."\
  ""\
  "Ein Camp erzeugt einen Schnellreisepunkt, den jeder Spieler nutzen kann, und ermöglicht es dir, einige grundlegende Gegenstände in seiner Umgebung zu platzieren oder zu bauen."\
  ""\
  "Über \"Camp verwalten\" kannst du dein Camp außerdem auf privat stellen, wenn du nicht möchtest, dass andere Spieler dorthin schnellreisen."\
  ""\
  "Jeder Spieler darf nur ein Camp gleichzeitig besitzen. Wenn du ein neues Camp platzierst, werden dein altes Camp sowie alle Gegenstände gelöscht, die du dort platziert oder gebaut hast."\
  ""\
  "Du kannst ein Camp außerdem als \"Zuhause' festlegen, sodass du dort nach deinem Tod wieder einsteigst."\
  ""\
  "Platziere ein Camp, indem du das Overthrow-Menü öffnest und \"Platzieren\" auswählst. Stelle es an einem nützlichen Ort auf, damit du leicht in ein Gebiet zurückkehren kannst, in dem du gerade operierst oder in dem du dein Fahrzeug geparkt hast."
  "Tutorial – Eine Ausrüstungskiste platzieren"
  "Eine Ausrüstungskiste ist ein sehr nützlicher Lagerbehälter mit zusätzlichen Funktionen in Overthrow."\
  ""\
  "Sie kann:"\
  "- alle Arten von Ausrüstung lagern"\
  "- gesperrt werden, damit andere Spieler nicht darauf zugreifen können"\
  "- in ein Fahrzeug in der Nähe entladen werden"\
  "- aus einem Fahrzeug in der Nähe beladen werden"\
  "- deine aktuelle Ausrüstung speichern und auf dich selbst oder Rekruten in der Nähe anwenden"\
  ""\
  "Verwende die Option \"Platzieren\" im Overthrow-Menü, um eine an deinem Haus, deinem Camp, einem FOB oder einer Basis zu platzieren."
  "Propagandaaktion"
  "Die Stadt muss daran erinnert werden, wer die Besatzer sind. Bringe irgendwo in der Stadt ein Widerstandsplakat an – an einer gut sichtbaren Wand, wo die Leute es sehen werden. Lass dich dabei nicht von den Besatzungstruppen erwischen."
  "Tutorial – Unterstützung erhöhen"
  "Unterstützer in dieser Stadt liefern dem Widerstand in Form von Spenden eine dringend benötigte Einnahmequelle."\
  ""\
  "Erhöhe die Unterstützung, indem du mit der Option \"Platzieren\" im Overthrow-Menü Plakate in und um die Stadt platzierst und wartest, bis sie 15 % der Einwohner ins Auge fallen. Du kannst außerdem medizinische Vorräte wie Verbände und Aspirinflaschen ausliefern, indem du sie in dein Auto legst und im Kofferraum die Option \"Deliver Medical Supplies\" verwendest."\
  ""\
  "Überprüfe deinen Fortschritt in der \"Map\"sehen. Du kannst die Unterstützung in jedem Dorf, jeder Ortschaft und jeder Stadt erhöhen, ohne dafür einen Auftrag zu benötigen."
  "Tutorial – Einen Zivilisten rekrutieren"
  "Zivilisten können für deinen Trupp rekrutiert werden."\
  ""\
  "Es gibt zwei Möglichkeiten, sie zu rekrutieren:"\
  "1. Geh auf der Straße zu ihnen und rekrutiere sie direkt"\
  "2. Baue ein \"Rekrutierungszelt\" an einem FOB"\
  ""\
  "Nach der Rekrutierung kannst du ihnen über das \"Command menu\" mit <color rgba='226,168,79,255'><action name=\"OpenCommandMenu\"/></color> Befehle erteilen."
  "Funkturm sabotieren"
  "Ein Sender der Besatzer in der Nähe dieser Stadt übertönt alles, was wir ausstrahlen. Geh zum Turm und sabotiere ihn – er wird lange genug außer Betrieb sein, um einen Unterschied zu machen. Er wird bewacht, und wenn man dich dort sieht, wirst du gesucht."
  "Annehmen"
  "Auftrag abgeschlossen"
  "Ablehnen"
  "Derzeit sind keine Aufträge verfügbar"
  "Auf Karte anzeigen"
  "Diese Aufträge sind als Tutorial für den Spielmodus gedacht. Sie sind keine besonders gute Einnahmequelle, sondern zeigen dir lediglich, was möglich ist. Overthrow ist ein Open-World-Spielmodus, in dem DU entscheidest, wie du die Revolution voranbringst. Du wirst deutlich mehr Geld verdienen, indem du Unterstützung erhöhst und Städte einnimmst. Also geh raus, erhöhe die Unterstützung, erobere Basen und übernimm die Insel!"
