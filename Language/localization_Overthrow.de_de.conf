  "US-Streitkräfte halten die Insel besetzt. Sie bemannen deren Stützpunkte und Funktürme und patrouillieren in den Ortschaften – und ihre Uniform ist es, die als Tarnung dient."
  "Die US-Streitkräfte ist eine ausländische Macht, die mit dem Widerstand sympathisiert, aber nicht mit deiner eigenen Fraktion. Wer in dieser Uniform gesehen wird, löst sofort eine Fahndung aus; zudem kann man nicht gleichzeitig als Besatzer auftreten."
  "Sowjetische Streitkräfte halten die Insel besetzt. Sie bemannen Stützpunkte und Funktürme und patrouillieren in den Ortschaften – und ihre Uniform ist es, die als Tarnung dient."
  "Die Sowjetunion ist eine ausländische Macht, die mit dem Widerstand sympathisiert, aber nicht mit deiner eigenen Fraktion. Wer in dieser Uniform gesehen wird, löst sofort eine Fahndung aus; zudem kann man nicht gleichzeitig als Besatzer auftreten."
