  "Der Hafen wird das nicht kaufen."
  "US-Streitkräfte halten die Insel besetzt. Sie bemannen deren Stützpunkte und Funktürme und patrouillieren in den Ortschaften – und ihre Uniform ist es, die als Tarnung dient."
  "Die US-Streitkräfte ist eine ausländische Macht, die mit dem Widerstand sympathisiert, aber nicht mit deiner eigenen Fraktion. Wer in dieser Uniform gesehen wird, löst sofort eine Fahndung aus; zudem kann man nicht gleichzeitig als Besatzer auftreten."
  "Sowjetische Streitkräfte halten die Insel besetzt. Sie bemannen Stützpunkte und Funktürme und patrouillieren in den Ortschaften – und ihre Uniform ist es, die als Tarnung dient."
  "Die Sowjetunion ist eine ausländische Macht, die mit dem Widerstand sympathisiert, aber nicht mit deiner eigenen Fraktion. Wer in dieser Uniform gesehen wird, löst sofort eine Fahndung aus; zudem kann man nicht gleichzeitig als Besatzer auftreten."
  "Funktion noch nicht implementiert"
  "Einen Kampf beginnen"
  "Die Stellung halten"
  "Eine Basis, die du hältst"
  "Die Antwort"
  "Militärbasen werden von der Besatzungsfraktion gehalten und wechseln den Besitzer erst nach einem dort ausgetragenen Kampf. Eine Basis unter der Kontrolle des Widerstands schwächt die Besatzer in diesem Gebiet; diese können ihre Reserven für einen Gegenangriff einsetzen, um sie später zurückzuerobern."
  "Ein Angriff wird aus einer besetzten Basis heraus gestartet, und alle Spieler auf dem Server werden über den Beginn informiert. Die besetzende Fraktion reagiert, indem sie Truppen aus ihren anderen, nahegelegenen Basen herbeordert, die im Laufe der nächsten Minuten am Einsatzort eintreffen. Es findet jeweils nur ein einziger Kampf auf der Karte statt; solange dieser läuft, besteht keine Möglichkeit, einen weiteren zu beginnen."
  "Sobald die Verstärkung eingetroffen ist, wird das Kräfteverhältnis vor Ort fortlaufend ermittelt: Entscheidend ist, wie viele Spieler sich in der Mitte der Basis befinden und wie viele feindliche Soldaten ihnen dort gegenüberstehen. Überwiegen die Spieler und sind keine Gegner mehr vorhanden, schlägt das Pendel schnell zu ihren Gunsten aus; sind mehr Soldaten als Spieler anwesend, kehrt sich das Verhältnis um; bei ausgeglichenen Zahlenverhältnissen tendiert der Wert wieder gegen Null. Der Zähler bewegt sich – je nach gewählter Schwierigkeitsstufe – in die eine oder andere Richtung; wer den Zielwert erreicht, erobert die Basis. Die am Kampf beteiligten Spieler sammeln währenddessen Erfahrungspunkte."
  "Wechselt eine Basis den Besitzer, wird dort die Flagge des neuen Eigentümers gehisst und die Übernahme serverweit bekannt gegeben. Eine von der Widerstandsbewegung gehaltene Basis dient als Ziel für Schnellreisen und als Respawn-Punkt; zudem können Spieler dort bauen und eine in der nächstgelegenen Stadt angeheuerte Garnison stationieren. Manche Einrichtungen stehen ausschließlich der Fraktion zur Verfügung, die das entsprechende Gebiet kontrolliert. Die Eroberung einer Basis erhöht den Druck auf die besetzende Fraktion, während ihr Verlust diesen Druck wieder verringert."
  "Nichts, was eingenommen wurde, bleibt dauerhaft in der eigenen Hand. Die Besatzungsmacht hält Reserven zurück und investiert sie in ihre verbliebenen Stützpunkte; verfügt sie über einen Überschuss, wählt sie einen von der Widerstandsbewegung eroberten Stützpunkt aus, um ihn zurückzuerobern, und wartet anschließend eine Weile, bevor sie es erneut versucht. Um Städte und Funktürme wird auf ganz ähnliche Weise gekämpft, sodass ein Ort im Verlauf einer Kampagne mehrfach den Besitzer wechseln kann."
  "Basen einnehmen"
  "Wo Platzierungen funktionieren"
  "Camp"
  "Öffentlich und Privat"
  "Unzulässige platzierbare Objekte"
  "Beim Platzieren werden gegen Bezahlung Widerstandsobjekte in der Spielwelt aufgestellt – von kleinen Gegenständen bis hin zu einem kompletten Camp. Viele dieser Objekte dürfen nur an bestimmten Orten errichtet werden; einige sind zudem illegal, sodass ihr Aufstellen bemerkt wird, wenn es im Sichtfeld der Besatzungsfraktion geschieht."
  "Über die Option „Platzieren“ im Overthrow-Hauptmenü erhältst du eine Vorschau des Objekts, das du vor dir aufstellen kannst; das System verweigert die Platzierung, wenn der gewählte Ort unzulässig ist. Die meisten Gegenstände lassen sich in der Nähe eines eigenen Hauses oder Lagers, im Umkreis einer FOB (Forward Operating Base) oder innerhalb einer von der Resistance gehaltenen Basis aufstellen. Bei Plakaten und dem Piratensender verhält es sich umgekehrt: Sie müssen innerhalb einer Ortschaft platziert werden, wobei pro Ort nur eine begrenzte Anzahl gleichzeitig zulässig ist. Zudem ist die Gesamtzahl der platzierbaren und baubaren Objekte an einem Standort begrenzt – ein Wert, der über die Servereinstellungen festgelegt wird."
  "Ein Camp wird wie jedes andere Objekt platziert, gilt jedoch nach der Errichtung als Widerstandsposten und muss mindestens hundert Meter von einem anderen Camp entfernt sein. Ein Camp ist ein Ort, zu dem du schnellreisen und an dem du deinen Wiedereinstiegspunkt festlegen kannst; zudem ist es ein Ort, an dem du weitere Objekte platzieren darfst und an dem das Baumenü funktioniert. Du kannst jeweils nur ein Camp besitzen: Das Platzieren eines neuen Camp entfernt das alte."
  "Ein Camp verfügt über ein eigenes Menü zur Verwaltung, über das man zwischen einem öffentlichen und einem privaten Status wechseln oder das Camp wieder entfernen kann. Ein öffentliches Camp wird auf der Karte aller Spieler angezeigt, und jeder Spieler kann per Schnellreise dorthin gelangen. Ein privates Camp ist nur auf der Karte des jeweiligen Besitzers sichtbar, und auch nur dieser Spieler kann dorthin reisen."
  "Das Aufstellen von Plakaten, Piratensendern, Sandsäcken und Fahrzeugsperren ist illegal. Werden diese platziert, während die Besatzungsmacht einen dabei beobachten kann, wird man steckbrieflich gesucht – genau wie beim Plündern eines Soldaten unter den Augen anderer; geschieht dies unbemerkt, bleibt es folgenlos. Plakate und Piratensender wirken sich zudem auf die jeweilige Stadt aus, in der sie aufgestellt wurden: Sie stärken die Unterstützung für den Widerstand, bis die Wirkung nachlässt. Pro Stadt sind dabei nur eine begrenzte Anzahl an Plakaten und ein einzelner Sender möglich."
  "Camps und Platzierung"
  "Erste Schritte"
  "Geld und Handel"
  "Overthrow"
  "Unentdeckt bleiben"
  "Der Widerstand"
  "Der Aufbau"
  "Was die Sabotage kostet"
  "Eine eigene Basis"
  "Die Einkesselung"
  "Die Besatzungskräfte konzentrieren ihre Kräfte jeweils auf ein einzelnes Ziel. Dazu wählen sie einen von den Widerstandskräften gehaltenen Stützpunkt, eine Ortschaft oder eine Stadt aus und führen in den folgenden Stunden Kräfte und Mittel für einen Angriff zusammen."\
  ""\
  "Die Zielauswahl erfolgt nicht zufällig. Bevorzugt werden größere Ortschaften, Ziele in der Nähe noch gehaltener eigener Stützpunkte, Bereiche innerhalb der Reichweite eigener Funkturm sowie Orte, in denen die Unterstützung für den Widerstand bereits nachgelassen hat."\
  ""\
  "Dörfer, Funkmtürme und FOBs des Widerstands werden dabei nicht unmittelbar als Angriffsziele ausgewählt."\
  ""\
  "Solange sich der Kräfteaufmarsch noch in einer frühen Phase befindet, kann das Ziel gewechselt werden. Nach erfolgter Festlegung auf ein Ziel wird der Angriff jedoch konsequent weitergeführt, sofern der Aufmarsch nicht vorher unterbunden wird."
  "Das erste Anzeichen ist verstärkter Fahrzeugverkehr. Trupps rücken von einem noch durch die Besatzungskräfte gehaltenen Stützpunkt aus, werden auf einer Straße kurz vor dem Ziel abgesetzt und legen den restlichen Weg zu Fuß zurück. Das Transportfahrzeug kehrt anschließend zum Ausgangspunkt zurück."\
  ""\
  "In Ortschaften stoßen die Trupps zum Ortszentrum vor. Hält ein Trupp dieses unangefochten, sinkt die Unterstützung der Bevölkerung für den Widerstand um eine Stufe; ein weiterer erfolgreicher Trupp senkt sie erneut."\
  ""\
  "Ein nahe gelegener, vom Widerstand gehaltener Funkturm zieht einen eigenen Trupp auf sich. Dieser muss den Mast erreichen und die Stellung dort über längere Zeit halten, bevor die Anlage wieder unter Kontrolle der Besatzungskräfte fällt."\
  ""\
  "Bei Stützpunkten dringen die Kräfte ein und beginnen, die dort errichteten Einrichtungen abzubauen beziehungsweise zu zerstören."\
  ""\
  "Solange sich Verteidiger an einem dieser Orte aufhalten, wird der laufende Fortschritt des angreifenden Trupps angehalten. Wird der Trupp vollständig ausgeschaltet, ist der jeweilige Versuch sofort beendet."\
  ""
  "Was Saboteure in einem Stützpunkt zerstören, bleibt an Ort und Stelle. Die jeweilige Anlage wird nicht abtransportiert, sondern gesprengt und als beschädigte Ruine zurückgelassen; Explosion und Rauch kennzeichnen die Zerstörung. Die Ruine kann anschließend für einen Teil der ursprünglichen Baukosten wieder instand gesetzt werden. Wird eine Kampagne gespeichert und später neu geladen, bleibt die Anlage als Ruine bestehen."\
  ""\
  "Im Inneren gelagerte Ausrüstung übersteht die Zerstörung. Die betroffene Einrichtung bleibt jedoch vollständig außer Funktion, bis sie repariert wurde."\
  ""\
  "Die Saboteure beginnen mit den günstigsten vorhandenen Bauten und arbeiten sich zu den wertvolleren vor. Entsprechend werden beispielsweise Bunker und Zelte vor einer Garage angegriffen. Gefährdet sind ausschließlich Objekte, die dem jeweiligen Stützpunkt zugeordnet sind."\
  ""\
  "Befindet sich auch nur ein Spieler innerhalb des Stützpunkts, werden die laufenden Sprengungen an ihrem aktuellen Stand angehalten. Pro Mission wird nur eine Meldung ausgegeben, und zwar beim ersten zerstörten Objekt."\
  ""
  "Sobald der Kräfteaufmarsch Wirkung zeigt, errichten die Besatzungskräfte einen eigenen vorgeschobenen Stützpunkt zwischen ihrer nächstgelegenen gehaltenen Stellung und dem Angriffsziel."\
  ""\
  "Ein Versorgungslastwagen rückt aus, um diesen Stützpunkt aufzubauen, und kann daher bereits auf dem Anmarsch abgefangen werden. Ist der vorgeschobene Stützpunkt erst einmal eingerichtet, erfolgt darüber keine Meldung: Er muss aufgeklärt und gefunden werden."\
  ""\
  "Von diesem Zeitpunkt an dient er als Ausgangspunkt für die eingesetzten Trupps und zugleich als wirksamster Ansatzpunkt, um den gesamten Angriffsvorgang zu unterbrechen. Wird der Stützpunkt, der ihn versorgt, eingenommen oder vollständig geräumt, oder halten sich Widerstandskräfte über längere Zeit in unmittelbarer Nähe des vorgeschobenen Stützpunkts auf, wird dieser schließlich aufgegeben und abgebaut. Anschließend suchen die Besatzungskräfte nach einem neuen Ziel."\
  ""\
  "Ist das Gelände frei von feindlichen Soldaten, kann der vorgeschobene Stützpunkt durch eine länger gehaltene Aktion an seiner Flagge unmittelbar beseitigt werden. Diese direkte Zerstörung verursacht den Besatzungskräften höhere Verluste als eine Aufgabe infolge unterbrochener Versorgung."\
  ""
  "Der Gegenangriff selbst setzt ohne jede Vorwarnung ein. Es erfolgt keine Meldung, kein Gefechtsfenster erscheint und auf der Karte wird kein Einsatzradius angezeigt. Die gesamte Angriffskraft wird gleichzeitig in der üblichen Entfernung zum Ziel eingesetzt und rückt anschließend zu Fuß vor, um in etwa 100 bis 150 Metern Abstand zum Zentrum einen geschlossenen Ring zu bilden."\
  ""\
  "Der einzige frühzeitige Hinweis besteht darin, dass während der Formierung kein eigenes Gefecht begonnen werden kann. Eine zuvor noch verfügbare Einnahmeaktion oder ein Aufstand steht dann ohne weitere Meldung vorübergehend nicht mehr zur Verfügung."\
  ""\
  "Gegenangriffe beginnen ausschließlich bei Tageslicht, ungefähr zwischen 05:00 und 15:00 Uhr. Die Angriffswellen rücken aus der Richtung an, in der die Besatzungskräfte tatsächlich eigene Stellungen halten; dazu zählt auch ein vorhandener vorgeschobener Stützpunkt."\
  ""
  "Die Meldung erfolgt erst, sobald sämtliche angreifenden Kräfte ihre Ausgangsstellungen bezogen haben. Ab diesem Zeitpunkt beginnt eine fünfzehnminütige Vorbereitungsphase in Echtzeit, während der keinerlei Wertung erfolgt."\
  ""\
  "Dieses Zeitfenster gehört dem Widerstand. Es kann genutzt werden, um Verstärkungen heranzuführen, Rekruten zu sammeln, entscheidendes Gelände auszubauen oder die Lage als nicht verteidigungswürdig einzustufen und den Raum aufzugeben."\
  ""\
  "Das Gefechtsfenster weist den umkämpften Ort aus und zeigt den Countdown bis zum Beginn der Wertungsphase. Werden sämtliche Angreifer im Bereitstellungsring vor Ablauf dieser Frist ausgeschaltet, endet das Gefecht sofort mit einem Sieg des Widerstands; ein eigentlicher Sturmangriff findet dann nicht statt."\
  ""\
  "Verbleiben nach Ablauf der Frist noch Angreifer, beginnt die Kampfphase. Der Einschließungsring zieht sich zusammen, und die Geländekontrolle wird nach denselben Regeln gewertet wie in jedem anderen Gefecht."\
  ""\
  "Unabhängig vom Ausgang des Kampfes wird der vorgeschobene Stützpunkt der Besatzungskräfte anschließend aufgegeben und abgebaut. Danach beginnt die Besatzungsfraktion erneut mit der Auswahl eines Angriffsziels."\
  ""
  "Gegenangriff"
  "Öffne die Karte und wähle einen Ort aus, zu dem du reisen kannst: ein Haus, das dir gehört oder das du mietest, dein eigenes Camp oder ein öffentliches Camp, einen FOB oder eine vom Widerstand kontrollierte Basis. Im Informationsfenster gibt es eine Schaltfläche für die Reise, auf der der Fahrpreis angezeigt wird. Schnellreise kostet die Entfernung in Kilometern multipliziert mit dem in den Schwierigkeitseinstellungen festgelegten Schnellreisepreis, wobei mindestens ein Kilometer berechnet wird. Rekruten in einem Umkreis von 50 Metern reisen standardmäßig mit dir und jeder von ihnen zahlt den vollen Fahrpreis; im Fenster gibt es einen Schalter, mit dem du sie zurücklassen kannst. Du kannst nicht schnellreisen, solange du gesucht wirst, zu einem Ziel, das näher als die Mindestentfernung liegt, oder als Beifahrer in einem Fahrzeug – nur der Fahrer nimmt das Fahrzeug mit – und eine laufende QRF kann die Schnellreise abhängig von den Schwierigkeitseinstellungen blockieren. Für Busreisen verwende an einer Bushaltestelle \"Nimm den Bus\" und wähle auf der Karte eine andere Bushaltestelle aus: Beim Busfahrpreis gibt es keine Mindestentfernung und du musst zu Fuß sein."
  "Einen FOB errichten"
  "Was dir ein FOB bietet"
  "Bauen"
  "Weiterziehen"
  "Ein FOB ist eine vorgeschobene Operationsbasis, die der Widerstand im Feld errichten kann. Sie muss in ausreichendem Abstand zu Basen und Funktürmen platziert werden. Durch Bauen können an einer vom Widerstand gehaltenen Basis, an einem FOB oder in einem Camp Strukturen hinzugefügt werden; was verfügbar ist, hängt davon ab, an welchem dieser Orte du dich befindest."
  "Ein FOB beginnt als mobiler FOB-Lkw, der wie jedes andere Fahrzeug gekauft wird. Eine Aktion am Lkw richtet den FOB an seiner aktuellen Position ein. Er kann weder in der Nähe einer Basis errichtet werden – unabhängig davon, ob diese von der Besatzungsmacht oder vom Widerstand gehalten wird – noch innerhalb von siebzig Metern um einen Funkturm. Die Karte markiert diese Bereiche, damit sie im Voraus erkennbar sind. Das Errichten ist auf Offiziere beschränkt, sofern der Server nicht anders eingestellt wurde."
  "Jeder Spieler kann per Schnellreise zu einem FOB gelangen, ein FOB kann als Wiedereinstiegspunkt festgelegt werden und dort funktionieren sowohl Platzieren als auch Bauen. Eine Garnison aus Soldaten kann dort stationiert werden; sie wird bezahlt und aus den Unterstützern der nächstgelegenen Stadt rekrutiert. Camps erhalten auf dieselbe Weise eine Garnison. Ein Offizier kann einen einzelnen FOB als Prioritäts-FOB markieren. Dadurch erhält er ein eigenes Kartensymbol und bleibt unabhängig von der Zoomstufe der Karte sichtbar."
  "\"Bauen\" im Overthrow-Hauptmenü öffnet eine Liste von Strukturen sowie eine Kamera, mit der sie in kurzer Entfernung von deinem Standort platziert werden können. Eine Struktur kostet nur Geld: Es gibt keinen separaten Materialvorrat, den du vorher sammeln musst. Jede Struktur hat eigene Regeln dafür, wo sie platziert werden darf, und der Großteil der Liste erfordert eine vom Widerstand gehaltene Basis oder einen FOB. Deshalb bietet dasselbe Menü in einem Camp weniger Möglichkeiten als in einer eroberten Basis."
  "Ein FOB ist nicht dauerhaft an einen Ort gebunden. Wird er eingepackt, verwandelt er sich wieder in den Lkw und nimmt die in seiner Umgebung stehenden Container samt Inhalt in das Fahrzeug auf. So kann ein FOB verlegt werden, anstatt ihn zurückzulassen. Die Besatzungsmacht erfährt ihrerseits, wo sich Camp und FOBs des Widerstands befinden, und schickt Truppen zur Aufklärung dorthin, wenn sie Soldaten entbehren kann."
  "FOBs und Bauen"
  "Wenn das Geld ausgeht"
  "Kostenloser Treibstoff"
  "Das Treibstoffdepot"
  "Treibstoff muss vom Widerstand bezahlt werden. Das Betanken an einer Zapfsäule oder einem stationären Kraftstofftank kostet für jeden tatsächlich abgegebenen Liter Geld; der Betrag wird während des Tankvorgangs fortlaufend abgezogen."\
  ""\
  "Die Aktion **„Betanken“** zeigt den Preis pro Liter direkt neben der Tankanzeige an, zum Beispiel **($1/L)**. Dieser Preis ist von der gewählten Schwierigkeit abhängig: Auf der einfachsten Stufe beträgt er **0,50 $ pro Liter**, auf der höchsten **4 $ pro Liter**. Ein Server kann den Wert außerdem auf null setzen; in diesem Fall ist Treibstoff überall kostenlos."\
  ""\
  "Fahrzeuge und das **Treibstoffdepot** verfügen zusätzlich über die Aktion **„Tank füllen“**. Dabei wird die Aktion fünf Sekunden lang gehalten und der betreffende Tank anschließend in einem einzigen Vorgang aufgefüllt. Vor Beginn wird der genaue Preis angezeigt. Reicht das vorhandene Geld nicht für eine vollständige Füllung, wird nur so viel Treibstoff abgegeben, wie mit dem verfügbaren Betrag bezahlt werden kann."\
  ""
  "Kann der Widerstand nicht einmal den nächsten Moment des Tankvorgangs bezahlen, wird die Aktion **„Betanken“** ausgegraut und weist darauf hin, dass der Treibstoff an dieser Stelle nicht bezahlt werden kann."\
  ""\
  "Geht das Geld während eines bereits laufenden Tankvorgangs aus, wird die Kraftstoffzufuhr sofort gestoppt. Jeder bis dahin abgegebene Liter verbleibt im Tank, und es erfolgt einmalig eine entsprechende Meldung."\
  ""\
  "Dadurch können einige wenige Dollar unverwendbar übrig bleiben, da ein Tankvorgang nur dann begonnen wird, wenn mindestens ein vollständiger Abrechnungsabschnitt bezahlt werden kann."\
  ""
  "Das Umfüllen von Treibstoff aus einem Tanklastwagen in ein Fahrzeug ist kostenlos. Gleiches gilt für das Betanken aus einem Kanister."\
  ""\
  "Kosten entstehen erst beim Befüllen dieser Vorräte: Wird ein Kanister oder der eigene Ladetank eines Tankfahrzeugs an einer Zapfsäule aufgefüllt, gilt dafür der reguläre Treibstoffpreis."\
  ""\
  "Treibstoff, der bereits in einem Tankfahrzeug mitgeführt wird, gilt somit als bereits bezahlt."\
  ""
  "Der Widerstand kann an einem gehaltenen Stützpunkt ein **Treibstoffdepot** errichten. Es fasst **10.000 Liter** – entsprechend zwei vollständigen Tanklastwagenladungen – und wird leer aufgebaut. Solange es nicht befüllt wurde, kann es daher keinen Treibstoff ausgeben."\
  ""\
  "Zum Befüllen wird ein Tanklastwagen direkt neben dem Depot abgestellt. Anschließend wird dessen Ladung über die Aktionen des Treibstoffdepots in den Vorratstank umgefüllt."\
  ""\
  "Sobald Treibstoff eingelagert ist, können Fahrzeuge in unmittelbarer Nähe des Depots **kostenlos betankt** werden. Die verbleibende Treibstoffmenge wird im Kampagnenspeicher gesichert und steht nach dem Laden weiterhin zur Verfügung."\
  ""
  "Treibstoff"
  "Einen Waffenhändler finden"
  "Was sie anbieten"
  "An einen Händler verkaufen"
  "Ein Waffenhändler ist ein Geschäft, das statt alltäglicher Waren Waffen und militärische Ausrüstung handelt. Waffenhändler greifen auf eine eigene Bestandsliste zurück, füllen ihre Vorräte getrennt von gewöhnlichen Geschäften auf und ihre Preise werden von den Schwierigkeitseinstellungen der Kampagne beeinflusst."
  "Jede Stadt, die größer als ein Dorf ist, hat einen Waffenhändler; Dörfer haben keinen. Der Händler ist eine Person, die an einem bestimmten Ort in der Stadt steht, und kein Tresen innerhalb eines Geschäfts. Sobald eine Stadt diesen Standort festgelegt hat, bleibt er für den Rest der Kampagne bestehen. Sowohl Händler als auch gewöhnliche Geschäfte haben jeweils ein eigenes Symbol auf der Karte."
  "Der Bestand eines Händlers stammt aus seiner eigenen Liste und nicht aus dem allgemeinen Warenkatalog der Geschäfte: Pistolen, Munition, Anbauteile, Sprengstoffe und Wurfgegenstände gehören zum Standardangebot. Zusätzlich erhält der Händler jeder Stadt bei der ersten Aktivierung der Stadt jeweils ein zufällig ausgewähltes Gewehr, Scharfschützengewehr, Maschinengewehr und einen Werfer. Diese Auswahl bleibt diesem Händler dauerhaft erhalten und wird bei niedrigem Bestand wieder aufgefüllt, statt neu ausgewürfelt zu werden. Deshalb bieten zwei Städte nur selten dieselben schweren Waffen an. Die meiste Ausrüstung der Besatzungsmacht wird nicht gehandelt."
  "Anders als ein Geschäft, das nur die Arten von Waren zurückkauft, die es selbst verkauft, nimmt ein Händler fast alles an, was einen Preis besitzt. Er bezahlt einen durch die Schwierigkeitseinstellungen der Kampagne festgelegten Anteil des Gegenstandswerts. Ist dieser Anteil dort auf null gesetzt, kauft der Händler überhaupt nichts an. Große Geldbeträge, die bei einem Händler den Besitzer wechseln, bleiben nicht unbemerkt: Sie senken die Stabilität der betreffenden Stadt und erhöhen dort die Unterstützung für den Widerstand."
  "Waffenhändler"
  "Kaserne"
  "Eine Gruppe kaufen"
  "Befehle und Verhaltensweisen"
  "Gruppen verwalten"
  "Munition und Treibstoff"
  "Rekruten übergeben"
  "Stellungen halten"
  "Das Obere Kommando ermöglicht es dem Widerstand, eigene Soldaten als selbstständige Kampfverbände einzusetzen, anstatt sie lediglich als Begleitschutz mitzuführen."\
  ""\
  "Ein Spieler kauft an einer Kaserne eine vollständige Gruppe, übernimmt sie vollständig und kann sie über die Karte an jeden beliebigen Ort der Insel befehlen."\
  ""\
  "Die Gruppe ist tatsächlich in der Spielwelt vorhanden: Sie marschiert oder fährt selbstständig zum befohlenen Ziel, bekämpft unterwegs angetroffene Feindkräfte und hält anschließend ihre Stellung – unabhängig davon, ob sich ein Spieler in der Nähe befindet."\
  ""
  "Gruppen werden an einer Kaserne gekauft, die sich auf einem vom Widerstand gehaltenen Stützpunkt befindet. Einige Stützpunkte verfügen bereits über militärische Kasernen. Eine Kaserne kann jedoch auch wie jedes andere Bauwerk an einem Stützpunkt errichtet werden. Mit 20.000 $ sowie dem erforderlichen Holz, Zement, Stahl und Baumaterial ist sie das teuerste Bauwerk auf der Bauliste."\
  ""\
  "Die entsprechende Aktion befindet sich am Funkgerät innerhalb der Kaserne – demselben Funkgerätetyp, der auch in Rekrutierungszelten verwendet wird. Jeder Spieler am betreffenden Stützpunkt kann diese Aktion nutzen."\
  ""\
  "Wurde die Kaserne zu einer Ruine zerstört, stehen ihre Funktionen erst nach vollständiger Instandsetzung wieder zur Verfügung."\
  ""
  "Der Bildschirm führt elf verfügbare Gruppen auf, von kleinen Trupps bis hin zur Schützengruppe. Drei dieser Gruppen werden zusammen mit einem Fahrzeug bereitgestellt."\
  ""\
  "Nach Auswahl einer Gruppe fordert das System vom Server den aktuellen Preis an und zeigt zugleich deren vollständige Zusammensetzung an: die Rekrutierungskosten jedes einzelnen Soldaten, die für ihn benötigte Ausrüstung sowie – sofern vorgesehen – das zugehörige Fahrzeug zum vollen regulären Händlerpreis."\
  ""\
  "Befindet sich innerhalb eines Radius von 150 Metern ein registriertes Lagerhaus mit bereits eingelagerter Ausrüstung, wird diese direkt aus dem Bestand entnommen und nicht erneut gekauft. Das Preisangebot weist aus, welcher Anteil dadurch bereits gedeckt ist."\
  ""\
  "Mit jedem Gruppenkauf werden außerdem Unterstützer aus der nächstgelegenen Ortschaft herangezogen. Verfügt diese über keinerlei Unterstützung mehr, kann dort keine neue Gruppe aufgestellt werden."\
  ""\
  "Für jeden Spieler gilt zudem eine Obergrenze für die Anzahl gleichzeitig unterstellter High-Command-Soldaten. Würde ein Kauf dieses Limit überschreiten, wird er abgelehnt, bevor Geld oder Material abgezogen werden."\
  ""
  "Auf der Karte jedes Spielers werden sämtliche High-Command-Gruppen als grüne Symbole dargestellt. Eigene Gruppen erscheinen in voller Stärke, die Gruppen anderer Spieler hingegen abgeblendet. Über die Ebenensteuerung der Karte können diese Markierungen bei Bedarf vollständig ausgeblendet werden."\
  ""\
  "Wird eine Gruppe ausgewählt, zeigt die Karte ihren Besitzer, ihre aktuelle Verhaltensweise, die Entfernung zu ihrem Zielpunkt, die Entfernung zum eigenen Spieler sowie die Anzahl der noch lebenden Soldaten an."\
  ""\
  "Eigene Gruppen können direkt zu der Position unter dem Kartenzeiger befohlen werden. Ihre Verhaltensweise lässt sich zwischen drei Modi umschalten: Defend hält das zugewiesene Gelände, Patrol führt die Gruppe auf einer Patrouillenroute um diesen Punkt und Attack lässt sie das Gebiet nach Feindkräften absuchen."\
  ""\
  "Befindet sich eine Gruppe auf dem Marsch, wird eine gestrichelte Linie zu ihrem Ziel angezeigt. Bei Feindkontakt erscheint eine entsprechende Markierung am Gruppensymbol. Ist die Munition aufgebraucht, wird zusätzlich ein Munitionssymbol eingeblendet."\
  ""\
  "Der Versuch, einer Gruppe eines anderen Spielers Befehle zu erteilen, wird abgewiesen."\
  ""
  "Gruppen verwalten im Overthrow-Hauptmenü zeigt alle Gruppen an, die dem Spieler unterstehen, einschließlich ihres aktuellen Status und der Anzahl belegter Soldatenplätze."\
  ""\
  "Von dort aus kann eine Gruppe auf der Karte angezeigt oder nach einer Bestätigung aufgelöst werden. Beim Auflösen werden die Gruppe selbst, ihr Fahrzeug und sämtliche zugewiesenen Befehle dauerhaft aus der Spielwelt entfernt."\
  ""
  "Eine Gruppe, die sich in der Nähe eines registrierten Lagerhauses aufhält, ergänzt in regelmäßigen Abständen selbstständig ihre Magazine aus den dort eingelagerten Beständen."\
  ""\
  "Verfügt die Gruppe über ein Fahrzeug und steht dieses in der Nähe einer Treibstoffquelle, wird dessen Tank auf dieselbe Weise automatisch aufgefüllt. Die Kosten werden dem Besitzer der Gruppe zum gleichen Preis berechnet, den auch ein Spieler beim manuellen Betanken zahlen würde."\
  ""\
  "Ein vom Widerstand errichtetes Treibstoffdepot stellt den Kraftstoff dagegen kostenlos bereit."\
  ""
  "Rekruten, die eine Stellung halten, können an das Obere Kommando übergeben werden, anstatt weiterhin einzeln verwaltet zu werden."\
  ""\
  "Im Menü Rekruten verwalten werden alle Rekruten mit Haltebefehl nach ihrem jeweiligen Standort zusammengefasst. Für jede dieser Gruppen steht die Aktion In Oberes Kommando umwandeln zur Verfügung."\
  ""\
  "Die Umwandlung ist endgültig. Die betreffenden Rekruten werden aus der persönlichen Rekrutenliste entfernt und geben ihre belegten Rekrutenplätze wieder frei. Ihre Namen sowie die Erfassung von Erfahrung und Fähigkeiten werden mit ihren bisherigen Einträgen beendet."\
  ""\
  "Die Soldaten selbst bleiben jedoch erhalten und werden als neue Gruppe des Oberen Kommandos weitergeführt. Ihre bereits getragene Ausrüstung behalten sie vollständig bei."\
  ""
  "Stützpunkte, Lager und FOBs erhalten keine separat gekaufte Garnison mehr. Die entsprechenden Menüs zum Erwerb einer Garnison wurden entfernt."\
  ""\
  "Gelände wird stattdessen gehalten, indem eine Gruppe des Oberen Kommandos dort in der Verhaltensweise Verteidigen stationiert wird. Im Gegensatz zu einer Garnison kann eine solche Gruppe jederzeit wieder abgezogen und an einen anderen Ort befohlen werden."\
  ""\
  "Wird eine Kampagne geladen, die noch vor dieser Änderung gespeichert wurde, werden die früheren Garnisonen nicht übernommen."\
  ""
  "Obere Kommando"
  "Öffne das Hauptmenü mit <color rgba='226,168,79,255'><action name=\"OverthrowMainMenu\"/></color>, um auf die meisten Funktionen von Overthrow zuzugreifen."
  "Das Menü öffnet sich mit der Stadt, in der du dich befindest, einschließlich ihrer Bevölkerung, Stabilität und Anzahl an Unterstützern sowie dem Protokoll der letzten Benachrichtigungen.<br/>Von hier aus erreichst du Karteninformationen und Schnellreise, Platzieren und Bauen, das Widerstandsmenü, Aufträge, das Immobilienmenü für das Gebäude, in dem du dich befindest, die Rekrutenverwaltung, deinen Charakterbogen, den zuletzt angezeigten Tipp und die Option zum Speichern der Kampagne.<br/>Einige Einträge funktionieren nur unter den richtigen Umständen: Immobilien bleibt ausgegraut, solange das Gebäude, in dem du dich befindest, nicht besessen werden kann; Tipps bleibt ausgegraut, bis ein Tipp angezeigt wurde; und Speichern ist auf Offiziere beschränkt. Wenn du neben bestimmten Orten stehst, beispielsweise an einem Ladentresen, öffnet sich stattdessen das eigene Menü dieses Ortes."
  "Hauptmenü"
  "Busreisen"
  "Die Karte bietet den Überblick über die Kampagne. Neben dem Gelände zeigt sie Gebäude und Fahrzeuge in deinem Besitz, vom Widerstand platzierte Camp und FOBs sowie bekannte Geschäfte, Waffenhändler und Häfen. Nur wenn du eine Karte im Inventar trägst, können die Optionen für Karteninformationen und Schnellreise verwendet werden."
  "Das Fenster nennt die dem angeklickten Punkt nächstgelegene Stadt und zeigt ihre Bevölkerung, ihre Entfernung zu dir, ihre Stabilität und die Anzahl ihrer Unterstützer sowie die Modifikatoren, die Stabilität und Unterstützung dieser Stadt derzeit erhöhen oder senken."
  "Schnellreise ist an Bedingungen geknüpft. Das Ziel muss sich neben etwas befinden, das der Widerstand hält: einem Haus, das dir gehört oder das du mietest, einem deiner eigenen Camps oder einem öffentlichen Camp, einem FOB oder einer vom Widerstand kontrollierten Basis. Außerdem muss das Ziel weit genug von deinem aktuellen Standort entfernt sein. Schnellreise wird verweigert, solange du einen Fahndungslevel hast, und eine aktive schnelle Eingreiftruppe kann sie abhängig von den Schwierigkeitseinstellungen der Kampagne blockieren."
  "Die Gebühr wird durch eine Schwierigkeitseinstellung bestimmt und ist kein fester Preis. Rekruten in deiner Nähe reisen mit dir, wenn du zu Fuß bist, und jeder von ihnen verursacht dieselbe Gebühr zusätzlich. Schnellreise aus einem Fahrzeug heraus funktioniert nur, wenn du der Fahrer bist."
  "Bushaltestellen bieten eine eigene Möglichkeit, die Karte zu überqueren. Beim Nehmen eines Busses wird die Karte geöffnet, sodass ein Ziel in der Nähe einer anderen Bushaltestelle ausgewählt werden kann. Der Fahrpreis wird pro zurückgelegtem Kilometer zu einem von den Schwierigkeitseinstellungen bestimmten Tarif berechnet. Bei Busreisen wird weder dein Fahndungslevel geprüft noch, ob der Widerstand das Gebiet hält. Du musst dich jedoch außerhalb eines Fahrzeugs befinden und jeder Rekrut in deiner Nähe verursacht seinen eigenen Fahrpreis."
  "Die Karte und Schnellreise"
  "Einfluss"
  "Wenn du einen Ort auf der Karte auswählst – entweder indem du mit dem Mauszeiger über seine Markierung fährst oder sie anklickst, um das Informationsfenster geöffnet zu halten – werden gestrichelte Linien zu anderen Orten angezeigt, mit denen er in einer Einflussbeziehung steht. Wählst du eine Stadt aus, führen Linien von den Funktürmen und Militärbasen zu ihr, deren Reichweite sie erfasst, sowie für revolutionären Schwung zwischen ihr und jeder ausreichend nahen Stadt. Dieser verläuft von einer vom Widerstand gehaltenen Stadt zu einer nahegelegenen besetzten Stadt. Wählst du einen Funkturm oder eine Militärbasis aus, führt eine Linie zu jeder Stadt innerhalb ihrer Reichweite. Zusätzlich zeigt ein gestrichelter Ring, wie weit diese Reichweite reicht; der Ring ist nur eine Kontur und keine ausgefüllte Fläche, damit die Karte darin lesbar bleibt. Bei allen anderen Objekten – etwa einem Haus, Geschäft, vorgeschobenen Stützpunkt, Fahrzeug oder einer Bushaltestelle – werden keine Linien angezeigt, da diese weder Einfluss ausüben noch empfangen. Jede Linie trägt die Farbe der Fraktion, die den Einfluss ausübt: des Besitzers des Turms oder der Basis beziehungsweise der Stadt, von der der revolutionäre Schwung ausgeht. Es ist dieselbe Farbe, in der auch die Markierung dieses Ortes dargestellt wird."
  "Eine hell dargestellte Linie mit langen Strichen zeigt einen Einfluss an, den die Kampagne derzeit tatsächlich anwendet. Die erreichte Stadt führt ihn in ihrem Informationsfenster als \"Nahegelegener Funkturm\", \"Nahegelegene Basis\" oder \"Revolutionärer Vormarsch\" auf. Eine dunkler dargestellte Linie mit kürzeren und weiter auseinanderliegenden Strichen bedeutet, dass die Beziehung besteht, von der Kampagne aber momentan nicht angewendet wird. Dafür gibt es derzeit zwei Ursachen, wobei keine davon das vollständige System ausmacht. Zum einen kann eine feindliche Quelle eine freundliche Quelle desselben Typs überwiegen: Ein einziger besetzender Turm oder eine feindliche Basis in Reichweite schlägt beliebig viele freundliche, sodass sich eine Stadt innerhalb der Reichweite eines freundlichen Turms befinden und trotzdem den negativen Eintrag tragen kann. Zum anderen kann ein sabotierter Funkturm betroffen sein, der für niemanden sendet, solange er außer Betrieb ist. Die Einblendung fasst lediglich Beziehungen, die bereits in den Ortsfenstern aufgeführt werden, in einem Bild zusammen, anstatt neue Informationen aufzudecken, und verändert nichts an der Kampagne. Sie besitzt im Kartenfilter eine eigene Zeile namens \"Influence\" und wird wie die anderen Einblendungen in deinem Profil gespeichert."
  "Du musst eine Karte im Inventar haben, um sie mit <color rgba='226,168,79,255'><action name=\"GadgetMap\"/></color> zu öffnen. Overthrow markiert darauf Städte, Basen, FOBs, Camp, Häuser, Geschäfte, Waffenhändler, Lagerhäuser, Häfen, Funktürme, Bushaltestellen, deine Fahrzeuge und deine Wegpunkte. Bewege den Kartenzeiger über eine Markierung, um ein Informationsfenster zu diesem Ort anzuzeigen, und klicke auf die Markierung, damit das Fenster geöffnet bleibt. Durch Klicken auf einen leeren Bereich der Karte wird es wieder gelöst."
  "Karte filtern"
  "Ein Filtereintrag in der Symbolleiste auf der linken Seite der Karte öffnet ein Fenster mit Zeilen, die ein- und ausgeschaltet werden können. Jede Markierungskategorie besitzt eine solche Zeile – von Städten und Basen bis hin zu Häusern, Bushaltestellen und deinen eigenen Fahrzeugen – ebenso wie jede darunter dargestellte Einblendung, also die Gebietsschattierung und die Ringe für Sperrgebiete. Spielermarkierungen haben bei Schwierigkeitseinstellungen, die sie anzeigen, eine eigene Zeile. Wenn du eine Zeile deaktivierst, wird diese Kategorie sofort ausgeblendet, während die Karte geöffnet bleibt; aktivierst du sie erneut, erscheint sie wieder. Zu Beginn ist alles eingeschaltet. Eine aktivierte Kategorie behält dennoch ihre eigene Zoomgrenze, sodass kleinere Markierungen weiterhin erst beim Heranzoomen erscheinen. Das Fenster kann sowohl mit einem Controller als auch mit der Maus geöffnet und bedient werden."
  "Was du ausblendest, wird in deinem Spielprofil gespeichert und nicht in einer bestimmten Kampagne. Dadurch erwarten dich dieselben Einstellungen, wenn du die Karte in einer späteren Sitzung oder in einer beliebigen anderen Kampagne bzw. auf einem anderen Server wieder öffnest. An der Kampagne selbst ändert sich nichts: Der Filter bestimmt nur, was für dich dargestellt wird, und alle anderen sehen jeweils das, was sie selbst ausgewählt haben."
  "Gebiet"
  "Die Karte schattiert das Gebiet, das weiterhin von der Besatzungsmacht gehalten wird, in der Farbe dieser Fraktion. Vom Widerstand eingenommenes Gebiet bleibt unmarkiert, sodass die Schattierung im Verlauf einer Kampagne zurückgeht und auf einer vollständig befreiten Insel ganz verschwindet. Die Regionen werden anhand von Städten, Militärbasen, Funktürmen und Widerstands-FOBs berechnet. Je größer ein Standort ist, desto weiter reicht sein Gebiet: Eine Basis erstreckt sich weiter als eine Stadt und eine Hauptstadt weiter als ein Dorf. An der Küste endet das Gebiet, Flüsse und Binnenseen teilen es jedoch nicht."
  "Wo besetztes Gebiet auf vom Widerstand gehaltenes Gebiet trifft, wird die Grenze als Band dargestellt; an einer Küstenlinie gibt es kein solches Band. Eine Region mit diagonaler Schraffur gilt als umkämpft: Die Besatzungsmacht hält sie noch, aber mindestens die Hälfte der Stadtbevölkerung unterstützt den Widerstand. Dabei wird derselbe Unterstützungswert verwendet, der auch im Informationsfenster der Stadt angezeigt wird. Nur Städte können auf diese Weise dargestellt werden, da Basen, Funktürme und FOBs keine Bevölkerung besitzen, die ausgewertet werden könnte. Die Schattierung prüft alle paar Sekunden neu, wer welches Gebiet hält, sodass Gebietswechsel sichtbar werden, ohne die Karte schließen zu müssen."
  "Verluste bleiben verloren"
  "Patrouillen bleiben in Bewegung"\
  ""
  "Funktürme"
  "Verteidigung eines Stützpunkts"\
  ""
  "Panzerung und Kontrollpunkte"\
  ""
  "Die Besatzungsfraktion hält ständig Kräfte im Einsatz: Sicherungskräfte an den von ihr gehaltenen Militärbasen, Fußpatrouillen in den weiterhin kontrollierten Ortschaften, Fahrzeugpatrouillen auf den Straßen sowie eine Garnison an jedem von ihr besetzten Funkturm."\
  ""\
  "Basissicherung, Fahrzeugpatrouillen und Turmgarnisonen werden aus demselben Ressourcenpool finanziert. Verfügt eine Fraktion nur über begrenzte Mittel, kann sie entsprechend weniger Kräfte jeder dieser Kategorien einsetzen. Fußpatrouillen innerhalb einer Ortschaft verursachen hingegen keine Ressourcenkosten."\
  ""
  "Bewaffnete Fahrzeuge werden ebenfalls in Gefechte verlegt. Wird um eine Basis oder eine Ortschaft gekämpft, kann die Fraktion bis zu zwei Fahrzeuge über die Straße aus einem eigenen Stützpunkt beziehungsweise einem selbst gehaltenen Gebiet heranführen. Ihre Ankunft richtet sich nach der tatsächlichen Fahrzeit; dadurch treffen sie erst nach den zu Fuß vorgerückten Kräften ein. Zudem kann die Anmarschstraße vom Gegner überwacht oder für einen Hinterhalt genutzt werden."\
  ""\
  "Wird ein Fahrzeug aufgehalten oder ausgeschaltet, bedeutet dies nicht automatisch den Verlust der transportierten Kräfte: Die Soldaten sitzen ab und setzen den Marsch zu Fuß fort. Der Verlust eines Fahrzeugs im offenen Gelände macht den betreffenden Raum zudem zu einem möglichen Schwerpunkt für weitere Aufklärung oder Sicherungsmaßnahmen; ein weiteres Fahrzeug kann dorthin entsandt werden, um das Gebiet für eine gewisse Zeit abzusuchen, bevor es wieder abzieht."\
  ""\
  "Ein Panzerabwehrwerfer beginnt sich hinsichtlich seines Gewichts beziehungsweise seiner Belastung etwa ab der Mitte einer Kampagne zu lohnen."\
  ""
  "Soldaten, die aus einer Patrouille, einer Basissicherung oder einer Turmgarnison heraus getötet werden, sind dauerhaft verloren. Wird die betreffende Einheit nicht mehr beobachtet und später erneut aufgeklärt, kehrt sie nur mit den Soldaten zurück, die das letzte Gefecht überlebt haben. Auch das Speichern und erneute Laden einer Kampagne stellt keine Einheit in voller Sollstärke wieder her; es erscheinen dieselben Überlebenden wie zuvor."\
  ""\
  "Eine Basis verbleibt damit in genau dem Zustand, in dem sie zurückgelassen wurde. Wird eine Einheit bis auf den letzten Mann aufgerieben, kann sie zu einem späteren Zeitpunkt ersetzt werden. Die Kosten dafür trägt die Fraktion, die sie eingesetzt hat."\
  ""
  "Eine Ortsstreife setzt ihren Streifengang unabhängig davon fort, ob sich jemand in ihrer Nähe befindet. Ist kein Beobachter vor Ort, läuft sie weiterhin dieselbe Route ab. Sie wartet daher nicht zwangsläufig an der Stelle, an der sie zuletzt gesehen wurde, sondern befindet sich beim erneuten Antreffen an dem Punkt der Strecke, den sie inzwischen erreicht hat."\
  ""\
  "Streifen entlang des Sicherungsbereichs einer Basis verhalten sich ebenso. Anders verhält es sich mit einer Garnison an einem Funkturm: Sie hält die ihr zugewiesene Stellung. Gleiches gilt für die Kräfte in den Kampfstellungen einer Basis, auf deren Türmen sowie an ihren Kontrollpunkten."\
  ""
  "Ein von der Besatzungsfraktion gehaltener Funkturm wechselt erst dann den Besitzer, wenn seine gesamte Garnison gefallen ist – und nicht vorher. Die bloße Anwesenheit am Turm bewirkt nichts. Auch ein Rückzug und späteres Zurückkehren setzt das Gefecht weder zurück noch beendet es: Die Verluste der Garnison bleiben bestehen, und der Turm gilt so lange als besetzt, bis auch der letzte Verteidiger ausgeschaltet ist."\
  ""\
  "Der Vorgang funktioniert auch in umgekehrter Richtung. Befindet sich ein von der Widerstandsfraktion gehaltener Funkturm in der Nähe eines aktuellen Operationsziels der Besatzer, können diese ein eigenes Kommando zur Rückeroberung entsenden. Der Turm fällt jedoch erst dann wieder an die Besatzer, wenn sich dieses Kommando nach Ablauf der erforderlichen Haltezeit noch am Turm befindet. Die eigene Anwesenheit vor Ort unterbricht den laufenden Einnahmezeitgeber."\
  ""
  "Ein Funkturm kann auch völlig unbesetzt vorgefunden werden. Die Garnison wird aus den Reserven der jeweiligen Fraktion gestellt. Ist eine Fraktion personell oder materiell stark gebunden, bleiben daher einzelne Türme ungesichert. Erholt sich ihre Ressourcenlage, kann sie später auch an einem Funkturm wieder eine Garnison stationieren, der noch Tage zuvor unbewacht war."\
  ""\
  "Solange irgendwo auf der Insel ein Gefecht im Gange ist, werden keine neuen Kräfte aufgestellt. Dasselbe gilt, wenn überhaupt kein Spieler verbunden ist. Bereits eingesetzte Kräfte bleiben jedoch bestehen und führen ihren bisherigen Auftrag unverändert fort."\
  ""
  "Eine Militärbasis wird mit den Kräften und Mitteln gehalten, die ihre Besitzer dort tatsächlich aufbringen konnten. Eine Patrouille sichert den äußeren Bereich, Soldaten besetzen vorbereitete Kampfstellungen, Wachposten stehen auf den Türmen, Scharfschützen beziehen vorgesehene Positionen, an den Zufahrtsstraßen werden Kontrollpunkte eingerichtet, innerhalb der Umzäunung entstehen Sandsackstellungen und Munitionslager, und Fahrzeuge werden im Basishof abgestellt."\
  ""\
  "Jedes dieser Elemente wird einzeln aus den verfügbaren Ressourcen finanziert, ungefähr in dieser Reihenfolge. Eine Basis erreicht ihre volle Stärke daher erst nach und nach im Verlauf einer Kampagne, anstatt von Beginn an vollständig ausgebaut zu sein. Schwerer ausgerüstete Infanterie sowie ein Panzerabwehrtrupp kommen erst hinzu, wenn der Druck auf die Fraktion groß genug ist, um ihren Einsatz erforderlich zu machen."\
  ""
  "Solange sich jemand innerhalb einer Basis befindet, werden dort keine neuen Kräfte oder Befestigungen aufgestellt. Eine Basis verstärkt sich also nicht unmittelbar vor den Augen des Spielers. Eine gerade erst eroberte Basis oder eine Basis, deren Besitzer nur über geringe Ressourcen verfügen, kann daher zunächst schwach besetzt sein und Wochen später deutlich stärker ausgebaut erscheinen."\
  ""\
  "Verluste innerhalb der Basis bleiben ebenso dauerhaft bestehen wie Verluste bei Patrouillen. Ein einmal geräumter Posten bleibt jedoch nicht zwangsläufig für immer unbesetzt: Überlebende kehren bei der nächsten Beobachtung auf ihre Türme und in ihre Feuerstellungen zurück. Wurde eine Stellung bis auf den letzten Mann vernichtet, kann sie zu einem späteren Zeitpunkt auf Kosten der Fraktion erneut besetzt werden."\
  ""\
  "Eine einzelne Stellung gilt daher nicht dauerhaft als gesäubert. Endgültig entschieden ist die Räumung erst dann, wenn die Basis selbst den Besitzer wechselt."\
  ""
  "Die bewaffneten Fahrzeuge, die die Besatzungsfraktion auf den Straßen einsetzt, werden mit zunehmendem Verlauf der Kampagne schwerer, insbesondere wenn sich die Lage gegen sie entwickelt. Zu Beginn stellt ein bewaffneter Geländewagen meist die stärkste Bedrohung dar. Später kommen bewaffnete Lastwagen oder Spähfahrzeuge hinzu, und in der späten Kampagne schließlich radgestützte gepanzerte Mannschaftstransporter mit Maschinenkanone oder schwerem Maschinengewehr."\
  ""\
  "Jede höhere Fahrzeugklasse kostet die Fraktion ein Mehrfaches der jeweils darunterliegenden. Eine motorisierte Einheit setzt daher nur Fahrzeuge ein, die ihr eigenes Budget zulässt. Ist die Fraktion stark unter Druck oder knapp an Ressourcen, greift sie weiterhin auf die günstigeren Fahrzeuge zurück."\
  ""\
  "Der Schwierigkeitsgrad der Kampagne verschiebt diese gesamte Entwicklung: Auf höheren Schwierigkeitsstufen erscheinen die schwereren Fahrzeuge deutlich früher, als es unter normalen Bedingungen der Fall wäre."\
  ""
  "Ein bewaffnetes Fahrzeug innerhalb des Geländes einer Militärbasis ist keine bloße Dekoration. Es gehört zur dortigen Garnison und steht in ruhigen Phasen unbemannt abgestellt. Beginnt an der Basis ein Gefecht, wird es von einer Besatzung übernommen und in eine Feuerstellung verlegt, die etwas abseits des unmittelbaren Schusswechsels liegt, anstatt direkt in das Gefecht hineinzufahren."\
  ""\
  "Auch ein Fahrzeug, das auf einer Zufahrtsstraße zu einer Ortschaft steht, gegen die die Fraktion derzeit operiert, befindet sich dort mit Absicht. Die mitgeführten Soldaten sitzen ab und verteilen sich im Umfeld, während die Fahrzeugwaffe besetzt bleibt. Das Fahrzeug hält dabei nicht den ganzen Tag dieselbe Zufahrt, sondern verlegt im Abstand von einigen Minuten auf einen anderen Anmarschweg."\
  ""
  "Patrouillen und Garnisonen"\
  ""
  "Ein Feldbett gehört ebenfalls zu dieser Liste und kostet 30. Es bietet dieselbe Schlafmöglichkeit wie ein normales Bett, sodass auch ein Lager oder eine vorgeschobene Operationsbasis (FOB) mit einem Schlafplatz ausgestattet werden kann."\
  ""
  "Importieren"\
  ""
  "Exportieren"\
  ""
  "Ressourcen"\
  ""
  "Ein Hafen wickelt den Handel in größeren Mengen über das Fahrzeug ab, in dem du dich befindest. Sowohl du als auch das Fahrzeug müssen sich dabei innerhalb von 30 Metern um den Hafen befinden. Das Fahrzeug muss über eigenen Stauraum verfügen; illegale oder bewaffnete Fahrzeuge können dort daher überhaupt keinen Handel durchführen."\
  ""\
  "Das Hafenmenü ist in die Bereiche **Import** und **Export** unterteilt."\
  ""
  "Für den Import ist die erste Stufe von Handel erforderlich. Importierte Waren werden dem Stauraum des Fahrzeugs gutgeschrieben, anstatt unmittelbar darin zu erscheinen. Bezahlt wird nur die Menge, die tatsächlich in den verfügbaren Stauraum passt. Hat ein Fahrzeug beispielsweise noch Platz für 50 Gegenstände, werden auch nur 50 berechnet."\
  ""\
  "Waren, die in gewöhnlichen Geschäften nicht erhältlich sind, werden erst ab der fünften Stufe von Handel angeboten oder an einem Hafen, dessen nächstgelegenes Landgebiet vom Widerstand kontrolliert wird."\
  ""
  "Der Export erfolgt aus demselben Fahrzeugstauraum. Für einen Gegenstand zahlt der Hafen nur einen Bruchteil dessen, was sein Import kostet, und der Ausfuhrpreis liegt stets unter dem Preis, zu dem derselbe Gegenstand dort eingekauft werden könnte. Es lohnt sich daher nicht, gewöhnliche Handelswaren aus Geschäften zu kaufen und anschließend wieder zum Hafen zu bringen."\
  ""\
  "Waren, die in normalen Geschäften nicht geführt werden, unterliegen beim Export denselben Voraussetzungen wie beim Import. Gegenstände, für die das Wirtschaftssystem keinen Preis festlegt, können überhaupt nicht exportiert werden."\
  ""
  "Beide Seiten des Hafenmenüs verfügen zusätzlich über einen Reiter **Ressourcen**. Darüber werden Baumaterialien in größeren Mengen in den Frachtraum des Lastwagens ein- beziehungsweise ausgelagert, in dem du dich befindest."\
  ""\
  "Diese Materialien werden getrennt von allen anderen Waren bepreist, und ihre Preise verändern sich im Verlauf der Kampagne, anstatt konstant zu bleiben. Eine vollständige Übersicht dazu bietet die Seite **Ressourcen**."\
  ""
  "Häfen"\
  ""
  "Kauf vor Ort produzierter Waren"\
  ""
  "Besitz eines Standorts"\
  ""
  "Öffentlich und privat"\
  ""
  "Auf der Karte"\
  ""
  "Ein Sägewerk, ein Stahlwerk oder ein Zementwerk kann als Produktionsstandort dienen und ist vor Ort durch ein großes Schild gekennzeichnet. Jeder Standort stellt genau eine Bauressource her und nichts anderes. Einmal pro Spielstunde wird eine festgelegte Menge dieser Ressource dem eigenen Frachtspeicher des Standorts gutgeschrieben – unabhängig davon, ob der Standort jemandem gehört."\
  ""\
  "Die Kapazität dieses Speichers begrenzt die Produktion: Bei den mitgelieferten Standorten beträgt sie **20 Kubikmeter**. Ist der Speicher voll, wird die Produktion angehalten, bis wieder Platz geschaffen wurde."\
  ""\
  "Auch Produktionsraten von weniger als einer Einheit pro Stunde gehen nicht verloren. Bruchteile einer Einheit werden angesammelt und in die nächste Stunde übernommen. Ebenso wird während übersprungener beziehungsweise verschlafener Spielstunden weiterproduziert."\
  ""
  "Solange ein Produktionsstandort niemandem gehört, verkauft er die bis dahin angesammelten Ressourcen. Die Aktion „Bestand kaufen“ zeigt die aktuell verfügbare Menge an und öffnet eine einzeilige Handelsansicht. Der dort verlangte Preis beträgt 80 % des aktuellen Importpreises, den ein Hafen zu diesem Zeitpunkt für dieselbe Ressource berechnet. Damit unterbietet der Produktionsstandort den Hafen."\
  ""\
  "Verkauft wird ausschließlich die Menge, die der Standort tatsächlich produziert und eingelagert hat. Die gekaufte Ladung muss in einen anderen Frachtspeicher übernommen werden, der sich innerhalb von 25 Metern um den Standort befindet. Ist kein geeigneter Frachtspeicher in Reichweite, weist die Anzeige ausdrücklich darauf hin."\
  ""\
  "Kann eine Bestellung nicht vollständig verstaut werden, ist die gewünschte Menge nicht auf Lager oder reichen die verfügbaren Mittel nicht aus, wird der gesamte Kauf abgelehnt. Teilkäufe finden nicht statt."\
  ""
  "Der Standort selbst kann über eine entsprechende Aktion gekauft werden. Der Preis richtet sich nach dem für diesen Standort festgelegten Grundwert und wird mit dem Immobilienmultiplikator des gewählten Schwierigkeitsgrads skaliert. Der auf der Anzeige angegebene Preis ist zugleich der tatsächlich berechnete Kaufpreis."\
  ""\
  "Ein Offizier kann den Standort stattdessen aus Mitteln des Widerstands erwerben. In diesem Fall geht er in den Besitz des Widerstands über."\
  ""\
  "Mit dem Kauf wird der vorhandene Lagerbestand im selben Moment geleert, in dem der Kaufpreis abgezogen wird. Es lohnt sich daher nicht, einen Standort nur wegen der dort eingelagerten Waren zu erwerben."\
  ""\
  "Ein einmal gekaufter Standort kann nicht wieder verkauft werden, verursacht keine laufenden Kosten und wird von der Besatzungsfraktion nicht angegriffen oder zurückerobert."\
  ""
  "Ein von einem Spieler gekaufter Produktionsstandort ist zunächst privat. Bei einem privaten Standort kann nur der Besitzer auf den Lagerbestand zugreifen. Der Besitzer kann den Standort auf öffentlich umstellen; bei einem Standort im Besitz des Widerstands kann dies auch ein Offizier tun. Auf einen öffentlichen oder dem Widerstand gehörenden Standort kann jeder Angehörige des Widerstands zugreifen."\
  ""\
  "Wer keine Zugriffsberechtigung hat, sieht die Aktion „Fracht“ des Standorts weiterhin, sie ist jedoch gesperrt und zeigt den Grund dafür an, anstatt vollständig ausgeblendet zu werden."\
  ""\
  "Ein Standort im Besitz eines Spielers oder des Widerstands stellt den Verkauf vollständig ein. Seine Produktion wird stattdessen für Bauvorhaben verwendet, im Rahmen eines vereinbarten Handels an einen anderen Spieler weitergegeben oder zu einem Hafen gebracht und dort exportiert."\
  ""
  "Produktionsstandorte werden auf der Karte ab derselben Zoomstufe angezeigt wie Ortschaften und Militärbasen. Das Symbol ist weiß, solange der Standort niemandem gehört, grün, wenn er dir selbst gehört, öffentlich ist oder sich im Besitz des Widerstands befindet, und halbtransparent weiß, wenn ein anderer Spieler ihn privat hält."\
  ""\
  "Das Informationsfeld zeigt den aktuellen Status, nach dem Kauf auch den Besitzer, den vorhandenen Lagerbestand im Verhältnis zur Gesamtkapazität, die Produktion pro Stunde und, solange der Standort unbesetzt ist, den Kaufpreis."\
  ""
  "Produktionsstandorte"\
  ""
  "Ammunition Before Money"
  "Paying for the Rest"
  "Carrying the Ammunition"
  "Every armed vehicle carries a Re-arm action, from an armed jeep to an APC to a helicopter gunship. It is one action and one full restock: every turret magazine and every rocket pod the vehicle has comes back full together, and there is no way to refill part of it."
  "A re-arm spends storage before it spends money. It looks in the vehicle's own storage first, then in every storage within twenty five metres that you are allowed to draw from, for the magazines the vehicle's weapons take, and anything it finds there is spent instead of bought. When storage covers the whole re-arm the action reads Re-arm (from storage), costs nothing and works anywhere, so a crew that hauled its own ammunition is not tied to a base."
  "Only what storage cannot cover is bought, and the price is that same share of the full one, so half the magazines covered is half the bill. That bought part is the only part with a place attached to it: the vehicle has to be standing at a built Helipad or a built Garage at a base the resistance holds, or within a hundred metres of a deployed FOB. Anywhere else with something still to buy, the action shows blocked and names the helipad, garage or FOB it wants."
  "Vehicle weapon ammunition can be imported at a port and moved from one storage list to another, but it never comes out into anyone's hands: taking it out reports it as missing and it stays on the list. That is exactly where a re-arm looks for it, so a crate of it on the list of a truck parked alongside counts for as much as a crate on the vehicle's own."
  "Re-arming Vehicles"
  "Rekruten anwerben"
  "Befehle und Gruppen"
  "Erfahrung und Ausrüstung"
  "Rekruten verwalten"
  "Position halten"
  "Ausrüstung tauschen"
  "Deine Rekruten finden"
  "Ausgerüstete Rekruten"
  "Übergabe von Rekruten an das Obere Kommando"\
  ""
  "Zivilisten können als Rekruten angeworben werden und an deiner Seite kämpfen. Rekruten gehören dem Spieler, der sie angeworben hat, bleiben diesem Spieler zwischen Sitzungen erhalten und ein Spieler kann gleichzeitig bis zu sechzehn Rekruten besitzen."
  "Rekruten, die ihre Stellung halten, können ebenfalls an das Obere Kommando übergeben werden. Das Obere Kommando setzt vollständige Gruppen ein, die ein Spieler über die Karte befehligt."\
  ""\
  "Der Abschnitt „Stellung halten“ ist danach unterteilt, wo sich die jeweiligen Rekruten befinden. Jede dieser Gruppen verfügt über die Aktion „An das Obere Kommando übergeben“."\
  ""\
  "Die Übergabe ist endgültig: Die Rekruten werden aus deinem Kader entfernt und ihre Plätze werden frei. Namen, Erfahrung und Fähigkeiten werden anschließend nicht mehr einzeln erfasst. Die betreffenden Soldaten selbst sowie ihre Ausrüstung bleiben jedoch erhalten und dienen in der neu gebildeten Gruppe weiter."\
  ""
  "Ein Zivilist wird angeworben, indem du aus kurzer Entfernung die Rekrutierungsaktion auf ihm gedrückt hältst. Das kostet den in den Schwierigkeitseinstellungen festgelegten Rekrutierungspreis. Ein Rekrutierungszelt, das an einer Basis oder einem FOB gebaut wurde, rekrutiert stattdessen aus der nächstgelegenen Stadt zum halben Preis und verbraucht dabei einen Unterstützer dieser Stadt. Es funktioniert daher nur, solange die Stadt Unterstützung zur Verfügung hat. In beiden Fällen gehört der Rekrut dir, und niemand kann gleichzeitig mehr als sechzehn besitzen."
  "Rekruten treten deiner Gruppe bei und erhalten Befehle über das normale Gruppenbefehlsmenü, genau wie andere KI-Untergebene. Wenn du der Gruppe eines anderen Spielers beitrittst, kommen die Rekruten, die dir gerade folgen, mit und werden von diesem Spieler kommandiert, solange du dort bist. Sie gehören weiterhin dir und unterstehen wieder deinem Befehl, sobald du die Gruppe verlässt oder dich erneut verbindest. Rekruten in einem Umkreis von fünfzig Metern reisen bei einer Schnellreise mit dir, sofern sie nicht ihre Position halten, und jeder von ihnen erhöht den Fahrpreis um denselben Betrag."
  "Rekruten erhalten Erfahrung für das Töten von Soldaten der Besatzungsmacht und steigen in eigenen Stufen auf. Ihre Abschüsse, ihre Stufe und ihr Fortschritt werden neben ihrem Namen angezeigt. Sie beginnen in Zivilkleidung, und über den Ausrüstungsbildschirm kann eine gespeicherte Ausrüstung auf einen Rekruten in der Nähe oder auf alle Rekruten gleichzeitig angewendet werden. Was ein Rekrut bei sich trägt, bleibt bei ihm und ist auch noch vorhanden, wenn er nach dem Laden eines Spielstands zurückkehrt."
  "\"Rekruten verwalten\" im Overthrow-Hauptmenü listet alle von dir angeworbenen Personen zusammen mit ihrer Heimatstadt und der Information auf, ob sie sich derzeit in der Spielwelt befinden. Dort kann ein Rekrut umbenannt, auf der Karte markiert oder entlassen werden. Rekruten bleiben zwischen Sitzungen erhalten: Etwa zehn Minuten nachdem ihr Besitzer die Verbindung trennt, verlassen sie die Spielwelt und werden an derselben Stelle wieder eingesetzt, wenn der Spieler zurückkehrt. Ein getöteter Rekrut ist dauerhaft verloren und sein Platz in der Liste wird wieder frei."
  "Ein Rekrut in deinem Besitz kann angewiesen werden, seine Position zu halten, entweder über eine gedrückt gehaltene Aktion direkt am Rekruten oder über den Schalter im Bildschirm \"Rekruten verwalten\". Ein Rekrut, der seine Position hält, verlässt deine Gruppe und bleibt dort stehen. Er wartet an diesem Ort, statt umherzulaufen, und erwidert Feuer, wenn er angegriffen wird. Rekruten, die innerhalb von fünfzig Metern zueinander ihre Position halten, teilen sich eine einzige Gruppe. Sie gehören weiterhin dir und belegen weiterhin einen deiner sechzehn Plätze, werden bei Schnellreisen nicht mitgenommen und bleiben zurück, wenn du der Gruppe eines anderen Spielers beitrittst. Ein Rekrut in einem Fahrzeug kann nicht angewiesen werden, seine Position zu halten. Nach dem Laden eines Spielstands befinden sie sich wieder dort, wo sie zurückgelassen wurden, und halten weiterhin ihre Position."
  "Ein Rekrut, der dir folgt, besitzt die Aktion \"Ausrüstung tauschen\". Sie kann aus kurzer Entfernung verwendet werden und tauscht deine gesamte Ausrüstung mit seiner: Kleidung, Panzerung, Rucksack und Waffen samt jeweiligem Inhalt. Dabei werden die tatsächlichen Gegenstände verschoben und nicht kopiert, sodass dadurch nichts erzeugt oder vernichtet werden kann. Passt ein Ausrüstungsteil nicht an die vorgesehene Stelle, wird es anderswo verstaut oder im ungünstigsten Fall auf dem Boden abgelegt. Die anschließende Meldung weist dann darauf hin, dass der Tausch nur teilweise durchgeführt wurde. Ein Rekrut, der seine Position hält, bietet diese Aktion nicht an."
  "Die Karte besitzt eine Ebene \"Rekruten\", die für jeden deiner Rekruten eine Markierung anzeigt. Rekruten, die dir folgen, werden mit voller Stärke dargestellt, Rekruten, die ihre Position halten, abgeblendet. Ein Abzeichen zeigt außerdem an, ob ein Rekrut bewaffnet ist und noch Munition besitzt. Diese Ebene kann im Ebenenfenster der Karte ausgeschaltet werden, und die Auswahl bleibt zwischen Sitzungen gespeichert. Der Bildschirm \"Rekruten verwalten\" zeigt dieselbe Aufteilung in den Bereichen \"Aktiv\" und \"Halte Position\", mit einem Statussymbol in jeder Zeile und einer Anzeige, wie viele deiner sechzehn Plätze belegt sind."
  "Ein Rekrutierungszelt besitzt eine zweite Aktion, \"Rekruten mit Ausrüstung kaufen\". Sie öffnet deine gespeicherten Ausrüstungen und zeigt neben jeder einen Preis an. Wenn du eine Ausrüstung auswählst, wird angezeigt, wie viele Gegenstände sie enthält und was das Gesamtpaket kostet: der Betrag, den diese Ausrüstung in einem Geschäft in der Nähe des Zelts erzielen würde, zuzüglich einer in den Schwierigkeitseinstellungen festgelegten Komfortgebühr und der normalen Rekrutierungskosten des Zelts. Beim Kauf erscheint der Rekrut neben dem Zelt und trägt die Ausrüstung bereits. Wie jeder andere Zelt-Rekrut verbraucht er einen Unterstützer der Stadt und einen Platz in deiner Rekrutenliste. Enthält eine Ausrüstung einen Gegenstand, den die Geschäfte nicht führen, kann kein Preis berechnet werden und die Auswahl wird unter Nennung dieses Gegenstands abgelehnt. Erscheint der Rekrut ohne irgendeinen Teil seiner Ausrüstung, wird nur der Rekrut selbst berechnet."
  "Rekruten"
  "Öffnet ein Menü, in dem du Informationen über den Widerstand ansehen oder dessen Einstellungen ändern kannst. Offiziere können hier andere Offiziere ernennen oder einen Steuersatz festlegen (Standard: 0 %), durch den ein Anteil des regulären Einkommens direkt in die Widerstandskasse eingezahlt wird. Offiziere können hier Geld aus der Widerstandskasse abheben oder an einen anderen Spieler senden. Außerdem kann jeder Spieler hier Geld für die Bemühungen des Widerstands spenden."
  "Kaufen und Verkaufen an einem Hafen"\
  ""
  "Transportwesen"
  "Kistenstapel"
  "Bauen mit Ressourcen"
  "Lagerhäuser"
  "Holz, Zement, Stahl und Eisenwaren sind Baumaterialien, die in großen Mengen gelagert und transportiert werden. Sie sind keine Gegenstände im Inventar: Ein Lastwagen, ein Kistenstapel oder ein Lagerhaus führt sie als Mengenbestand, gemessen in Kubikmetern."\
  ""\
  "Die vier Ressourcen unterscheiden sich darin, wie viel Platz und Gewicht eine Einheit beansprucht. Holz ist dabei am sperrigsten und günstigsten, Eisenwaren am kompaktesten und teuersten."\
  ""\
  "Häfen verkaufen diese Materialien, Produktionsstandorte auf der Insel stellen sie her, Lastwagen transportieren sie, Kistenstapel lagern sie im Gelände, Lagerhäuser bewahren sie auf, und bestimmte Bauwerke können ohne sie nicht errichtet werden."\
  ""
  "Das Hafenmenü verfügt sowohl auf der Import- als auch auf der Exportseite über einen Reiter „Ressourcen“. Der Preis einer Ressource ist dort nicht fest wie in einem Geschäft, sondern verändert sich im Verlauf der Kampagne. Er kann sich höchstens einmal innerhalb eines Zeitfensters von sechs Spielstunden ändern und bleibt dabei innerhalb einer festgelegten Spanne um seinen Grundpreis. Im Detailfeld wird angezeigt, ob der aktuelle Preis unter, nahe oder über diesem Grundpreis liegt."\
  ""\
  "Steigender Druck durch die Besatzungsfraktion treibt die Preise nach oben, während die Kontrolle der Häfen durch den Widerstand sie senkt. Beim Export zahlt ein Hafen die Hälfte des jeweils aktuellen Marktpreises für eine Ressource."\
  ""\
  "Sowohl Import als auch Export werden über den Frachtspeicher des Lastwagens abgewickelt, in dem du sitzt. Sitzt du in keinem Lastwagen oder ist dessen Frachtraum voll, wird die betreffende Ressource in der Liste deaktiviert angezeigt und der Grund dafür angegeben."\
  ""\
  "Der Schwierigkeitsgrad beeinflusst sowohl das allgemeine Preisniveau als auch die Stärke der Preisschwankungen."\
  ""
  "Lastwagen sind die einzigen Fahrzeuge mit einem Frachtspeicher. Pkw, gepanzerte Transportfahrzeuge und Hubschrauber verfügen daher über keinerlei Frachtaktion."\
  ""\
  "Ein gewöhnlicher Lastwagen fasst 15 Kubikmeter. Die Transportvarianten des M923A1 und des Ural verfügen über 20 Kubikmeter Frachtraum. Der Mobile-FOB-Lastwagen fasst 8 Kubikmeter, da er bereits eine Basis mitführt."\
  ""\
  "Sobald du in einem Lastwagen sitzt, erscheint eine Anzeige mit dem aktuellen Ladebestand und dem bereits belegten Frachtraum. Passt eine Ladung nicht vollständig hinein, wird der gesamte Vorgang abgelehnt. Die Meldung nennt dabei den noch verfügbaren Platz. Teilkäufe oder nur teilweise durchgeführte Umlagerungen finden nicht statt."\
  ""
  "Ein Frachtspeicher öffnet eine Ansicht mit den Bereichen „Entnehmen“ und „Einlagern“ sowie einer Liste aller nahegelegenen Ziele, zu denen die Ladung bewegt werden kann, sortiert nach Entfernung."\
  ""\
  "Unter „Entnehmen“ steht auch der Boden als Ziel zur Verfügung. Wird eine Ladung dort abgelegt, erscheint vor dir ein Kistenstapel. Wird eine weitere Ladung innerhalb weniger Meter davon abgelegt, wird sie dem bestehenden Stapel hinzugefügt, anstatt einen neuen zu erzeugen."\
  ""\
  "Ein Kistenstapel besitzt keine eigene Kapazitätsgrenze. Er wird auf der Karte mit seinem Inhalt und seinem Volumen angezeigt, lässt sich wie jeder andere Frachtspeicher öffnen und verschwindet, sobald er vollständig geleert wurde."\
  ""
  "Die meisten Bauwerke kosten weiterhin ausschließlich Geld und erscheinen unmittelbar nach ihrer Platzierung. Der Hubschrauberlandeplatz, die Garage, das Lagerhaus und die Kaserne benötigen zusätzlich Ressourcen. Wird eines dieser Bauwerke platziert, entsteht stattdessen zunächst eine Baustelle."\
  ""\
  "Das Geld wird bereits bei der Platzierung abgezogen. Die Baustelle bleibt anschließend bestehen, bis die benötigten Materialien zu ihr gebracht wurden. An einer Baustelle stehen zwei Aktionen zur Verfügung: „Anforderungen“ zeigt an, welche Materialien benötigt werden und welche davon sich in Reichweite befinden. Mit „Bauen“ wird das Bauwerk fertiggestellt. Dabei werden Kistenstapel innerhalb eines Radius von 30 Metern verwendet, wobei die nächstgelegenen zuerst geleert werden."\
  ""\
  "Für eine Baustelle zählen ausschließlich Kistenstapel als verfügbare Ressourcen. Eine Ladung, die sich noch auf einem Lastwagen oder in einem Lagerhaus befindet, gilt daher nicht als in Reichweite."\
  ""\
  "Wird eine Baustelle entfernt, werden weder Geld noch Materialien zurückerstattet. Der Schwierigkeitsgrad beeinflusst außerdem die für ein Bauwerk benötigte Ressourcenmenge."\
  ""
  "Ein Lagerhaus bewahrt neben den bereits darin gelagerten Gegenständen auch Ressourcen auf, die über eine eigene Aktion verwaltet werden. Weder für die Gegenstände noch für die Ressourcen besteht eine Kapazitätsgrenze."\
  ""\
  "Auch der Widerstand kann ein Lagerhaus errichten. Dafür werden Geld sowie alle vier Ressourcen benötigt. Es kann auf einer vom Widerstand gehaltenen Militärbasis und innerhalb einer vom Widerstand kontrollierten Ortschaft gebaut werden. Damit ist das Lagerhaus das einzige Bauwerk, dessen Bauliste über Militärbasen, FOBs und Lager hinaus auch Ortschaften umfasst."\
  ""\
  "In einer noch von der Besatzungsfraktion gehaltenen Ortschaft kann kein Lagerhaus gebaut werden. Dasselbe gilt für Dörfer."\
  ""\
  "Nach seiner Fertigstellung funktioniert es wie jedes andere Lagerhaus: Es wird auf der Karte angezeigt, besitzt eine entsprechende Eigentumszuordnung und kann dieselben Gegenstände und Ressourcen lagern."\
  ""
  "Ressourcen"
  "Eine Ruine hat keine Funktion"\
  ""
  "Die Ausrüstung im Inneren bleibt erhalten."\
  ""
  "Wiederaufbau"
  "Auch die Gegenseite repariert"
  "Ein Bauwerk, das von der Besatzungsfraktion auf einer deiner Basen zerstört wird, verschwindet nicht. Es wird durch eine Explosion zerstört, eine Rauchsäule steigt auf, und die Überreste bleiben an derselben Stelle als Ruine stehen."\
  ""\
  "Wird die Kampagne gespeichert und später erneut geladen, bleibt die Ruine als Ruine erhalten. Ein bereits wiederhergestelltes Bauwerk erscheint nach dem Laden hingegen weiterhin repariert."
  "Eine Ruine ist vollständig funktionslos. An einem zerstörten Treibstoffdepot kann nicht mehr aufgetankt werden, aus einem eingestürzten Zelt können keine Rekruten mehr angeworben werden, in einem zerstörten Sanitätszelt ist keine Behandlung mehr möglich, und eine ruinierte Garage bietet weder einen Shop noch Parkmöglichkeiten. Auch auf die zuvor dort gelagerten Gegenstände kann nicht mehr zugegriffen werden."\
  ""\
  "Zapfsäulen und Reparaturbereiche reagieren zudem nicht mehr auf entsprechende Fahrzeugaktionen. Solange das Bauwerk nur noch eine Ruine ist, funktioniert dort überhaupt nichts."
  "Nichts, was in einem Bauwerk gelagert ist, geht bei dessen Zerstörung verloren. Behälter und ihr Inhalt überstehen die Zerstörung unbeschädigt; lediglich der Zugriff darauf ist nicht mehr möglich."\
  ""\
  "Wird das Bauwerk wiederhergestellt, sind die Lager wieder zugänglich und enthalten weiterhin alles genau dort, wo es zuvor zurückgelassen wurde."
  "Eine Ruine verfügt über eine Reparaturaktion, die 20 Sekunden lang ausgeführt werden muss. Die Kosten werden direkt bei der Aktion angezeigt."\
  ""\
  "Die Reparatur kostet einen Anteil der ursprünglichen Baukosten und wird nach demselben Schwierigkeitsgrad skaliert wie der Baupreis: Auf Leicht und Normal werden 50 % der Baukosten fällig, auf Schwer 75 % und auf Extrem sowie Wahnsinnig der volle Baupreis."\
  ""\
  "Vor Beginn wird geprüft, ob genügend Geld vorhanden ist. Der Betrag wird erst nach Abschluss der Reparatur abgezogen. Reichen die Mittel nicht aus, wird die Reparatur abgelehnt, anstatt nur teilweise durchgeführt zu werden."
  "Die Besatzungsfraktion verfährt auf von ihr gehaltenem Gebiet ebenso. Steht auf einer ihrer Basen ein Bauwerk als Ruine, wird ein Reparaturtrupp dorthin entsandt. Dieser stellt die zerstörten Bauwerke nacheinander wieder her, beginnend mit dem günstigsten. Eine besondere Meldung darüber erfolgt nicht."\
  ""\
  "Die Reparaturarbeiten werden jedoch nur fortgesetzt, solange sich niemand in unmittelbarer Nähe befindet. Befindet sich ein Spieler innerhalb von etwa 150 Metern um das Zentrum der Basis, werden die Arbeiten an ihrem aktuellen Stand unterbrochen."
  "Ruinen und Reparaturen"
  "Woher das Geld kommt"
  "Preise"
  "Bestand"
  "An Geschäfte verkaufen"
  "In Städten gibt es Geschäfte, die Waren sowohl von dir kaufen als auch an dich verkaufen. Was ein Geschäft führt, hängt von seiner Art ab. Der Bestand ist begrenzt und wird jeden Morgen aufgefüllt. Die Preise verändern sich mit der Stadt: Sowohl die örtlich verfügbare Menge eines Gegenstands als auch die Entfernung der Stadt zu einem Hafen beeinflussen seinen Preis."
  "Ein neuer Charakter beginnt mit einem Geldbetrag, der durch die Schwierigkeitseinstellungen der Kampagne festgelegt wird. Danach wird viermal pro Spieltag Einkommen aus den Städten ausgeschüttet: Städte zahlen entsprechend ihrer Bevölkerung und Stabilität Steuern, Städte, die den Widerstand unterstützen, spenden zusätzlich, und Städte, die noch von der Besatzungsmacht gehalten werden, zahlen überhaupt keine Steuern. Zuerst wird die Widerstandssteuer vom Gesamtbetrag abgezogen; der Rest wird unter den zu diesem Zeitpunkt online befindlichen Spielern aufgeteilt. Ist niemand online, geht alles in die Widerstandskasse. Verkäufe in Geschäften, abgeschlossene Aufträge und Mieteinnahmen aus Immobilien in deinem Besitz werden demselben Guthaben hinzugefügt. Dieses Guthaben ist deinem Spieler zugeordnet und wird nicht als Bargeld im Inventar getragen."
  "Jeder Gegenstand besitzt einen Grundpreis. Was ein Geschäft verlangt, ist dieser Preis angepasst an deinen aktuellen Standort. Zwei Dinge beeinflussen ihn: wie gut die umliegende Stadt mit diesem Gegenstand versorgt ist und wie weit sie vom nächsten Hafen entfernt liegt. Dadurch werden Waren umso teurer, je weiter sie ins Landesinnere transportiert wurden. Anschließend schlägt das Geschäft seine Marge auf, weshalb es beim Ankauf eines Gegenstands nie so viel bezahlt, wie es beim Verkauf verlangt. Die Handelsfertigkeit senkt deinen Kaufpreis, während Fahrzeugpreise zusätzlich separat durch die Schwierigkeitseinstellungen skaliert werden."
  "Geschäfte führen nur eine begrenzte Anzahl jedes Gegenstands, und eine Stadt kann von keiner Ware unbegrenzt viel aufnehmen. Ihre Bevölkerung, ihre Stabilität und die Nachfrage nach dem Gegenstand bestimmen gemeinsam die Obergrenze. Im Laufe der Tage kaufen die Einwohner Waren aus den Regalen, sodass der Bestand auch dann sinkt, wenn sonst niemand handelt. Jeden Morgen füllen die Geschäfte ihren Bestand wieder in Richtung dieser Obergrenze auf, und alles, was an ein Geschäft verkauft wird, landet wieder in dessen Warenbestand."
  "Ein Geschäft, das mit nur einer Warenart handelt, kauft auch nur diese Art zurück. Ein Bekleidungsgeschäft hat daher keine Verwendung für ein Gewehr, während Waffen- und Drogenhändler fast alles annehmen, was einen Preis besitzt. Ein getragener, gehaltener oder geschulterter Gegenstand kann nicht verkauft werden, solange er ausgerüstet ist, und ein wertloser Gegenstand kann überhaupt nicht verkauft werden; das Menü nennt jeweils den zutreffenden Grund. Fahrzeughändler und Beschaffungsstellen verkaufen ausschließlich und kaufen nichts an. Auch gewöhnlicher Handel hilft der Stadt: Geschäfte oberhalb eines unbedeutenden Betrags erhöhen die Stabilität dieser Stadt für eine gewisse Zeit."
  "Geld und Geschäfte"
  "Erfahrung sammeln"
  "Stufen und Punkte"
  "Die drei Fertigkeiten"
  "Der Charakterbogen"
  "Für die meisten Dinge, die du für den Widerstand tust, erhältst du Erfahrung. Genug Erfahrung erhöht deine Stufe. Jede Stufe nach der ersten bringt einen Punkt, und diese Punkte werden im Charakterbogen für Fertigkeiten ausgegeben."
  "Erfahrung erhältst du für das Töten von Soldaten der Besatzungsmacht, für das Bauen, für das Platzieren von Gegenständen, für das Abschließen eines Auftrags mit Erfahrungsbelohnung und in kleinen Mengen für Handel in einem Geschäft oder mit einem Händler. Jedes baubare oder platzierbare Objekt besitzt einen eigenen Erfahrungswert, sodass größere Arbeiten mehr einbringen. Handel gewährt nur gelegentlich Erfahrung und nicht bei jeder einzelnen Transaktion. Eine Reihe kleiner Verkäufe am selben Tresen summiert sich daher nicht unbegrenzt. Wenn du getötet wirst, verlierst du Erfahrung, dein Gesamtwert fällt jedoch niemals unter null."
  "Deine Stufe wird anhand deiner gesamten Erfahrung berechnet, wobei jede neue Stufe mehr Erfahrung erfordert als die vorherige. Jede Stufe nach der ersten bringt einen Fertigkeitspunkt. Bereits ausgegebene Punkte werden davon abgezogen. Deine verbleibenden Punkte entsprechen daher deiner Stufe minus eins, abzüglich aller bisher gekauften Fertigkeitsstufen."
  "Handel, Tarnung und Diplomatie besitzen jeweils fünf Stufen, die nacheinander gekauft werden. Handel senkt deine Kaufpreise, schaltet auf der ersten Stufe den Import frei und erweitert ihn auf der fünften Stufe auf Waren, die kein gewöhnliches Geschäft führt. Tarnung verkürzt die Entfernung, aus der die Besatzungsmacht dich erkennt; bei Rekruten wird dafür die Tarnungsfertigkeit ihres Kommandanten verwendet und nicht eine eigene. Diplomatie erhöht die Wahrscheinlichkeit, dass sich ein Zivilist, mit dem du sprichst, dem Widerstand anschließt."
  "Im Charakterbogen, den du über das Overthrow-Hauptmenü erreichst, werden Punkte ausgegeben. Er zeigt deine Stufe, deinen Fortschritt bis zur nächsten Stufe, die Anzahl verfügbarer Punkte sowie jede Fertigkeit mit ihren fünf Stufen und den jeweiligen Vorteilen. Bereits erworbene Stufen sind markiert. Die Schaltfläche zum Kauf der nächsten Stufe erscheint nur, solange du einen freien Punkt besitzt und die Fertigkeit noch eine weitere Stufe haben kann."
  "Fertigkeiten und Stufenaufstieg"
  "Wo ein Bett funktioniert"
  "Die Stunden zählen noch"
  "Zwölf Stunden zwischen den Schlafenszeiten"
  "Wenn es nicht funktioniert"
  "Ein Bett kann zum Schlafen benutzt werden. Dadurch wird die Spielzeit um acht Stunden vorgestellt. Der Bildschirm blendet dabei zu Schwarz über, bleibt einen kurzen Moment schwarz und blendet anschließend wieder ein – nun zur neuen Tageszeit."\
  ""\
  "Schlafen ist ausschließlich im Einzelspielermodus möglich: In einer Mehrspieler-Sitzung steht diese Aktion überhaupt nicht zur Verfügung."
  "Die Aktion erscheint bei einem Bett, das sich in einem Haus in deinem Besitz, in deinem eigenen Camp, an einem errichteten FOB oder innerhalb einer von der Resistance kontrollierten Basis befindet."\
  ""\
  "Ein Bett an jedem anderen Ort bietet keinerlei Interaktionsmöglichkeit. Der Grund dafür ist, dass genau diese vier Orte auch diejenigen sind, an denen die Resistance ihre eigenen Gegenstände platzieren darf."
  "Die acht Stunden werden nachgespielt, statt einfach übersprungen zu werden. Steuern und Spenden werden ausgezahlt, und die Geschäfte in den Städten kaufen ihre Waren jedes Mal ein, wenn innerhalb dieses Zeitfensters eine Sechs-Stunden-Marke überschritten wird. Die Läden füllen ihre Bestände wieder auf, wenn 7 Uhr morgens überschritten wird, und Mietzahlungen werden verarbeitet, wenn Mitternacht überschritten wird."\
  ""\
  "Auch die Besatzungsfraktion läuft währenddessen normal weiter: Sie erhält Ressourcen, gibt sie für ihre Basen aus und baut ihre Bedrohungsstufe Viertelstunde für Viertelstunde ab – genau in der Reihenfolge, in der all das auch passiert wäre, wenn du wach geblieben wärst."\
  ""\
  "Die Benachrichtigungen über Auszahlungen erscheinen dabei bereits auf dem schwarzen Bildschirm und sind noch sichtbar, wenn das Bild wieder eingeblendet wird."
  "Erneutes Schlafen ist erst nach zwölf Spielstunden möglich. Diese Frist beginnt in dem Moment, in dem du wieder aufwachst – nicht bereits dann, wenn du dich schlafen legst."\
  ""\
  "Diese zwölf Stunden müssen vollständig im wachen Zustand vergehen. Zusammen mit den acht Stunden, die durch das Schlafen selbst vergehen, liegen somit insgesamt zwanzig Spielstunden zwischen zwei Schlafvorgängen."\
  ""\
  "Solange die zwölfstündige Wartezeit noch nicht abgelaufen ist, bleibt die Aktion am Bett sichtbar. In ihrer Bezeichnung wird dabei angezeigt, wie viel Zeit bis zum nächsten möglichen Schlafen noch verbleibt."
  "Während ein Angriff läuft oder solange nach dir gefahndet wird, bleibt die Schlafaktion am Bett sichtbar, lässt sich jedoch nicht ausführen. Dabei wird angegeben, welcher der beiden Gründe das Schlafen gerade verhindert."\
  ""\
  "Anders verhält es sich bei einem Bett an einem Ort, den die Resistance nicht kontrolliert: Dort wird die Schlafaktion gar nicht erst angezeigt, anstatt lediglich verweigert zu werden."
  "Schlafen"
  "Was über Stauraum verfügt"
  "Gegenstände entnehmen"
  "Gegenstände einlagern"
  "Be- und Entladen"
  "Lagerhäuser"
  "Munitionskisten, Lagerhäuser und die meisten legalen Radfahrzeuge verfügen über eigenen Stauraum. Dieser besteht aus einer Liste der darin gelagerten Gegenstände, die im Kampagnenstand gespeichert werden, anstatt lose im Inneren des Behälters oder Fahrzeugs zu liegen."\
  ""\
  "Die Aktion „Stauraum“ zeigt an, wie viele Gegenstände sich auf dieser Liste befinden. Beim Öffnen erscheint die Bestandsliste, ein Warenkorb zum Zusammenstellen der gewünschten Gegenstände sowie eine Auswahl des Ziels, an das der Warenkorb übertragen werden soll."
  "Der Stauraum eines Lastwagens ist unbegrenzt, während ein gewöhnlicher Pkw bis zu 300 Gegenstände aufnehmen kann. Auch Munitionskisten und Lagerhäuser besitzen keine feste Kapazitätsgrenze und nehmen so viele Gegenstände auf, wie darin eingelagert werden."\
  ""\
  "Illegale oder bewaffnete Fahrzeuge verfügen über keinen Stauraum. Gleiches gilt für Hubschrauber. Entsprechend erscheint bei ihnen auch keine Aktion „Stauraum“"
  "Der Warenkorb kann an eine von zwei Arten von Zielen übertragen werden. Mit „Dieser Behälter“ werden die Gegenstände in das eigene Inventar des Behälters gelegt, wo sie anschließend von Hand aufgenommen werden können."\
  ""\
  "Jeder andere Stauraum innerhalb von 25 Metern übernimmt die Gegenstände dagegen direkt in seine eigene Bestandsliste, ohne dass sie zwischendurch als Gegenstände erscheinen."\
  ""\
  "Ein Lagerhaus besitzt kein eigenes Inventar. Dort steht daher nur die zweite Möglichkeit zur Verfügung."
  "Mit „Alles in den Stauraum übertragen“ wird der gesamte Inhalt, den der Behälter mitführt, in einem Schritt in Einträge der Lagerliste umgewandelt. Bei einem Lastwagen zählt dazu auch die Ladefläche."\
  ""\
  "Anbauteile und volle Magazine werden dabei als eigenständige Gegenstände eingelagert. Ein bereits angebrochenes Magazin bleibt dagegen an seinem bisherigen Platz."\
  ""\
  "Eine Munitionskiste verfügt außerdem über die nur für Offiziere verfügbare Aktion „Inventar leeren“, mit der alles verworfen werden kann, was nach einer Übertragung zurückgeblieben ist. Mit „Stauraum umbenennen“ erhält der Behälter einen eigenen Namen. Dieser Name wird anschließend in der Zielauswahl aller anderen Behälter in der Nähe angezeigt."
  "Eine Munitionskiste verfügt über zwei weitere Aktionen, die mit dem nächstgelegenen Fahrzeug arbeiten. Mit „Fahrzeug in Stauraum entladen“ werden zunächst alle lose im Fahrzeug mitgeführten Gegenstände in Lagereinträge umgewandelt und anschließend der gesamte Lagerbestand des Fahrzeugs in die Munitionskiste übertragen. So kann beispielsweise ein vom Gefechtsfeld zurückkehrender Lastwagen mit nur einer Aktion vollständig entladen werden."\
  ""\
  "Mit „Stauraum in Fahrzeug laden“ wird dagegen ausschließlich die Lagerliste der Munitionskiste in das Fahrzeug übertragen. Das eigentliche Inventar der Kiste bleibt unberührt. Eine Waffe, die direkt in der Munitionskiste liegt, bleibt daher auch dort."\
  ""
  "Ein Lagerhaus verfügt über dieselbe Aktion „Stauraum“ wie andere Lagerorte. Ein dort abgestelltes Fahrzeug kann außerdem über sein Fahrzeugmenü darauf zugreifen: „Aus Lagerhaus entnehmen“ öffnet dieselbe Ansicht, während „In Lagerhaus einlagern“ zunächst die vom Fahrzeug mitgeführten Gegenstände in Lagereinträge umwandelt und anschließend dessen gesamte Lagerliste in das Gebäude überträgt."\
  ""\
  "Ein Lagerhaus, das niemand gekauft hat, ist für niemanden zugänglich. Ein privates Lagerhaus kann nur von seinem Besitzer geöffnet werden, ein gemietetes nur von dem Spieler, der es gemietet hat."\
  ""\
  "Ein Lagerhaus kann außerdem Baumaterialien lagern. Dafür besitzt es eine eigene Aktion und eine separate Bestandsliste. Weitere Einzelheiten dazu behandelt die Seite „Ressourcen“."\
  ""
  "Lagerung"
  "A Kit Is Not Optional"
  "Structures That Repair Fully"
  "Where the Zone Ends"
  "Damaged vehicles can be repaired in the field, and a repair costs no money and no supplies at all. What it does cost is a repair kit. Nobody repairs anything bare-handed: with no kit in your hands there is no repair action offered, not even standing beside a structure built for the job. Kits are stocked by general stores and gun dealers at around $150, and the car a new campaign starts you with carries one in its trunk."
  "A kit used out in the open brings a damaged part back to half health at most. That is enough to get a wreck rolling again, not enough to make it good as new. Damage is tracked part by part rather than as one figure, so each damaged part is repaired on its own."
  "Three structures the resistance can build repair a part the whole way instead of halfway, for anyone inside their range with a kit in hand. The Vehicle Maintenance Ramp and the Garage reach roughly 12 metres, the Helipad roughly 20. Nothing about a structure narrows what it will fix, so a car parked on the helipad is repaired just as fully as a helicopter."
  "Nothing on screen marks the edge of a repair zone, so distance is the only guide and parking close to the structure keeps you well inside it. Further out, repairs still work off the kit alone and go back to the half-health limit; closer in, they are full again. A structure that has been reduced to a ruin repairs nothing until it is repaired itself."
  "Vehicle Repair"
  "Was Aufmerksamkeit erregt"
  "Gesehen werden"
  "Ihre Uniform tragen"
  "Untertauchen"
  "Wenn du etwas tust, das der Besatzungsmacht missfällt, steigt dein Fahndungslevel, und solange er über null liegt, sucht sie nach dir. Manche Handlungen müssen gesehen werden, damit sie zählen, andere nicht. Sobald dich niemand mehr beobachtet, sinkt der Level Schritt für Schritt. Wie lange jeder Schritt dauert, wird durch die Schwierigkeitseinstellungen bestimmt."
  "Das meiste muss beobachtet werden. Es zählt, wenn du gesehen wirst, während du offen eine Waffe trägst, plünderst, etwas von der Besatzungsmacht Verbotenes aufstellst oder dich in der Nähe einer ihrer Basen oder Funktürme aufhältst. Ebenso zählt es bereits beim ersten Sichtkontakt, wenn deine Kleidung dich als Mitglied oder Unterstützer des Widerstands erkennen lässt. Gewalt braucht keine Zeugen: Wenn du jemanden verwundest, wirst du gesucht; wenn du jemanden tötest, steigt der Level weiter, und beides zerstört eine eventuell getragene Verkleidung. Wird einer ihrer Soldaten getötet, gilt außerdem jeder als verantwortlich, der in einem Fahrzeug direkt neben der Leiche sitzt. Wirst du am Steuer eines bewaffneten Fahrzeugs oder eines mobilen FOB gesehen, steigt der Level erneut, und das Fahrzeug wird von diesem Zeitpunkt an als Widerstandsfahrzeug markiert. Oberhalb der ersten Stufe betrachtet dich die Besatzungsmacht nicht mehr als Zivilisten, sondern greift dich bei Sichtkontakt als Feind an."
  "Ein Augensymbol erscheint auf deinem Bildschirm, solange dich jemand im Dienst der Besatzungsmacht im Blick hat. Es wird je nach Sichtbarkeit stärker oder schwächer eingeblendet. Ihre Leute erkennen dich erst innerhalb einer bestimmten Entfernung, und die Fertigkeit Tarnung verringert diese Reichweite. Für Rekruten gelten dieselben Beobachtungsregeln; bei ihnen wird die Tarnungsfertigkeit ihres Kommandanten verwendet."
  "Wenn du die Ausrüstung der Besatzungsmacht überzeugend genug trägst, halten deren Truppen dich für einen von ihnen und beobachten dich nicht mehr aus der Entfernung. Übrig bleibt nur der Nahbereich: Kommst du ihnen nahe genug und befindest dich in freier Sicht, durchschaut jemand die Tarnung, die Verkleidung fliegt auf und du erhältst einen Fahndungslevel. Auf jemanden zu schießen zerstört die Verkleidung ebenfalls – unabhängig von der Entfernung und davon, ob der Schuss bemerkt wurde. Solange die Verkleidung hält, macht dich allein die Nähe zu einer Basis oder einem Funkturm nicht gesucht. Ein Symbol auf deinem Bildschirm zeigt ihren Zustand an. Wie weit Soldaten eine Verkleidung durchschauen können, wird durch eine Schwierigkeitseinstellung bestimmt."
  "Ein Fahndungslevel sinkt nur, solange dich niemand im Blick hat, jeweils um eine Stufe mit einem Countdown zwischen den einzelnen Schritten. Alles, was dich erneut gesucht macht, setzt den Level sofort auf den Wert, den diese Handlung verursacht, und startet den Countdown neu. Der Level springt also nach oben und sinkt nur schrittweise wieder ab. Für den letzten Schritt bis auf null läuft ein eigener Countdown. Wirst du währenddessen entdeckt, steigt der Level wieder, statt vollständig abzulaufen. Beide Countdowns werden durch Schwierigkeitseinstellungen bestimmt. Schnellreise ist nicht verfügbar, solange dein Fahndungslevel über null liegt."
  "Das Fahndungssystem"
  "Womit du beginnst"
  "Keine feste Reihenfolge"
  "Leben in den Ortschaften"
  "Overthrow ist eine persistente Sandbox-Kampagne auf einer besetzten Insel. Es gibt weder eine feste Liste von Zielen noch ein Ende: Der Widerstand entwickelt sich aus deinen Entscheidungen, und die Besatzungsmacht reagiert darauf. Städte, Geld, Immobilien, Fahrzeuge, Rekruten und erobertes Gebiet sind dauerhafte Zustände, sodass eine Kampagne über Sitzungen und Serverneustarts hinweg fortgeführt wird."
  "Ein neuer Charakter erhält ein Haus in einer der Städte der Insel, ein davor geparktes Auto und einen kleinen Geldbetrag als Startkapital. Dieses Haus wird als dein Zuhause eingetragen und dient als Wiedereinstiegspunkt. Ist kein Starthaus frei, beginnt ein neuer Charakter stattdessen in einer der Städte mit dem Startkapital, aber ohne Haus und ohne Auto. Bis ein Gebäude in seinem Besitz als Zuhause festgelegt wird, steigt er an seinem ursprünglichen Startpunkt wieder ein. Alles Weitere muss verdient, gekauft, gebaut oder erobert werden."
  "Hier muss nichts zwingend vor etwas anderem geschehen. Handel, Rekrutierung, das Platzieren von Lagern, Bauen und das Erobern von Basen sind Werkzeuge, die dir in jeder beliebigen Reihenfolge zur Verfügung stehen. Auf einem Server handeln alle Spieler auf derselben Insel und innerhalb desselben Kampagnenzustands."
  "Ortschaften sind bewohnt. Wenn du dich einer Ortschaft näherst, kommen die Einwohner heraus, und sobald du dich weit genug entfernst, verschwinden sie wieder. Bei deinem nächsten Besuch wird die Bevölkerung vollständig neu zusammengestellt, sodass du nie zweimal genau derselben Gruppe begegnest. Wie viele Personen unterwegs sind, richtet sich nach der Einwohnerzahl der Ortschaft, und welche Arten von Bewohnern erscheinen, unterscheidet sich von Ort zu Ort. Eine Hafenstadt und ein Weiler im Landesinneren sind daher unterschiedlich bevölkert. Manche laufen auf einer festen Strecke zwischen zwei Punkten, andere bewegen sich zwischen mehreren Orten, und wieder andere bleiben minutenlang an derselben Stelle stehen. Sie können wie bisher als Rekruten angeworben, als Unterstützer gewonnen oder als Kunden bedient werden. Ein Zivilist, den du rekrutiert hast, verschwindet dauerhaft aus der Bevölkerung und bleibt bei dir."
  "Zivile Fahrzeuge stehen entlang der Bordsteine und Straßenränder einer Ortschaft geparkt, in Dörfern meist einzeln oder zu zweit und in Städten in größerer Zahl. Ein Fahrzeug, das noch niemand benutzt hat, gehört wie die Menschenmenge lediglich zur Umgebung, und bei einem späteren Besuch steht dort eine andere Auswahl. Sobald jemand in ein solches Fahrzeug einsteigt, gehört es nicht mehr zur Umgebung: Es bleibt dort stehen, wo es zurückgelassen wurde, und wird zusammen mit dem übrigen Kampagnenstand zwischen den Spielsitzungen gespeichert."
  "Willkommen bei Overthrow"
  "Was dir ein Zuhause bietet"
  "Kaufen und Mieten"
  "Jede Kampagne beginnt mit einem eigenen Haus und einem davor geparkten Auto. Der Besitz wird deinem Spieler und nicht der jeweiligen Sitzung zugeordnet. Ein Gebäude in deinem Besitz bleibt daher zwischen Sitzungen und über Serverneustarts hinweg dein Eigentum."
  "Das als dein Zuhause festgelegte Gebäude ist der Ort, an dem dein Charakter nach dem Tod wieder einsteigt. Gebäude, die dir gehören oder die du mietest, gelten ebenfalls als Schnellreiseziele, sofern das Gebäude nicht an jemand anderen vermietet ist. Wenn du nach dem Verlassen des Spiels erneut beitrittst, erscheinst du dort, wo du dich abgemeldet hast, und nicht zu Hause."
  "Das Immobilienmenü erscheint im Hauptmenü, wenn du dich in einem Gebäude befindest, das besessen werden kann. Es zeigt den Verkaufspreis und die Miete dieses Gebäudes. Beides sind keine festen Werte: Sie steigen mit der Bevölkerung und der Stabilität der nächstgelegenen Stadt. Dasselbe Haus ist daher in einer großen, stabilen Stadt mehr wert als in einer kleinen, instabilen. Offiziere können Käufe und Mieten mit Geld aus der Widerstandskasse statt mit ihrem eigenen Geld bezahlen."
  "Die Miete wird einmal täglich um Mitternacht abgerechnet: Wer ein Gebäude mietet, bezahlt, und wer es besitzt, erhält die Zahlung. Du kannst mehr als ein Gebäude besitzen und jedes davon als dein Zuhause festlegen. Ein Gebäude kann nicht verkauft werden, solange es dein Zuhause ist, und dein letztes verbliebenes Gebäude kann überhaupt nicht verkauft werden."
  "Dein Zuhause"
