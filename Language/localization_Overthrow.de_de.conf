  "Zurück"
  "Du hast gerade das Sperrgebiet einer Basis betreten. Wenn du hier gesehen wirst, wirst du gesucht. Um Basen einzunehmen, musst du die Flagge in der Mitte erreichen und eine Schlacht auslösen. Der Ausgang der Schlacht hängt davon ab, wie viele Spieler (und Rekruten) die Mitte der Basis halten und wie viele Soldaten der Besatzungsmacht noch dort sind. Die Kontrolle kann in beide Richtungen wechseln: Die Besatzungsmacht hält Reserven vor und setzt überschüssige Kräfte ein, um eine vom Widerstand gehaltene Basis zurückzuerobern."
  "Basiskontrolle"
  "Durch Bauen werden Strukturen dort hinzugefügt, wo der Widerstand bereits Gebiet hält: an einer von ihm kontrollierten Basis, einem FOB oder einem Lager. Was das Baumenü anbietet, hängt davon ab, an welchem dieser Orte du dich befindest. Eine Struktur kostet ausschließlich Geld."
  "Strukturen bauen"
  "Tipps nicht mehr anzeigen"
  "Schließen"
  "Geschäfte verkaufen dir legale Gegenstände und kaufen die Waren zurück, die sie selbst führen. Ihr Bestand ist begrenzt und wird jeden Morgen wieder aufgefüllt. Die Preise unterscheiden sich von Stadt zu Stadt und eröffnen dadurch Handelsmöglichkeiten. Gegenstände können an Häfen günstig importiert werden, und Geschäfte weiter im Landesinneren bezahlen dafür höhere Preise als Geschäfte in Hafennähe."
  "Kaufen und Verkaufen"
  "Fertig"
  "Immobilien können gekauft, gemietet und verkauft werden. Nicht alle Gebäude können gekauft werden, die meisten Häuser jedoch schon. Das als dein Zuhause festgelegte Gebäude ist der Ort, an dem dein Charakter wiedereinsteigt, und Gebäude in deinem Besitz oder von dir gemietete Gebäude gelten als Schnellreiseziele. Basen und FOBs können ebenfalls als \"Home\" festgelegt werden. Über diesen Bildschirm können außerdem verschiedene Lagerhäuser gekauft werden, die das Lagern und Entnehmen großer Mengen von Gegenständen ermöglichen."
  "Immobilien besitzen"
  "Mehr erfahren"
  "Die Karte markiert Gebäude und Fahrzeuge in deinem Besitz, vom Widerstand platzierte Lager und FOBs sowie Geschäfte, Waffenhändler und Häfen, die für Importe verfügbar sind. Eine Schattierung über dem Gelände zeigt das Gebiet, das weiterhin von der Besatzungsmacht gehalten wird, und verschwindet überall dort, wo der Widerstand die Kontrolle übernimmt. Der Filter in der Symbolleiste auf der linken Seite öffnet ein Fenster mit einer Ein-/Aus-Zeile für jede Art von Markierung und jede Einblendung. Du musst einen Kartengegenstand in deinem Inventar bei dir tragen, damit sich die Karte öffnen lässt – verliere ihn also nicht!"
  "Die Karte"
  "Overthrow-Menü"
  "Weiter"
  "Momentan ist kein Tipp verfügbar"
  "%1 / %2"
  "Beim Platzieren werden gegen Geld Objekte des Widerstands in die Spielwelt gesetzt, von kleinen Gegenständen bis hin zu einem vollständigen Lager. Einige platzierbare Objekte sind illegal. Wenn du eines aufstellst, während dich die Besatzungsmacht sehen kann, wirst du gesucht. Gegenstände können bei jeder Immobilie oder jedem Lager in deinem Besitz sowie an vom Widerstand kontrollierten Basen und FOBs platziert werden."
  "Objekte platzieren"
  "Ein Rekrutierungszelt wirbt einen unausgerüsteten Zivilisten aus der nächstgelegenen Stadt an oder über \"Buy Equipped Recruit\" einen Rekruten, der bereits eine von dir gespeicherte Ausrüstung trägt. Der Preis eines ausgerüsteten Rekruten setzt sich zusätzlich zu den normalen Rekrutierungskosten aus dem örtlichen Ladenpreis seiner Ausrüstung und einer Komfortgebühr zusammen und wird dir vor dem Kauf angezeigt."
  "Ausgerüstete Rekruten"
  "Ein Rekrut gehört dem Spieler, der ihn angeworben hat, tritt der Gruppe dieses Spielers bei und erhält Befehle über das normale Gruppenbefehlsmenü. Rekruten bleiben immer bei ihrem Besitzer, auch wenn du die Gruppe wechselst.<br/><br/>Verwende das Befehlsmenü <color rgba='226,168,79,255'><action name=\"OpenCommandMenu\"/></color>, um ihnen Befehle zu erteilen oder ihr Inventar zu öffnen, während du sie ansiehst. Befehle, die du erteilst, ohne einen bestimmten Rekruten anzusehen, gelten für alle deine Rekruten."
  "Deine Rekruten"
  "Rekruten in deinem Besitz können angewiesen werden, ihre Position zu halten – entweder über diesen Bildschirm oder über eine gedrückt gehaltene Aktion direkt am Rekruten. Ein Rekrut, der seine Position hält, verlässt deine Gruppe und bleibt an seinem Standort. Er gehört weiterhin dir und belegt weiterhin einen deiner sechzehn Rekrutenplätze."
  "Position halten"
  "Ein Rekrut, der dir folgt, besitzt die Aktion \"Swap Gear\": Wenn du sie aus kurzer Entfernung gedrückt hältst, wird deine gesamte Ausrüstung mit seiner getauscht, einschließlich Kleidung und Waffen. Dabei wechseln die tatsächlichen Gegenstände den Besitzer, sodass nichts erzeugt oder verloren geht. Was nicht an die vorgesehene Stelle passt, wird stattdessen anderswo verstaut oder im schlimmsten Fall auf dem Boden abgelegt."
  "Ausrüstung tauschen"
  "Tipps sind wieder aktiviert und werden beim Spielen erneut angezeigt"
  "Tipps wieder einschalten"
  "Ein Waffenhändler handelt statt alltäglicher Waren mit Waffen und militärischer Ausrüstung, verwendet eine eigene Bestandsliste und füllt seinen Vorrat getrennt von gewöhnlichen Geschäften auf. Jeder Waffenhändler führt eine eigene Auswahl besonderer Waffen und die passende Munition. Möglicherweise musst du mehrere Städte durchsuchen, um genau die benötigte Waffe zu finden."
  "Waffenhändler"
  "Für den Großteil der Arbeit, die du für den Widerstand erledigst, erhältst du Erfahrung, und jede Stufe nach der ersten bringt einen Fertigkeitspunkt. Mit Punkten kaufst du im Charakterbogen Stufen in den drei Fertigkeiten Handel, Tarnung und Diplomatie."
  "Fertigkeiten und Stufen"
  "Tipp"
  "Die Besatzungsmacht hat dich jetzt als \"wanted\" markiert und wird dich jagen. Um deinen Fahndungslevel abzubauen, musst du aus ihrem Sichtfeld verschwinden und dich eine Weile verstecken. Sobald deine Sterne wieder verschwunden sind, wirst du nicht länger als Feind betrachtet.<br/><br/>Du kannst dich verkleiden, indem du die Kleidung des Feindes trägst. Wenn das \"clothes\"-Symbol rot angezeigt wird, bist du verkleidet und kannst Sperrgebiete betreten. Komm den Feinden jedoch nicht zu nahe, sonst erkennen sie dich. Nacht, Vegetation und Fertigkeiten können die Entfernung verringern, aus der du gesehen wirst."
  "Gesucht werden"
  "Overthrow ist eine persistente Sandbox-Kampagne auf einer besetzten Insel. Es gibt weder eine feste Liste von Zielen noch eine vorgeschriebene Reihenfolge, und die Insel reagiert auf deine Handlungen.<br/><br/>Städte, Geld, Immobilien, Fahrzeuge und erobertes Gebiet sind dauerhafte Zustände. Eine Kampagne wird daher über Sitzungen und Serverneustarts hinweg fortgeführt.<br/><br/>Geld erhältst du am einfachsten durch Spenden von Unterstützern in den Städten. Um Unterstützung für den Widerstand zu gewinnen, musst du auf ihn aufmerksam machen oder den Einfluss der Besatzungstruppen auf die Bevölkerung verringern."
  "Du hast ein Haus in einer der Städte der Insel erhalten, dazu ein Auto in der angeschlossenen Garage und etwas Startkapital.<br/><br/>Dieses Haus ist dein \"home\" und damit der Ort, an dem du wiedereinsteigst. Von überall aus kannst du außerdem per Schnellreise zu diesem Haus oder zu anderen Häusern in deinem Besitz zurückkehren.<br/><br/>Eine weitere Reisemöglichkeit sind Bushaltestellen. Von dort kannst du gegen eine geringe Gebühr zu jeder anderen Bushaltestelle auf der Karte reisen."
  "Die meisten von Overthrow hinzugefügten Funktionen befinden sich im Overthrow-Menü, das du mit <color rgba='226,168,79,255'><action name=\"OverthrowMainMenu\"/></color> öffnest.<br/><br/>Von dort aus kannst du auf alle Funktionen zugreifen, die Overthrow bietet.<br/><br/>Wenn du dich in einem Fahrzeug befindest, kannst du außerdem mit <color rgba='226,168,79,255'><action name=\"OverthrowVehicleMenu\"/></color> das \"Vehicle menu\" mit weiteren fahrzeugspezifischen Optionen öffnen."
  "Gelegentlich erscheinen Tipps wie dieser, wenn zum ersten Mal etwas Neues passiert. Jeder Tipp wird einmal angezeigt.<br/><br/>Der Eintrag \"Tips\" im Overthrow-Menü öffnet den zuletzt angezeigten Tipp erneut und ermöglicht es dir, Tipps auszuschalten oder dein Tutorial zurückzusetzen.<br/><br/>Weitere Informationen findest du im \"Field Manual\" im Reforger-Menü. Scrolle dort zu den Overthrow-Einträgen oder besuche unser Wiki unter <a href='https://wiki.armaoverthrow.com'>https://wiki.armaoverthrow.com</a>"
  "Willkommen bei Overthrow"
  "Es war kein Starthaus frei, deshalb hast du in einer der Städte der Insel begonnen und nicht in einem eigenen Zuhause. Das kann auf sehr stark ausgelasteten Servern vorkommen.<br/><br/>Du besitzt weiterhin dein Startkapital und steigst vorerst dort wieder ein, wo du begonnen hast. Immobilien auf der Insel können gekauft werden, und ein Gebäude in deinem Besitz kann als dein Zuhause festgelegt werden."
