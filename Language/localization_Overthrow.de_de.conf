  "Eine Basis, die du hältst"
  "Die Antwort"
  "Militärbasen werden von der Besatzungsfraktion gehalten und wechseln den Besitzer erst nach einem dort ausgetragenen Kampf. Eine Basis unter der Kontrolle des Widerstands schwächt die Besatzer in diesem Gebiet; diese können ihre Reserven für einen Gegenangriff einsetzen, um sie später zurückzuerobern."
  "Ein Angriff wird aus einer besetzten Basis heraus gestartet, und alle Spieler auf dem Server werden über den Beginn informiert. Die besetzende Fraktion reagiert, indem sie Truppen aus ihren anderen, nahegelegenen Basen herbeordert, die im Laufe der nächsten Minuten am Einsatzort eintreffen. Es findet jeweils nur ein einziger Kampf auf der Karte statt; solange dieser läuft, besteht keine Möglichkeit, einen weiteren zu beginnen."
  "Sobald die Verstärkung eingetroffen ist, wird das Kräfteverhältnis vor Ort fortlaufend ermittelt: Entscheidend ist, wie viele Spieler sich in der Mitte der Basis befinden und wie viele feindliche Soldaten ihnen dort gegenüberstehen. Überwiegen die Spieler und sind keine Gegner mehr vorhanden, schlägt das Pendel schnell zu ihren Gunsten aus; sind mehr Soldaten als Spieler anwesend, kehrt sich das Verhältnis um; bei ausgeglichenen Zahlenverhältnissen tendiert der Wert wieder gegen Null. Der Zähler bewegt sich – je nach gewählter Schwierigkeitsstufe – in die eine oder andere Richtung; wer den Zielwert erreicht, erobert die Basis. Die am Kampf beteiligten Spieler sammeln währenddessen Erfahrungspunkte."
  "Wechselt eine Basis den Besitzer, wird dort die Flagge des neuen Eigentümers gehisst und die Übernahme serverweit bekannt gegeben. Eine von der Widerstandsbewegung gehaltene Basis dient als Ziel für Schnellreisen und als Respawn-Punkt; zudem können Spieler dort bauen und eine in der nächstgelegenen Stadt angeheuerte Garnison stationieren. Manche Einrichtungen stehen ausschließlich der Fraktion zur Verfügung, die das entsprechende Gebiet kontrolliert. Die Eroberung einer Basis erhöht den Druck auf die besetzende Fraktion, während ihr Verlust diesen Druck wieder verringert."
  "Nichts, was eingenommen wurde, bleibt dauerhaft in der eigenen Hand. Die Besatzungsmacht hält Reserven zurück und investiert sie in ihre verbliebenen Stützpunkte; verfügt sie über einen Überschuss, wählt sie einen von der Widerstandsbewegung eroberten Stützpunkt aus, um ihn zurückzuerobern, und wartet anschließend eine Weile, bevor sie es erneut versucht. Um Städte und Funktürme wird auf ganz ähnliche Weise gekämpft, sodass ein Ort im Verlauf einer Kampagne mehrfach den Besitzer wechseln kann."
  "Basen einnehmen"
  "Wo Platzierungen funktionieren"
  "Camp"
  "Öffentlich und Privat"
  "Unzulässige platzierbare Objekte"
  "Beim Platzieren werden gegen Bezahlung Widerstandsobjekte in der Spielwelt aufgestellt – von kleinen Gegenständen bis hin zu einem kompletten Camp. Viele dieser Objekte dürfen nur an bestimmten Orten errichtet werden; einige sind zudem illegal, sodass ihr Aufstellen bemerkt wird, wenn es im Sichtfeld der Besatzungsfraktion geschieht."
  "Über die Option „Platzieren“ im Overthrow-Hauptmenü erhältst du eine Vorschau des Objekts, das du vor dir aufstellen kannst; das System verweigert die Platzierung, wenn der gewählte Ort unzulässig ist. Die meisten Gegenstände lassen sich in der Nähe eines eigenen Hauses oder Lagers, im Umkreis einer FOB (Forward Operating Base) oder innerhalb einer von der Resistance gehaltenen Basis aufstellen. Bei Plakaten und dem Piratensender verhält es sich umgekehrt: Sie müssen innerhalb einer Ortschaft platziert werden, wobei pro Ort nur eine begrenzte Anzahl gleichzeitig zulässig ist. Zudem ist die Gesamtzahl der platzierbaren und baubaren Objekte an einem Standort begrenzt – ein Wert, der über die Servereinstellungen festgelegt wird."
  "Ein Camp wird wie jedes andere Objekt platziert, gilt jedoch nach der Errichtung als Widerstandsposten und muss mindestens hundert Meter von einem anderen Camp entfernt sein. Ein Camp ist ein Ort, zu dem du schnellreisen und an dem du deinen Wiedereinstiegspunkt festlegen kannst; zudem ist es ein Ort, an dem du weitere Objekte platzieren darfst und an dem das Baumenü funktioniert. Du kannst jeweils nur ein Camp besitzen: Das Platzieren eines neuen Camp entfernt das alte."
  "Ein Camp verfügt über ein eigenes Menü zur Verwaltung, über das man zwischen einem öffentlichen und einem privaten Status wechseln oder das Camp wieder entfernen kann. Ein öffentliches Camp wird auf der Karte aller Spieler angezeigt, und jeder Spieler kann per Schnellreise dorthin gelangen. Ein privates Camp ist nur auf der Karte des jeweiligen Besitzers sichtbar, und auch nur dieser Spieler kann dorthin reisen."
  "Das Aufstellen von Plakaten, Piratensendern, Sandsäcken und Fahrzeugsperren ist illegal. Werden diese platziert, während die Besatzungsmacht einen dabei beobachten kann, wird man steckbrieflich gesucht – genau wie beim Plündern eines Soldaten unter den Augen anderer; geschieht dies unbemerkt, bleibt es folgenlos. Plakate und Piratensender wirken sich zudem auf die jeweilige Stadt aus, in der sie aufgestellt wurden: Sie stärken die Unterstützung für den Widerstand, bis die Wirkung nachlässt. Pro Stadt sind dabei nur eine begrenzte Anzahl an Plakaten und ein einzelner Sender möglich."
  "Camps und Platzierung"
  "Erste Schritte"
  "Geld und Handel"
  "Overthrow"
  "Unentdeckt bleiben"
  "Der Widerstand"
  "The Build-Up"
  "What Sabotage Costs"
  "A Base of Their Own"
  "The Encirclement"
  "The occupying faction works toward one place at a time. It picks a single base, town or city the resistance holds and spends the following hours building up against it, and the choice is not a lottery: bigger towns, ground close to the bases it still holds, places its radio towers still reach, and towns whose support has already slipped are what draw it. Villages, radio towers and resistance FOBs are never the target themselves. The target can change while the build-up is still in its early stage; once the occupiers have committed to it they see it through unless the build-up is broken."
  "The first sign is traffic. Groups are driven out from a base the occupiers still hold, dropped at a road short of the target and left to walk the rest of the way, and the truck turns round and goes home. In a town they make for the centre, and a group that holds it with nobody there to contest it drives the town's support for the resistance down a step; the next one drives it down again. A radio tower the resistance holds nearby draws a team of its own, which has to reach the tower and stand on it for a long stretch before it flips back. At a base they infiltrate and start pulling down what was built there. Standing in any of those places pauses the clock the group is working against, and killing the group ends the attempt outright."
  "What saboteurs pull down at a base stays where it stood. The structure is wrecked rather than taken away, with an explosion and smoke to mark it, and the ruin can be put back for a share of what it cost to build; a campaign saved and loaded again brings it back as a ruin. Gear stored inside survives the demolition, though nothing about the place works until it is repaired. They take the cheapest thing standing first and work upward, so bunkers and tents go before the garage does, and only what belongs to that base is ever at risk. A single player inside the base stops the demolitions where they are, and one message goes out per mission, on the first thing destroyed."
  "Once the build-up has told, the occupiers put a forward base of their own on the ground between their nearest holding and the target. A supply truck drives out to raise it, so it can be ambushed on the road, and nothing announces the base once it is standing: it is found, not reported. From then on it is where their groups come from, and it is also the shortest way to stop the whole thing. Take or empty the base supplying it, or stay close to the forward base itself, and after a while it is pulled down and the occupiers start looking elsewhere. With the site clear of their soldiers, a held action on its flag takes it down on the spot, and that costs them more than starving it does."
  "The counter attack itself arrives without a word. Nothing is announced, no battle panel appears and no circle is drawn on the map; the whole force is put down at once at the usual landing distances and walks in to form a ring roughly a hundred to a hundred and fifty metres out from the centre. The one thing that gives it away early is that no battle of your own can be started while it is forming, so a capture or an uprising that was available a minute ago is quietly not on offer. Counter attacks only ever begin in daylight, between roughly 05:00 and 15:00, and the waves come in from the side the occupying faction actually holds, including from its forward base."
  "The word comes when the last of them is in place, and with it fifteen real minutes in which nothing at all is scored. That time belongs to the resistance: it is long enough to drive in, gather recruits, dig in on the ground that matters, or decide the place is not worth the fight and leave. The battle panel names the place being fought over and counts down to the moment scoring begins. If every attacker on the ring is killed before it runs out the battle ends there and then in the resistance's favour, with no assault at all. Otherwise the clock reaches zero, the ring closes in and the ground is counted exactly as it is in any other battle. Whatever the outcome, their forward base comes down afterwards and the occupiers begin choosing again."
  "Counter Attacks"
  "Öffne die Karte und wähle einen Ort aus, zu dem du reisen kannst: ein Haus, das dir gehört oder das du mietest, dein eigenes Camp oder ein öffentliches Camp, einen FOB oder eine vom Widerstand kontrollierte Basis. Im Informationsfenster gibt es eine Schaltfläche für die Reise, auf der der Fahrpreis angezeigt wird. Schnellreise kostet die Entfernung in Kilometern multipliziert mit dem in den Schwierigkeitseinstellungen festgelegten Schnellreisepreis, wobei mindestens ein Kilometer berechnet wird. Rekruten in einem Umkreis von 50 Metern reisen standardmäßig mit dir und jeder von ihnen zahlt den vollen Fahrpreis; im Fenster gibt es einen Schalter, mit dem du sie zurücklassen kannst. Du kannst nicht schnellreisen, solange du gesucht wirst, zu einem Ziel, das näher als die Mindestentfernung liegt, oder als Beifahrer in einem Fahrzeug – nur der Fahrer nimmt das Fahrzeug mit – und eine laufende QRF kann die Schnellreise abhängig von den Schwierigkeitseinstellungen blockieren. Für Busreisen verwende an einer Bushaltestelle \"Nimm den Bus\" und wähle auf der Karte eine andere Bushaltestelle aus: Beim Busfahrpreis gibt es keine Mindestentfernung und du musst zu Fuß sein."
  "Einen FOB errichten"
  "Was dir ein FOB bietet"
  "Bauen"
  "Weiterziehen"
  "Ein FOB ist eine vorgeschobene Operationsbasis, die der Widerstand im Feld errichten kann. Sie muss in ausreichendem Abstand zu Basen und Funktürmen platziert werden. Durch Bauen können an einer vom Widerstand gehaltenen Basis, an einem FOB oder in einem Camp Strukturen hinzugefügt werden; was verfügbar ist, hängt davon ab, an welchem dieser Orte du dich befindest."
  "Ein FOB beginnt als mobiler FOB-Lkw, der wie jedes andere Fahrzeug gekauft wird. Eine Aktion am Lkw richtet den FOB an seiner aktuellen Position ein. Er kann weder in der Nähe einer Basis errichtet werden – unabhängig davon, ob diese von der Besatzungsmacht oder vom Widerstand gehalten wird – noch innerhalb von siebzig Metern um einen Funkturm. Die Karte markiert diese Bereiche, damit sie im Voraus erkennbar sind. Das Errichten ist auf Offiziere beschränkt, sofern der Server nicht anders eingestellt wurde."
  "Jeder Spieler kann per Schnellreise zu einem FOB gelangen, ein FOB kann als Wiedereinstiegspunkt festgelegt werden und dort funktionieren sowohl Platzieren als auch Bauen. Eine Garnison aus Soldaten kann dort stationiert werden; sie wird bezahlt und aus den Unterstützern der nächstgelegenen Stadt rekrutiert. Camps erhalten auf dieselbe Weise eine Garnison. Ein Offizier kann einen einzelnen FOB als Prioritäts-FOB markieren. Dadurch erhält er ein eigenes Kartensymbol und bleibt unabhängig von der Zoomstufe der Karte sichtbar."
  "\"Bauen\" im Overthrow-Hauptmenü öffnet eine Liste von Strukturen sowie eine Kamera, mit der sie in kurzer Entfernung von deinem Standort platziert werden können. Eine Struktur kostet nur Geld: Es gibt keinen separaten Materialvorrat, den du vorher sammeln musst. Jede Struktur hat eigene Regeln dafür, wo sie platziert werden darf, und der Großteil der Liste erfordert eine vom Widerstand gehaltene Basis oder einen FOB. Deshalb bietet dasselbe Menü in einem Camp weniger Möglichkeiten als in einer eroberten Basis."
  "Ein FOB ist nicht dauerhaft an einen Ort gebunden. Wird er eingepackt, verwandelt er sich wieder in den Lkw und nimmt die in seiner Umgebung stehenden Container samt Inhalt in das Fahrzeug auf. So kann ein FOB verlegt werden, anstatt ihn zurückzulassen. Die Besatzungsmacht erfährt ihrerseits, wo sich Camp und FOBs des Widerstands befinden, und schickt Truppen zur Aufklärung dorthin, wenn sie Soldaten entbehren kann."
  "FOBs und Bauen"
  "When the Money Runs Out"
  "Fuel That Costs Nothing"
  "The Fuel Depot"
  "Fuel is something the resistance buys. Refuelling at a fuel pump or a static fuel tank costs money for every litre actually delivered, taken while the fuel flows. The Refuel action shows the rate next to the tank reading, for example ($1/L). That rate is a difficulty setting: half a dollar a litre at the easiest end, four dollars at the hardest, and a server can set it to zero so fuel costs nothing anywhere. Vehicles and the Fuel Depot also carry a Fill Tank action: one five-second hold that fills the tank you are standing at in a single go, shows the exact price before you start, and sells you as much fuel as your money buys when you cannot afford a full load."
  "If you cannot cover the next moment of flow, the Refuel action is greyed out and reads that you cannot afford fuel here. If the money runs out while fuel is already moving, the flow stops, every litre already delivered stays in the tank, and you are told once. A few dollars can be left unspendable that way, because refuelling only starts when you can pay for a whole moment of flow."
  "Moving fuel from a fuel truck into a vehicle costs nothing, and neither does pouring a jerrycan. What costs is filling them: a jerrycan or a truck's own cargo tank topped up at a pump is charged at the usual rate. Fuel carried in a truck has already been paid for."
  "The resistance can build a Fuel Depot at a base it holds. It stores 10,000 litres - two full truck loads - and arrives empty, so it has no fuel to give until it is filled: park a fuel truck alongside and drain it into the depot from the depot's own actions. After that it refuels vehicles parked beside it for nothing, and whatever is left in it is kept in the campaign save."
  "Fuel"
  "Einen Waffenhändler finden"
  "Was sie anbieten"
  "An einen Händler verkaufen"
  "Ein Waffenhändler ist ein Geschäft, das statt alltäglicher Waren Waffen und militärische Ausrüstung handelt. Waffenhändler greifen auf eine eigene Bestandsliste zurück, füllen ihre Vorräte getrennt von gewöhnlichen Geschäften auf und ihre Preise werden von den Schwierigkeitseinstellungen der Kampagne beeinflusst."
  "Jede Stadt, die größer als ein Dorf ist, hat einen Waffenhändler; Dörfer haben keinen. Der Händler ist eine Person, die an einem bestimmten Ort in der Stadt steht, und kein Tresen innerhalb eines Geschäfts. Sobald eine Stadt diesen Standort festgelegt hat, bleibt er für den Rest der Kampagne bestehen. Sowohl Händler als auch gewöhnliche Geschäfte haben jeweils ein eigenes Symbol auf der Karte."
  "Der Bestand eines Händlers stammt aus seiner eigenen Liste und nicht aus dem allgemeinen Warenkatalog der Geschäfte: Pistolen, Munition, Anbauteile, Sprengstoffe und Wurfgegenstände gehören zum Standardangebot. Zusätzlich erhält der Händler jeder Stadt bei der ersten Aktivierung der Stadt jeweils ein zufällig ausgewähltes Gewehr, Scharfschützengewehr, Maschinengewehr und einen Werfer. Diese Auswahl bleibt diesem Händler dauerhaft erhalten und wird bei niedrigem Bestand wieder aufgefüllt, statt neu ausgewürfelt zu werden. Deshalb bieten zwei Städte nur selten dieselben schweren Waffen an. Die meiste Ausrüstung der Besatzungsmacht wird nicht gehandelt."
  "Anders als ein Geschäft, das nur die Arten von Waren zurückkauft, die es selbst verkauft, nimmt ein Händler fast alles an, was einen Preis besitzt. Er bezahlt einen durch die Schwierigkeitseinstellungen der Kampagne festgelegten Anteil des Gegenstandswerts. Ist dieser Anteil dort auf null gesetzt, kauft der Händler überhaupt nichts an. Große Geldbeträge, die bei einem Händler den Besitzer wechseln, bleiben nicht unbemerkt: Sie senken die Stabilität der betreffenden Stadt und erhöhen dort die Unterstützung für den Widerstand."
  "Waffenhändler"
  "Barracks"
