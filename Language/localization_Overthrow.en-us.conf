  "Tutorial - Find a gun dealer"
  "Gun dealers are located in the larger towns and cities. They are independant merchants who stock weapons and other illegal items. Each gun dealer will sell all ammunition plus one random gun of each type, so try different towns to find the weapon you're looking for."\
  ""\
