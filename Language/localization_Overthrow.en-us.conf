  "Back"
  "Bases change hands only after a battle, decided by how many players hold the middle of the base against how many occupying soldiers are still there. Control runs both ways: the occupying faction keeps reserves and spends a surplus of them on retaking a base the resistance holds."
  "Base Control"
  "Building adds structures where the resistance already holds ground: a base it controls, a FOB or a camp. What the build menu offers depends on which of those you are in, and a structure costs money and nothing else."
  "Building Structures"
  "Don't Show Tips Again"
  "Close"
  "Shops sell to you and most of them buy back, and their stock is limited and tops itself back up each morning. Prices differ from town to town, and your money is a balance recorded against your player rather than something you carry."
  "Buying and Selling"
  "Finish"
  "Ownership is recorded against your player rather than the session, so a building you own stays yours between sessions and across server restarts. The building set as your home is where your character respawns, and buildings you own or rent count as fast travel destinations."
  "Owning Property"
  "Learn More"
  "The map marks the buildings and vehicles you own, the camps and FOBs the resistance has placed, and the shops, gun dealers and ports it knows about. Carrying a map in your inventory is what makes the map info and fast travel options usable."
  "The Map"
  "Overthrow Menu"
  "Next"
  "No tip to show right now"
  "%1 / %2"
  "Placing puts resistance objects into the world for a cost in money, from small items up to a full camp. Some placeables are illegal, and putting one down while the occupying faction can see you makes you wanted."
  "Placing Objects"
  "A recruit belongs to the player who hired them, joins that player's group, and takes orders through the ordinary group command menu. Recruits stay with their owner between sessions, and one player can hold up to sixteen at a time."
  "Your Recruits"
  "A gun dealer trades weapons and military equipment rather than everyday goods, working from its own stock list and restocking separately from ordinary shops. Where a shop only buys back the kind of goods it sells, a dealer takes almost anything that has a price on it."
  "Gun Dealers"
  "Experience comes in from most of the work you do for the resistance, and every level past the first is worth one skill point. Points buy levels in the three skills, Trade, Stealth and Diplomacy, from the character sheet."
  "Skills and Levels"
  "Tip"
  "Above the first wanted level the occupying faction stops reading you as a civilian and treats you as an enemy on sight. Some of what raises it has to be witnessed and some does not, and it only falls back a step at a time while nobody has eyes on you."
  "Being Wanted"
  "Overthrow is a persistent sandbox campaign fought on an occupied island. There is no objective list and no required order, and the island reacts to what you do.<br/><br/>Towns, money, property, vehicles and captured ground are durable state, so a campaign carries on between sessions and across server restarts."
  "You have been given a house in one of the island's towns, with a car parked outside it, and some starting cash.<br/><br/>That house is your home, which is where you respawn."
  "Most of what Overthrow adds sits in the Overthrow menu, opened with <color rgba='226,168,79,255'><action name=\"OverthrowMainMenu\"/></color>.<br/><br/>It holds the map, fast travel, the resistance, property, your recruits and your character sheet."
  "Occasional tips like this one appear the first time something new happens, and each is shown once.<br/><br/>The Tips entry in the Overthrow menu reopens the most recent one."
  "Welcome to Overthrow"
  "No starting house was free, so you began in one of the island's towns rather than at a home of your own.<br/><br/>You still have your starting cash, and for now you respawn where you started. Property on the island can be bought, and a building you own can be set as your home."
