  "Un membre de la résistance a déserté et est désormais sous haute protection. Nous l'avons repéré dans une planque. Éliminez le traitre avant qu'il ne puisse révéler quoi que ce soit."
  "Reconnaissance"
  "Approchez vous d'une base pour en étudier l'importance de ses défenses. Vous devez vous trouvez à moins de 100 mètres de la base pour avoir un bon point de vue. Faites attention à ne pas vous faire repérer dans les zones interdites marquées en rouge sur la carte, au risque de vous faire tirer dessus"
  "Trouver un marchant d'armes"
  "Les marchants d'armes peuvent être trouvés dans les grands bourgs & villes. Ce sont des marchants indépendants qui stockent des armes et d'autres objets illégaux. Rendez vous au plus proche pour voir quels objets sont disponibles."
  "Tutorial - Find a shop"
  "Many towns on the map have various shops where you can purchase legal items. They are marked on the map by different icons representing the type of shop."\
  ""\
  "Visit the nearest shop and see what items they have available by performing an action on the cash register."
  "In Progress:"
  "Tutorial - Place a camp"
  "Camps can be placed anywhere that isnt too close to a base."\
  ""\
  "It creates a fast travel point that any player can use, and allows you to place/build some basic items around it."\
  ""\
  "You can also \"Manage Camp\" to set your camp as private if you don't want other players to fast travel to it."\
  ""\
  "Players are only allowed one camp at a time. Placing a new camp will delete your old one and any items you placed/built around it."\
  ""\
  "You can also set a camp as \"home' so you will respawn there on your death."\
  ""\
  "Place a camp by opening the Overthrow menu and choosing \"Place\". Put it somewhere useful so you can easily get back to an area where you are currently operating or where you parked your vehicle."
  "Tutorial - Place an Equipment Box"
  "An Equipment Box is a very useful storage container with extra functionality in Overthrow."\
  ""\
  "It can:"\
  "- Store all sorts of equipment"\
  "- Be locked so other players can't access it"\
  "- Be unloaded into a nearby vehicle"\
  "- Be loaded from a nearby vehicle"\
  "- Save your current loadout and apply it to yourself or nearby recruits"\
  ""\
  "Use the \"Place\" option in the Overthrow menu to place one at your house, your camp, an FOB or a base."
  "Augmenter le soutien"
  "Les partisans représentent une importante source de revenus pour la résistance. Ralliez les à votre cause en collant des affiches dans et autour de la commune en utilisant l'option \"Placer\" du menu, puis attendez qu'au moins 15% y prêtent attention. Vous pouvez également leur fournir du matériel médical comme des bandages ou de l'insuline pour accélérer leur ralliement."
  "Tutorial - Recruit a civilian"
  "Civilians can be recruited into your squad."\
  ""\
  "There are two ways to recruit them:"\
  "1. Walk up to them in the street and recruit them directly"\
  "2. Build a \"Recruitment Tent\" at an FOB"\
  ""\
  "Once recruited you can command them using the \"Command menu\" with <color rgba='226,168,79,255'><action name=\"OpenCommandMenu\"/></color>"
  "Accepter"
  "Accompli"
  "Refuser"
  "Il n'y a actuellement aucun Jobs disponible"
  "Montrer sur la carte"
  "These jobs are designed to be a tutorial for the game mode. They are not a great source of income and just show you what is possible. Overthrow is an open-world game mode where YOU decide how to further the cause of the revolution. You will make a lot more money by raising support and taking towns. So get out there and raise support, capture bases and take over the island!"
