  "Overthrow"
  "Devi avere la mappa nell'inventario per usare il \"Viaggio Rapido\". La mappa si aprirà e cliccando su una casa di proprietà, un campo, un FOB o una base che la resistenza controlla per viaggiare rapidamente lì. Ti verrà accreditato un piccolo costo di servizio in base alla difficoltà scelta."
  "Apri il menu con <color rgba='226,168,79,255'><action name=\"OverthrowMainMenu\"/></color> per accedere alla maggior parte delle funzioni di Overthrow. "
  "Menu Principale"
  "Devi avere una mappa nell'inventario per usare \"Informazioni Mappa\". Cliccandolo nel menu principale aprirà la mappa, poi potrai cliccare ovunque sulla mappa per mostrare informazioni riguardante quella zona, compreso i dati conosciuti di quell'area."
  "Apre un menu che ti consente di vedere informazione o di cambiare impostazione riguardante la resistenza. Gli ufficiali possono promuovere altri ufficiali o impostare la percentuale delle tasse (Di base è 0%) che sarà depositato direttamente nei fondi della resistenza. Gli ufficiali qui possono prelevare fondi dalla resistenza o inviare fondi a un altro giocatore. Qualunque giocatore può anche donare fondi come investimento alla resistenza."
