  "Usa l'opzione “Posiziona” nel menu Overthrow per posizionarne uno a casa tua, nel tuo accampamento, in una base operativa avanzata o in una base."
  "Tutorial - Aumentare il supporto"
  "I sostenitori di questa città forniranno una fonte di reddito indispensabile alla resistenza sotto forma di donazioni."\
  ""\
  "Ottieni sostegno affiggendo manifesti in città e nei dintorni utilizzando l'opzione \"Posiziona\" nel menu Overthrow e aspettando che attirino l'attenzione del 15% dei cittadini. Puoi anche consegnare forniture mediche come bende, iniettori di morfina, soluzione salina e laccio emostatico mettendole nella tua auto e utilizzando l'opzione \"Consegna Forniture Mediche\" nel bagagliaio."\
  ""\
  "Controlla i tuoi progressi utilizzando l'opzione di menu \"Informazioni Mappa\". Puoi raccogliere sostegno in qualsiasi villaggio, paese o città senza bisogno di un lavoro per farlo."
  "Tutorial - Recluta un civile"
  "I civili possono essere reclutati nella tua squadra."\
  ""\
  "Ci sono due modi per reclutarli:"\
  "1. Avvicinati a loro in strada e reclutali direttamente"\
  "2. Costruisci una \"Tenda di Reclutamento\" nei pressi di un FOB"\
  ""\
  "Una volta reclutati, puoi comandarli utilizzando il \"Menu Comandi\" con <color rgba='226,168,79,255'><action name=\"OpenCommandMenu\"/></color>"
  "Accetta"
  "Lavoro Completato"
  "Rifiuta"
