  "Il Traditore"
  "Un membro della resistenza ci ha tradito ed è tenuto sotto protezione dal nemico. Abbiamo rintracciato la sua posizione in questa abitazione. "\
  ""\
  "Elimina il traditore prima che possa rivelare qualsiasi informazione."
  "Ricognizione"
  "Fai un sopraluogo della base per determinare l'efficacia delle difese. Devi essere almeno a 100m di distanza dalla bandiera per completare la missione."\
  ""\
  "Fai attenzione a non farti vedere all'interno dell'area riservata contrassegnata in rosso sulla mappa, altrimenti ti spareranno."
  "Tutorial - Trova un armaiolo"
  "Gli armaioli si trovano nelle città e nei paesi più grandi. Sono dei venditori di armi e di altri oggetti illegali. Ogni armaiolo potrà vendere munizioni e armi casuali di ogni tipo, quindi prova varie città e paesi se sei in cerca di un arma particolare."\
  ""\
  "Vai a trovare l'armaiolo più vicino per vedere che cosa ha da offrire."
  "Tutorial - Trova un negozio"
  "Molte città sulla mappa hanno vari negozi dove è possibile acquistare oggetti legali. Sono contrassegnati sulla mappa da diverse icone che rappresentano il tipo di negozio."\
  ""\
  "Visita il negozio più vicino e scopri quali oggetti sono disponibili interagendo con il registratore di cassa."
  "In corso:"
  "Tutorial - Piazza un accampamento"
  "Gli accampamenti possono essere posizionati ovunque non siano troppo vicini a una base."\
  ""\
  "Creano un punto di teletrasporto che qualsiasi giocatore può utilizzare e consentono di posizionare/costruire alcuni oggetti di base attorno ad essi."\
  ""\
  "È anche possibile \"Gestire l'accampamento\" per impostarlo come privato se non si desidera che altri giocatori possano viaggiarci velocemente."\
  ""\
  "I giocatori possono avere un solo accampamento alla volta. Posizionando un nuovo accampamento, quello vecchio e tutti gli oggetti posizionati/costruiti attorno ad esso verranno eliminati."\
  ""\
  "È anche possibile impostare un accampamento come \"Casa\", in modo da rigenerarsi lì in caso di morte."\
  ""\
  "Per posizionare un accampamento, aprire il menu Overthrow e selezionare \"Posiziona\". Posizionarlo in un luogo utile, in modo da poter tornare facilmente nell'area in cui si sta operando o dove è stato parcheggiato il veicolo."
  "Tutorial - Piazza una cassa di equipaggiamenti"
  "Una cassa degli equipaggiamenti è un contenitore molto utile con funzionalità extra in Overthrow."\
  ""\
