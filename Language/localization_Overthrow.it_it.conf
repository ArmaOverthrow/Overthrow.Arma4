  "Mostra in Mappa"
  "Questi lavori sono pensati come Tutorial per la modalità di gioco. Non sono una grande fonte di guadagno, ma servono solo a mostrarti cosa è possibile fare. Overthrow è una modalità di gioco open world in cui sei TU a decidere come portare avanti la causa della rivoluzione. Guadagnerai molto di più raccogliendo sostegno e conquistando città. Quindi buttati nella mischia, raccogli sostegno, conquista basi e prendi il controllo dell'isola!"
