  "수입"
  "Overthrow에 오신 것을 환영합니다! 이곳은 당신의 집이며, 여기에서 리스폰하며 메인 메뉴 <color rgba='226,168,79,255'><action name=\"OverthrowMainMenu\"/></color>를 열어 소정의 비용으로 빠른 이동을 할 수 있습니다."\
  ""\
  "당신은 차고에 주차된 자동차를 소유하고 있으며, 바지에는 권총이 있습니다. 적은 당신이 무기를 들고 있지 않으면 당신을 민간인으로 간주하여 공격하지 않으니, 그들 앞에서 무기를 장착할 때 조심하세요. 적에게 \"수배\" 상태가 되면 오른쪽 상단에 별이 표시됩니다."\
  ""\
  "Overthrow가 처음이라면, 메인 Overthrow 메뉴의 \"직업(Jobs)\" 섹션에 튜토리얼이 준비되어 있습니다."\
  ""\
  "Overthrow의 기능과 게임플레이에 대한 자세한 내용은 \"현장 매뉴얼(Field Manual)\"을 참고하세요."
  "당신의 집 (리스폰 지점)"
  "최고급 대마초 1/4온스. 민간인에게 팔아 약간의 수익을 올릴 수 있음."
  "대마초"
  "Item limit reached at this location"
  "Item %1 of %2"
  "Item removed"
  "지도에 웨이포인트 마커가 추가되었습니다"
  "Assassinate Officer"
  "The officer running this base is the reason the surrounding towns keep their heads down. Get inside, kill him, and get out. The garrison will be exactly as unhappy about it as you would expect - but the towns nearby will remember it."
  "배신자 제거"
  "저항군 일원이 배신하여 보호 구금 중이며 그가 머굴고 있는 주택의 위치를 확인했습니다."\
  ""\
  "이 배신자가 정보를 누설하기 전에 제거하십시오."
  "정찰"
  "가장 가까운 기지로 접근하여 방어가 얼마나 견고한지 파악하세요. 기지를 잘 살펴보려면 100미터 이내로 접근해야 합니다."\
  ""\
  "지도에 빨간색으로 표시된 금지 구역 내에서 발견되지 않도록 주의하세요. 그렇지 않으면 공격을 받게 됩니다."
  "튜토리얼 - 총기 딜러 찾기"
  "총기 판매상은 대도시와 큰 마을에 위치해 있습니다. 이들은 무기와 기타 불법 물품을 취급하는 독립 상인입니다. 각 총기 판매상은 모든 탄약과 무기 종류별로 무작위 한 자루씩 판매하므로, 원하는 무기를 찾기 위해 여러 마을을 방문해 보세요."\
  ""\
  "가장 가까운 총기 판매상을 찾아가서 어떤 물품이 있는지 확인하세요."
  "튜토리얼 - 상점 찾기"
  "지도상의 많은 마을에는 다양한 상점이 있어 합법적인 물품을 구매할 수 있습니다."\
  "상점 유형에 따라 서로 다른 아이콘으로 지도에 표시됩니다."\
  ""\
  "가장 가까운 상점을 방문해 계산대에서 상호작용하여 어떤 물품이 있는지 확인하세요."
  "진행 중:"
  "Pirate Radio"
  "Word travels further than paper. Set up a pirate radio transmitter in this town to broadcast for the resistance. You'll have to buy the transmitter yourself using the 'Place' option in the main menu, and being seen by soldiers placing it will make you wanted."
  "Tutorial - Place a camp"
  "Camps can be placed anywhere that isnt too close to a base."\
  ""\
  "It creates a fast travel point that any player can use, and allows you to place/build some basic items around it."\
  ""\
  "You can also \"Manage Camp\" to set your camp as private if you don't want other players to fast travel to it."\
  ""\
  "Players are only allowed one camp at a time. Placing a new camp will delete your old one and any items you placed/built around it."\
  ""\
  "You can also set a camp as \"home' so you will respawn there on your death."\
  ""\
  "Place a camp by opening the Overthrow menu and choosing \"Place\". Put it somewhere useful so you can easily get back to an area where you are currently operating or where you parked your vehicle."
  "Tutorial - Place an Equipment Box"
  "An Equipment Box is a very useful storage container with extra functionality in Overthrow."\
  ""\
  "It can:"\
  "- Store all sorts of equipment"\
  "- Be locked so other players can't access it"\
  "- Be unloaded into a nearby vehicle"\
  "- Be loaded from a nearby vehicle"\
  "- Save your current loadout and apply it to yourself or nearby recruits"\
  ""\
  "Use the \"Place\" option in the Overthrow menu to place one at your house, your camp, an FOB or a base."
  "Propaganda Run"
  "The town needs reminding who the occupiers are. Put up a resistance poster somewhere in town - a wall in plain sight, where people will see it. Don't let the occupying forces catch you doing it."
  "튜토리얼 - 지원 강화하기"
  "이 마을의 지지자들은 저항군에 기부 형태로 매우 필요한 수입원을 제공합니다."\
  ""\
  "Overthrow 메뉴의 \"배치\" 옵션을 사용해 마을 안팎에 포스터를 붙이고, 마을 인구의 15%가 볼 때까지 기다리면 지지도가 올라갑니다."\
  "또한, 붕대나 아스피린 같은 의료 물품을 차량에 실은 뒤 트렁크의 \"의료 물품 배달\" 옵션을 사용해 전달할 수도 있습니다."\
  ""\
  "\"지도 정보\" 메뉴에서 진행 상황을 확인하세요."\
  "지원 강화는 특정 직업 없이도 어느 마을, 도시, 읍에서든 할 수 있습니다."
  "Tutorial - Recruit a civilian"
  "Civilians can be recruited into your squad."\
  ""\
  "There are two ways to recruit them:"\
  "1. Walk up to them in the street and recruit them directly"\
  "2. Build a \"Recruitment Tent\" at an FOB"\
  ""\
  "Once recruited you can command them using the \"Command menu\" with <color rgba='226,168,79,255'><action name=\"OpenCommandMenu\"/></color>"
  "Sabotage Radio Tower"
  "An occupier transmitter near this town is drowning out everything we put out. Get to the tower and sabotage it - it will be off the air long enough to matter. It will be guarded, and if you are seen at it you will be a wanted person."
  "수락하기"
  "임무 완료"
  "거절하기"
  "현재 이용 가능한 임무가 없습니다"
  "지도에 표시하기"
  "이 임무들은 게임 모드의 튜토리얼용으로 설계되었습니다. 많은 수입을 기대하기보다는 가능한 활동들을 보여주기 위한 것입니다. Overthrow는 당신이 혁명의 대의를 위해 어떻게 행동할지 스스로 결정하는 오픈 월드 게임 모드입니다. 지지자를 모으고 마을을 점령하는 것이 훨씬 더 많은 돈을 벌 수 있는 방법입니다. 그러니 밖으로 나가서 지지를 모으고, 기지를 점령하며 섬을 장악하세요!"\
