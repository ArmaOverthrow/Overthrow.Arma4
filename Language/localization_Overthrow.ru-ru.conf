  "Вы только что вошли в запретную зону базы. Если вас здесь заметят, вы станете розыскиваемым. Чтобы захватить базу, нужно добраться до флага в центре и начать битву. Битва будет решаться тем, сколько игроков (и рекрутов) удерживают центр базы против оставшихся солдат оккупантов. Контроль работает в обе стороны: оккупационная фракция выбирает одно место, которое намерена вернуть, и готовится к этому со временем, и база, удерживаемая сопротивлением, может стать таким местом."
  "Контроль базы"
  "Строительство добавляет сооружения там, где сопротивление уже контролирует территорию: на базе, FOB, в лагере или, в случае склада, в городе, контролируемом сопротивлением. Большинство сооружений стоят только деньги и появляются сразу, а вертолётная площадка, гараж, склад и казарма требуют ещё и строительные ресурсы, создавая строительную площадку, которую нужно снабдить."
  "Строительство сооружений"
  "Больше не показывать подсказки"
  "Закрыть"
  "Магазины продают вам легальные товары и выкупают те, которые сами продают. Их запасы ограничены и пополняются каждое утро. Цены различаются от города к городу, что открывает возможности для торговли. Товары можно импортировать из портов по низкой цене, а магазины дальше от портов будут платить больше, чем магазины рядом."
  "Покупка и продажа"
  "Готово"
  "Топливный склад вмещает 10 000 литров и прибывает пустым, поэтому у него нет топлива, пока его не заполнят. Припаркованный рядом топливный грузовик можно слить в него через действия самого склада, и после этого он бесплатно заправляет транспорт, припаркованный рядом."
  "Топливный склад"
  "Группы, купленные здесь, принадлежат вам и остаются вашими между сессиями. Цена включает стоимость найма каждого бойца, необходимое снаряжение и, если есть транспорт, его полную магазинную цену. Снаряжение, уже хранящееся на зарегистрированном складе в радиусе 150 метров, списывается со склада, а не покупается, и в квоте указывается, сколько это покрыло. Покупка также забирает сторонников из ближайшего города, и у каждого игрока есть лимит на количество солдат High Command."
  "На карте каждого игрока эти группы отображаются зелёными символами, ваши — ярко, других игроков — тускло. Выбор группы показывает её владельца, режим, цель и статус, а вашей группой можно управлять с карты. Перемещение происходит в реальном времени и продолжается, пока вы офлайн. Управление группами в главном меню показывает ваш список."
  "Командование"
  "Недвижимость можно покупать, сдавать в аренду и продавать. Не все здания можно купить, но большинство домов — можно. Здание, установленное как ваш дом, является местом возрождения, а принадлежащие или арендованные здания служат точками быстрого перемещения. Базы и FOB также можно установить как «Дом». Склады можно купить здесь, и принадлежащий вам склад имеет собственное хранилище, открываемое действием «Хранилище» на здании."
  "Владение недвижимостью"
  "Узнать больше"
  "На карте отмечены здания и транспорт, которыми вы владеете, лагеря и ПОБ, размещённые сопротивлением, а также магазины, торговцы оружием и порты для импорта. Затенение местности показывает территорию, которую всё ещё удерживают оккупанты, и исчезает там, где сопротивление захватывает контроль. Фильтр на панели значков слева открывает панель с рядами включения/выключения для каждого типа маркеров и слоёв. Для открытия карты у вас должен быть предмет карты в инвентаре, так что не потеряйте его!"
  "Карта"
  "Меню Overthrow"
  "Далее"
  "Сейчас нет подсказок"
  "%1 / %2"
  "Размещение помещает объекты сопротивления в мир за деньги, от мелких предметов до полноценного лагеря. Некоторые объекты незаконны, и установка их на виду у оккупантов делает вас розыскиваемым. Предметы можно размещать в любой вашей недвижимости или лагере, а также на контролируемых сопротивлением базах и ПОБ."
  "Размещение объектов"
  "Палатка вербовки нанимает неэкипированного гражданского из ближайшего города или, с помощью «Купить экипированного рекрута», рекрута, который прибывает уже в сохранённом вами комплекте. Цена экипированного включает стоимость его снаряжения по местным ценам плюс плату за удобство сверх обычной стоимости найма, и показывается до подтверждения."
  "Экипированные рекруты"
  "Рекрут принадлежит нанявшему его игроку, присоединяется к его группе и получает приказы через обычное меню команд. Рекруты всегда остаются со своим владельцем, даже если вы меняете группы. Используйте меню команд, чтобы отдавать приказы или открывать их инвентарь, глядя на них. Приказы, отданные без взгляда на конкретного рекрута, применяются ко всем вашим рекрутам."
  "Ваши рекруты"
  "Вашим рекрутам можно приказать удерживать позицию — из этого экрана или через действие на самом рекруте. Удерживающий позицию покидает вашу группу и остаётся на месте, но всё ещё принадлежит вам и занимает один из ваших шестнадцати слотов."
  "Удержание позиции"
  "Рекрут, следующий за вами, имеет действие «Обменять снаряжение»: удержание его поблизости обменивает ваш комплект с его, включая одежду и оружие. Реальные предметы меняются местами, поэтому ничего не создаётся и не теряется; то, что не помещается, откладывается или, в худшем случае, остаётся на земле."
  "Обмен снаряжения"
  "Подсказки снова включены и будут появляться по ходу игры"
  "Включить подсказки снова"
  "Торговец оружием торгует оружием и военным снаряжением, а не повседневными товарами, использует свой собственный список и пополняется отдельно от обычных магазинов. У каждого торговца есть уникальный набор оружия и боеприпасов, вам может понадобиться искать в разных городах, чтобы найти нужное оружие."
  "Торговцы оружием"
  "Опыт начисляется за большинство ваших действий для сопротивления, и каждый уровень после первого даёт одно очко навыков. Очки тратятся на повышение трёх навыков — Торговля, Скрытность и Дипломатия — в листе персонажа."
  "Навыки и уровни"
  "Ящики с боеприпасами, склады и большинство легальных колёсных транспортных средств имеют собственное хранилище: список товаров, а не предметы внутри. Число рядом с действием «Хранилище» — это количество предметов в списке. Любой предмет из списка можно извлечь в этот контейнер, где он становится предметами, которые можно поднять, или отправить напрямую в список другого контейнера в радиусе двадцати пяти метров. Другие действия на контейнере перемещают всё, что в нём находится, в список за раз или дают ему имя."
  "Хранилище"
  "Подсказка"
  "Оккупационная фракция объявила вас в розыск и будет преследовать. Чтобы снять уровень розыска, нужно скрыться из их поля зрения и переждать. Когда звёзды исчезнут, вас больше не будут считать врагом. Вы можете замаскироваться, надев одежду врага. Когда значок «одежда» красный, вы замаскированы и можете входить в запретные зоны, но не подходите слишком близко, иначе вас узнают. Ночь, растительность и навыки уменьшают дистанцию обнаружения."
  "Розыск"
  "Overthrow — это постоянная кампания-песочница на оккупированном острове. Нет списка целей и обязательного порядка, остров реагирует на ваши действия. Города, деньги, недвижимость, транспорт и захваченные территории сохраняются, поэтому кампания продолжается между сессиями и перезапусками сервера. Деньги легче всего получать через пожертвования сторонников в городах. Чтобы получить поддержку, нужно повышать осведомлённость о сопротивлении или уменьшать влияние оккупантов."
  "Вам выдан дом в одном из городов острова, с машиной в гараже и стартовыми деньгами. Этот дом — ваш «дом», место возрождения. Вы также можете быстро перемещаться к этому дому или другим вашим домам. Другой способ передвижения — автобусные остановки, позволяющие за небольшую плату добраться до любой другой остановки."
  "Большая часть функций Overthrow находится в меню Overthrow, открываемом <action name=\"OverthrowMainMenu\"/>. Оттуда вы можете делать всё, что предлагает Overthrow. В транспорте также можно использовать <action name=\"OverthrowVehicleMenu\"/> для открытия «Меню транспорта» с дополнительными опциями."
  "Периодически появляются подсказки, когда что-то происходит впервые, и каждая показывается один раз. Пункт «Подсказки» в меню Overthrow позволяет снова открыть последнюю подсказку, отключить подсказки или сбросить обучение. Для получения дополнительной информации откройте «Полевой справочник» в меню Reforger или посетите нашу вики по ссылке <a href='https://wiki.armaoverthrow.com'>wiki.armaoverthrow.com</a>."
  "Добро пожаловать в Overthrow"
  "Свободного стартового дома не было, поэтому вы начали в одном из городов, а не в собственном доме. Это может случиться на очень загруженных серверах. У вас всё ещё есть стартовые деньги, и пока вы возрождаетесь там, где начали. Недвижимость можно купить, и здание, которым вы владеете, можно установить как дом."
