  "Американские силы удерживают остров. Они размещают гарнизоны на базах и радиовышках и патрулируют города. Их форма подходит для маскировки."
  "Соединенные Штаты — иностранная держава, симпатизирующая сопротивлению, но не ваша фракция. Появление в их форме немедленно повышает уровень розыска, и они не могут быть оккупантами."
  "Советские силы удерживают остров. Они размещают гарнизоны на базах и радиовышках и патрулируют города. Их форма подходит для маскировки."
  "Советский Союз — иностранная держава, симпатизирующая сопротивлению, но не ваша фракция. Появление в их форме немедленно повышает уровень розыска, и они не могут быть оккупантами."
  "Функция ещё не реализована"
  "Начало битвы"
  "Удержание позиции"
  "Захваченная вами база"
  "Ответный удар"
  "Военные базы удерживаются оккупантами и переходят из рук в руки только после сражения.  База, находящаяся под контролем сопротивления, ослабляет позиции оккупантов в этом районе, и впоследствии они могут решить отвоевать ее назад."
  "Атака начинается изнутри занятой базы, и все игроки на сервере получают уведомление о её начале. Оккупирующая фракция отвечает, направляя войска из своих других близлежащих баз, которые прибывают к месту в течение следующих нескольких минут. На карте одновременно может идти только одно сражение, поэтому пока оно идёт, возможность начать другое не предлагается, и контратака, которая ещё не объявила о себе, считается за одну."
  "Как только подкрепление прибыло, начинается непрерывный подсчёт сил на самой территории: решающим является соотношение количества игроков в центре базы и оккупантов рядом с ними. Присутствие игроков при полном отсутствии врагов быстро склоняет чашу весов в вашу пользу; перевес солдат врага действует наоборот; при равных силах прогресс медленно возвращается к нулю. Подсчёт идёт до достижения лимита, заданного настройками сложности, в ту или иную сторону, и тот, кто первым достигает цели, захватывает базу. Все игроки, находящиеся в зоне боя, получают опыт во время сражения."
  "Когда база переходит под контроль другой стороны, на ней поднимается новый флаг, и все игроки на сервере получают уведомление. На базу, удерживаемую сопротивлением, можно быстро перемещаться, назначать её точкой возрождения, строить на ней и размещать объекты, включая возведение казармы и покупку групп Верховного командования; некоторые объекты инфраструктуры работают только для той стороны, которая контролирует эту землю. Захват базы повышает давление на оккупирующую фракцию, а её потеря снова снижает это давление."
  "Ничто из захваченного не остаётся за вами навсегда. Оккупирующая фракция выбирает одно место, которое намерена вернуть, и работает над этим в течение нескольких часов видимой активности, так что контратака прибывает в конце подготовки, а не из ниоткуда; страница «Контратаки» описывает эту подготовку от первого грузовика до штурма. Города и крупные населённые пункты выбираются таким же образом и захватываются так же. Радиовышки — более тихое дело: их захватывают, зачищая гарнизон, а вышку, расположенную рядом с тем, на что нацелились оккупанты, можно отбить обратно, если команда доберётся до неё и удержит достаточно долго. Базы, города и вышки могут менять владельца несколько раз за кампанию."
  "Захват баз"
  "Где работает размещение"
  "Лагеря"
  "Публичные и частные"
  "Нелегальные объекты"
  "Размещение позволяет устанавливать в мире объекты сопротивления за деньги — от мелких предметов до целого лагеря. Многие объекты разрешены только в определённых местах, а некоторые являются нелегальными, поэтому их установка на виду у оккупантов будет замечена."
  "Опция «Разместить» в главном меню Overthrow показывает предпросмотр объекта, который вы можете установить перед собой, и отклоняет выбор, если место не подходит. Большинство предметов можно ставить рядом с вашим домом, рядом с вашим лагерем, в радиусе FOB или на территории базы, удерживаемой сопротивлением. Плакаты и пиратское радио работают наоборот: их нужно устанавливать внутри города, при этом в городе одновременно может быть только ограниченное количество таких объектов. Также на одной локации может быть лишь определённое общее количество размещённых и построенных объектов — это настраивается на сервере."
  "Лагерь устанавливается как любой другой объект, но после установки он регистрируется как позиция сопротивления и должен находиться не менее чем в ста метрах от другого лагеря. Лагерь — это место, куда можно быстро перемещаться, которое можно назначить точкой возрождения, где разрешено размещать другие объекты и где работает меню строительства. Вы можете владеть только одним лагерем одновременно: установка нового убирает старый."
  "У лагеря есть собственное меню, которое используется непосредственно на нём: оно позволяет переключать статус между публичным и частным, а также убирать лагерь. Публичный лагерь отображается на карте у всех игроков, и любой может быстро переместиться к нему. Частный лагерь виден на карте только его владельцу, и только этот игрок может переместиться к нему."
  "Устанавливать плакаты, пиратское радио, мешки с песком и противотанковые ежи — незаконно. Если оккупанты заметят вас за этим занятием, вы сразу получите уровень розыска (как и при мародёрстве на виду). Сделанное тайком останется незамеченным. Плакаты и пиратские радиостанции также влияют на город, в котором они установлены, повышая поддержку сопротивления в этом городе, пока эффект не закончится, при этом в городе может быть лишь несколько плакатов и одна радиостанция."
  "Лагеря и размещение"
  "Начало игры"
  "Деньги и торговля"
  "Overthrow"
  "Скрытность"
  "Сопротивление"
  "Подготовка"
  "Цена диверсий"
  "Собственная база"
  "Окружение"
  "Оккупационная фракция работает над одним объектом за раз. Она выбирает одну базу, город или крупный город, удерживаемый сопротивлением, и тратит следующие часы на подготовку к нему. Выбор не случаен: более крупные города, территория рядом с оставшимися у неё базами, места, куда ещё достают её радиовышки, и города, в которых поддержка уже упала, привлекают её внимание. Деревни, радиовышки и FOB сопротивления никогда не являются целями. Цель может измениться, пока подготовка ещё на ранней стадии; если оккупанты взялись за неё, они доводят дело до конца, если только подготовка не будет сорвана."
  "Первый признак — движение. Группы выезжают из базы, которую оккупанты ещё удерживают, высаживаются у дороги недалеко от цели и идут остаток пути пешком, а грузовик разворачивается и уезжает. В городе они направляются к центру, и группа, которая удерживает его, когда там никого нет, снижает поддержку сопротивления в этом городе на шаг; следующая группа снижает её ещё раз. Радиовышка, которую сопротивление удерживает поблизости, привлекает свою собственную группу, которая должна добраться до вышки и стоять на ней долгое время, прежде чем она вернётся обратно. На базе они проникают и начинают разрушать то, что там было построено. Нахождение в любом из этих мест приостанавливает таймер, а уничтожение группы полностью прекращает попытку."
  "То, что диверсанты разрушают на базе, остаётся на месте. Сооружение превращается в руины со взрывом и дымом, и их можно восстановить за часть стоимости постройки; сохранённая и загруженная кампания восстанавливает руины. Снаряжение внутри переживает разрушение, но ничего на этом месте не работает, пока не будет отремонтировано. Они разрушают самое дешёвое сооружение первым и продвигаются вверх, поэтому бункеры и палатки исчезают раньше гаража, и риску подвергается только то, что принадлежит этой базе. Один игрок внутри базы останавливает разрушение, и одно сообщение отправляется за миссию, при первом разрушении."
  "Как только подготовка завершена, оккупанты размещают свою передовую базу между ближайшим удерживаемым объектом и целью. Грузовик снабжения выезжает, чтобы установить её, поэтому ему можно устроить засаду на дороге, и ничто не объявляет о базе, когда она установлена: её находят, а не сообщают. С этого момента оттуда выходят их группы, и это также самый короткий путь остановить всё это. Захватите или опустошите базу, снабжающую её, или оставайтесь рядом с самой передовой базой, и через некоторое время она будет снята, и оккупанты начнут искать другое место. После очистки территории от их солдат, удержание действия на её флаге снимает её на месте, и это обходится им дороже, чем голодная смерть."
  "Контратака прибывает без предупреждения. Ничто не объявляется, панель битвы не появляется и круг не рисуется на карте; вся сила высаживается сразу на обычных посадочных дистанциях и заходит, чтобы образовать кольцо примерно в ста-ста пятидесяти метрах от центра. Единственное, что выдаёт её заранее, — это то, что ваша собственная битва не может быть начата, пока она формируется, поэтому захват или восстание, доступные минуту назад, тихо недоступны. Контратаки начинаются только в светлое время суток, примерно между 5:00 и 15:00, и волны приходят со стороны, которую оккупанты действительно удерживают, включая их передовую базу."
  "Оповещение приходит, когда последний из них занял позицию, и с ним пятнадцать реальных минут, в течение которых ничего не засчитывается. Это время принадлежит сопротивлению: его достаточно, чтобы заехать, собрать рекрутов, окопаться на важной территории или решить, что место не стоит боя, и уйти. Панель битвы называет место, за которое идёт бой, и отсчитывает время до начала подсчёта очков. Если все атакующие в кольце убиты до истечения времени, битва заканчивается в пользу сопротивления, без штурма. В противном случае часы достигают нуля, кольцо сжимается, и территория считается точно так же, как в любой другой битве. Каким бы ни был исход, их передовая база падает, и оккупанты начинают выбирать заново."
  "Контратаки"
  "Вы должны иметь карту в инвентаре для использования \"Быстрого перемещения\". Откроется карта и вы можете нажать на любой купленый дом, построеный лагерь, FOB или захваченную базу. Вы заплатите небольое колличество денег за эту услугу в зависимости от уровня сложности."
  "Развертывание ПОБ"
  "Что даёт ПОБ"
  "Строительство"
  "Движение дальше"
  "ПОБ — это Передовая Оперативная База, которую сопротивление может развернуть в полевых условиях. Её нужно размещать на достаточном расстоянии от баз и радиовышек. Строительство позволяет возводить сооружения на базе, удерживаемой сопротивлением, на ПБО или в лагере, а доступные сооружения зависят от того, где именно вы находитесь."
  "ПОБ начинается как мобильный грузовик ПОБ, который покупается как любое другое транспортное средство, а действие на грузовике разворачивает ПОБ на месте его стоянки. Его нельзя развернуть рядом с любой базой, независимо от того, кто её контролирует — оккупационная фракция или сопротивление, а также в пределах семидесяти метров от радиовышки. На карте эти зоны затемнены, чтобы их можно было увидеть заранее. Развёртывание доступно только офицерам, если на сервере не установлено иное."
  "Любой игрок может быстро переместиться к ПОБ, ПОБ можно назначить точкой возрождения, а также использовать как территорию для размещения объектов и строительства. Офицер может отметить один ПОБ как приоритетный, что даёт ему собственный значок на карте и оставляет его видимым независимо от масштаба карты."
  "«Строительство» в главном меню Overthrow открывает список сооружений и камеру для их размещения неподалёку от вас. Большинство сооружений стоят только деньги и появляются сразу после размещения. Вертолётная площадка, Гараж, Склад и Казарма требуют также строительные ресурсы: размещение такого объекта списывает деньги и создаёт строительную площадку, которая остаётся на месте, пока к ней не привезут материалы. У каждого сооружения свои правила размещения, и для большинства из них требуется база, удерживаемая сопротивлением, или ПОБ, поэтому в лагере это меню предлагает меньше вариантов, чем на захваченной базе. Страница «Ресурсы» описывает работу с материалами."
  "ПОБ не привязана к одному месту. Сворачивание превращает её обратно в грузовик и собирает контейнеры вокруг неё вместе с их содержимым в транспортное средство, поэтому ПОБ можно переместить, а не бросать. Оккупирующая фракция, со своей стороны, узнаёт, где находятся лагеря и ПОБ сопротивления, и ПОБ повышает уровень давления, которое она фиксирует на окружающей территории; ни то, ни другое не привлекает к ним карательный отряд."
  "ПОБ и строительство"
  "Когда деньги заканчиваются"
  "Бесплатное топливо"
  "Топливный склад"
  "Топливо покупается сопротивлением. Заправка на топливной станции или стационарном баке стоит денег, списываемых во время заправки за каждый налитый литр. Действие «Заправить» показывает стоимость рядом с показателем бака, например ($1/л). Этот тариф зависит от сложности: полдоллара за литр на лёгком уровне, четыре доллара на самом сложном, сервер может установить его на ноль, и тогда топливо бесплатно везде. У транспортных средств и топливного склада также есть действие «Заполнить бак»: одно пятисекундное удержание, которое заполняет бак, у которого вы стоите, за один раз, показывает точную цену перед началом и продаёт вам столько топлива, сколько вы можете купить, если не хватает на полный бак."
  "Если вы не можете оплатить заправку, действие «Заправить» становится серым и показывает, что вы не можете позволить себе топливо здесь. Если деньги заканчиваются во время заправки, поток останавливается, каждый уже доставленный литр остаётся в баке, и вам сообщают об этом один раз. Несколько долларов могут остаться неизрасходованными, поскольку заправка начинается только тогда, когда вы можете оплатить ее."
  "Перемещение топлива из топливного грузовика в транспортное средство ничего не стоит, как и заливка из канистры. Платным является их наполнение: канистра или собственный топливный бак грузовика, заправленные на станции, оплачиваются по обычному тарифу. Топливо, перевозимое в грузовике, уже оплачено."
  "Сопротивление может построить топливный склад на контролируемой базе. Он вмещает 10 000 литров — две полные загрузки грузовика — и будет пустым пока его не заполнят: припаркуйте топливный грузовик рядом и слейте его в склад через действия самого склада. После этого он бесплатно заправляет транспортные средства, припаркованные рядом, а оставшееся в нём топливо сохраняется в кампании."
  "Топливо"
  "Поиск торговца"
  "Что они продают"
  "Продажа торговцу"
  "Торговец оружием — это магазин, который торгует оружием и военным снаряжением вместо обычных товаров. Торговцы оружием используют собственный список товаров, пополняют запасы отдельно от обычных магазинов, а их цены зависят от настроек сложности кампании."
  "В каждом городе крупнее деревни есть один торговец оружием, а в деревнях их нет вовсе. Торговец — это человек, стоящий в определённом месте города, а не за прилавком внутри магазина, и как только город определится с этим местом, оно остаётся неизменным до конца кампании. Торговцы оружием и обычные магазины имеют собственные значки на карте."
  "Ассортимент торговца оружием формируется по собственному списку, а не по общему каталогу магазинов: пистолеты, боеприпасы, крепления, взрывчатка и метательные предметы — основная номенклатура. При первом появлении города его торговец также получает по одной случайной единице из категорий винтовок, снайперских винтовок, пулемётов и гранатомётов. Этот выбор закрепляется за торговцем навсегда: запасы пополняются, когда они заканчиваются, но повторный розыгрыш не производится, поэтому в двух городах редко предлагается одинаковое тяжёлое вооружение. Большая часть снаряжения оккупационной фракции не продаётся."
  "В отличие от магазина, который выкупает только те товары, которые сам продаёт, торговец оружием принимает почти всё, что имеет цену. Он платит долю от стоимости предмета, установленную настройками сложности кампании, и если в этих настройках доля равна нулю — торговец вообще ничего не покупает. Крупные суммы, переходящие из рук в руки у торговца, не остаются незамеченными: они снижают стабильность города, где это произошло, и повышают поддержку сопротивления в нём."
  "Торговцы оружием"
  "Казармы"
  "Покупка Группы"
  "Приказы и режимы"
  "Управление группами"
  "Боеприпасы и топливо"
  "Передача рекрутов"
  "Удержание позиции"
  "Командование позволяет сопротивлению выставлять собственных солдат, а не эскорт. Игрок покупает целую группу в казарме, владеет ею и перемещает её в любое место на острове с карты. Группа действительно существует: она идёт или едет туда, куда её отправили, сражается с тем, что встречает на пути, и удерживает позицию, независимо от того, есть ли рядом кто-то для наблюдения."
  "Группы покупаются в казарме, стоящей на базе, контролируемой сопротивлением. На некоторых базах уже есть военные казармы, а казарму также можно построить на базе, как и любое другое сооружение, по самой высокой цене: 20 000 долларов вместе с древесиной, цементом, сталью и метизом. Действие находится на радиостанции внутри казармы, такой же, как в палатке вербовки, и любой игрок на этой базе может им воспользоваться. Казарма, превращённая в руины, не даёт ничего, пока не будет отремонтирована."
  "На экране представлены одиннадцать групп, от небольших команд до стрелкового отделения, три из которых прибывают с техникой. Выбор группы показывает цену и состав: стоимость найма каждого бойца, необходимое снаряжение и, если есть транспорт, цена этого транспорта по полной стоимости в магазине. Снаряжение, уже хранящееся в зарегистрированном складе в радиусе 150 метров, списывается со склада, а не покупается, и в квоте указывается, сколько это покрыло. Покупка также забирает сторонников из ближайшего города, поэтому в городе без поддержки группу нанять нельзя. У каждого игрока есть лимит на количество солдат Командования, и покупка, превышающая лимит, отклоняется до списания денег."
  "На карте каждого игрока каждая группа Командования отображается зелёным символом, ваши собственные — ярко, других игроков — тускло, и их можно отключить в панели слоёв карты. Выбор группы показывает её владельца, режим, расстояние до цели, расстояние до вас и количество живых бойцов. Вашей группой можно приказать двигаться в точку под курсором карты, а её режим можно переключать между «Оборона» (удерживать позицию), «Патруль» (ходить по кругу) и «Атака» (зачистка). Группа в пути показывает пунктирную линию к месту назначения. На символе появляется метка при контакте с врагом и значок боеприпасов, когда они заканчиваются. Приказы группе другого игрока отклоняются."
  "Управление группами в главном меню Overthrow показывает список ваших групп с их статусом и количеством используемых слотов. Оттуда группу можно показать на карте или распустить после подтверждения, что навсегда удаляет её, транспорт и приказы из мира."
  "Группа, оставленная рядом с зарегистрированным складом, периодически пополняет свои магазины из запасов на складе. Группа с техникой, припаркованной рядом с источником топлива, заправляется так же, и топливо списывается с владельца группы по той же цене, что и при ручной заправке; построенный сопротивлением топливный склад бесплатен."
  "Рекрутов, удерживающих позицию, можно передать в Командование вместо управления по одному. Экран управления рекрутами показывает удерживающих позицию, сгруппированных по месту нахождения, и каждая такая группа имеет действие «Преобразовать в Командование». Это изменение необратимо. Эти рекруты покидают ваш список и освобождают слоты, их имена, опыт и навыки перестают отслеживаться, но те же персонажи продолжают существовать в новой группе с уже имеющимся снаряжением."
  "Базы, лагеря и ПОБ больше не содержат покупаемого гарнизона, а меню, где его можно было приобрести, удалены. Территория удерживается размещением на ней группы Командования в режиме «Оборона», которую, в отличие от гарнизона, можно в любой момент забрать и отправить в другое место. Кампания, сохранённая до этого изменения, загружается без старых гарнизонов."
  "Командование"
  "Откройте главное меню нажатем кнопки <color rgba='226,168,79,255'><action name=\\"OverthrowMainMenu\\"/></color>для доступа ко всем основным возможностям Overthrow."
  "Меню открывается для города, в котором вы находитесь, показывая его население, стабильность, количество сторонников и журнал последних уведомлений.<br/>Отсюда можно перейти к информации на карте и быстрому перемещению, размещению и строительству, меню сопротивления, заданиям, меню недвижимости для здания, в котором вы стоите, управлению рекрутами, характеристикам персонажа, последней показанной подсказке и запросу на сохранение кампании.<br/>Некоторые пункты работают только при определённых условиях: недвижимость остаётся неактивной, если здание нельзя приобрести; подсказки — пока не появится первая подсказка; сохранение доступно только офицерам. Нахождение рядом с определёнными местами, например с прилавком магазина, вместо этого открывает личное меню этого места."
  "Главное меню"
  "Поездка на автобусе"
  "Карта — это обзор кампании. Помимо местности, на ней отмечены здания и транспортные средства, которыми вы владеете, лагеря и ПОБ, размещённые сопротивлением, а также известные магазины, торговцы оружием и порты. Наличие карты в инвентаре делает возможным использование информации на карте и опций быстрого перемещения."
  "Панель показывает ближайший город к выбранной точке, отображая его население, расстояние до него, уровень стабильности, количество сторонников, а также текущие модификаторы, повышающие или понижающие стабильность и поддержку в этом городе."
  "Быстрое перемещение работает при определённых условиях. Точка назначения должна находиться рядом с объектом под контролем сопротивления: домом, которым вы владеете или арендуете, вашим собственным или публичным лагерем, ПОБ или базой под контролем сопротивления. Также цель должна быть достаточно удалена от вашего текущего местоположения. Перемещение недоступно, пока у вас есть уровень розыска, а активная группа быстрого реагирования может блокировать его в зависимости от настроек сложности кампании."
  "Стоимость зависит от настроек сложности, а не является фиксированной ценой. Рекруты, стоящие рядом с вами, путешествуют вместе с вами, когда вы идёте пешком, и каждый из них добавляет к стоимости такую же сумму. Быстрое перемещение изнутри транспортного средства работает только в том случае, если вы находитесь за рулём."
  "Автобусные остановки предлагают альтернативный способ передвижения по карте. Посадка на автобус открывает карту, чтобы можно было выбрать пункт назначения рядом с другой остановкой, а стоимость проезда рассчитывается за километраж по тарифу, заданному настройками сложности. Автобусные поездки не учитывают ваш уровень розыска и не проверяют, контролирует ли сопротивление эту территорию, но требуют, чтобы вы были вне транспортного средства, а рекруты рядом с вами добавляют свою собственную плату за проезд."
  "Карта и быстрое перемещение"
  "Влияние"
  "Выбор места на карте — наведением курсора на его маркер или щелчком для закрепления панели — показывает пунктирные линии к другим местам, с которыми оно связано влиянием. Выберите город, и линии придут от радиовышек и военных баз, зона действия которых охватывает его, вместе с революционным импульсом между ним и любым достаточно близким городом, который передаётся от удерживаемого сопротивлением города к оккупированному поблизости. Выберите радиовышку или военную базу — и линия протянется к каждому городу в зоне её действия, а пунктирное кольцо отметит границы этой зоны; кольцо рисуется контуром, чтобы карта внутри оставалась читаемой. Выбор чего-либо ещё — дома, магазина, передовой базы, транспорта, автобусной остановки — не рисует линий, поскольку эти объекты не создают и не получают влияние. Каждая линия окрашена в цвет фракции, оказывающей влияние: владельца вышки или базы, или города, передающего импульс. Это тот же цвет, что и у маркера этого места."
  "Яркая линия с длинными штрихами означает влияние, которое кампания в данный момент применяет, и город, к которому она ведёт, отображает его на своей панели как «Ближайшая радиовышка», «Ближайшая база» или «Революционный импульс». Тусклая линия с более короткими и редкими штрихами означает, что связь существует, но кампания её не применяет. На это есть две причины, и ни одна из них не является исчерпывающей. Первая — вражеский источник перевешивает дружественный того же типа: одна оккупационная вышка или база в пределах досягаемости перевешивает любое количество дружественных, поэтому город может находиться в зоне действия дружественной вышки и всё равно иметь отрицательную запись. Вторая — саботированная радиовышка, которая не вещает, пока не работает. Этот слой лишь объединяет в одну картину связи, уже отображаемые на панелях мест, и ничего не меняет в кампании; у него есть собственная строка «Влияние» в панели фильтров карты, которая сохраняется в профиле."
  "Вы должны иметь карту в инвентаре для использования \"Информации о карте\". Нажав на эту  кнопку из главного меню, в открывшейся карте, вы  нажать на любую точку на карте, чтобы посмотреть информацию об этой локации, включая разведданые известные об этой точке."
  "Фильтрация карты"
  "Запись фильтра в полосе значков слева от карты открывает панель с рядами включения/выключения. Каждая категория маркеров имеет свой ряд — от городов и баз до домов, автобусных остановок и ваших транспортных средств, и каждый слой под ними, включая затенение территории и кольца запрещённых зон. Маркеры игроков имеют свой ряд в зависимости от настроек сложности. Отключение ряда сразу скрывает категорию, а повторное включение возвращает её. Изначально всё включено, и включённая категория сохраняет свой порог масштаба, поэтому мелкие маркеры появляются только при приближении. Панелью можно управлять как мышью, так и контроллером."
  "То, что вы скрываете, сохраняется в вашем игровом профиле, а не в кампании, поэтому те же настройки будут ждать вас при следующем открытии карты, в другой сессии, в любой кампании или на сервере. Сама кампания не меняется: фильтр решает только то, что отображается для вас, а все остальные видят то, что выбрали для себя."
  "Территория"
  "Карта затеняет территорию, которую всё ещё удерживает оккупационная фракция, её цветом. Территория, захваченная сопротивлением, остаётся без затенения, поэтому по мере прохождения кампании затенение отступает, а на полностью освобождённом острове его нет. Регионы определяются городами, военными базами, радиовышками и ПОБ сопротивления, и чем больше объект, тем дальше простирается его территория: база влияет дальше, чем город, а столица дальше, чем деревня. Территория заканчивается у побережья, но реки и внутренние озёра её не делят."
  "Там, где оккупированная территория граничит с территорией сопротивления, край обозначается полосой; у побережья полосы нет. Регион с диагональной штриховкой является спорным: оккупанты всё ещё удерживают его, но половина или более населения города поддерживает сопротивление, используя тот же показатель поддержки, что отображается на панели города. Так могут обозначаться только города, поскольку у баз, вышек и ПОБ нет населения для измерения. Затенение обновляется каждые несколько секунд, поэтому смена контроля отображается без закрытия карты."
  "Потери остаются потерями"
  "Патрули продолжают двигаться"
  "Радиовышки"
  "Оборона базы"
  "Бронетехника и блокпосты"
  "Оккупационная фракция держит постоянные силы на поле: оборону на военных базах, пешие патрули в контролируемых городах, автомобильные патрули на дорогах и гарнизон на каждой удерживаемой радиовышке. Оборона баз, автомобильные патрули и гарнизоны вышек покупаются из одного и того же пула ресурсов, поэтому у фракции, испытывающей их нехватку, их меньше; пешие патрули в городе ничего не стоят."
  "Бронированные машины также отправляются в бой. Когда идёт сражение за базу или город, фракция может отправить до двух таких машин по дороге со своей собственной территории; они добираются за время, необходимое для поездки, прибывая позже пехотинцев, которые пришли пешком, и по дороге, на которой кто-то мог бы устроить засаду. Уничтожение машины не останавливает перевозимый ею отряд: бойцы выходят и продолжают идти пешком. Потерянная в открытой местности машина отмечает это место как заслуживающее внимания, и другая может быть отправлена, чтобы некоторое время прочесать район, прежде чем уехать. Противотанковый гранатомёт начинает окупать свой вес где-то в середине кампании."
  "Солдаты, убитые в патруле, обороне базы или гарнизоне вышки, исчезают навсегда. Когда группа перестаёт наблюдаться и затем снова появляется, она возвращается только с теми, кто выжил в последнем бою, а сохранённая и загруженная кампания восстанавливает тех же выживших, а не новое полное подразделение. База остаётся в том состоянии, в котором вы её оставили. Сила, уничтоженная до последнего человека, может быть заменена позже, но это стоит фракции."
  "Городской патруль обходит свой маршрут, независимо от того, есть ли кто-то рядом для наблюдения. Если рядом никого нет, он продолжает тот же маршрут, поэтому он не будет ждать за углом, где его видели в последний раз; он появляется в той точке маршрута, до которой дошёл. Патруль, охраняющий периметр базы, ведёт себя так же. Гарнизон на радиовышке — другое дело: он удерживает позицию, как и солдаты на боевых позициях базы, на вышках и на блокпостах."
  "Радиовышка, удерживаемая оккупантами, переходит в другие руки только тогда, когда все солдаты гарнизона убиты, и только тогда. Просто стоять рядом с вышкой ничего не даёт, а уход и возвращение не сбрасывает и не завершает бой: гарнизон всё ещё недосчитывается погибших, и вышка остаётся оккупированной, пока не погибнет последний. Она может вернуться обратно: вышка, удерживаемая сопротивлением рядом с тем, над чем работают оккупанты, привлекает их собственную группу, и вышка снова становится их только в том случае, если эта группа всё ещё стоит на ней, когда время удержания истекает. Ваше присутствие там останавливает их таймер."
  "Вышка также может оказаться без гарнизона. Гарнизон оплачивается из резервов фракции, поэтому у истощённой фракции вышки пустуют, а восстановившаяся может разместить гарнизон на вышке, мимо которой вы прошли несколько дней назад. Пока где-то на острове идёт битва и пока никто не подключён, новые силы любого рода не выставляются; уже имеющиеся продолжают действовать как прежде."
  "Военная база удерживается тем, что её владельцы смогли там разместить. Патруль обходит периметр, солдаты занимают подготовленные позиции, охранники стоят на вышках, снайперы занимают отмеченные места, на дорогах устанавливаются блокпосты, внутри ограждения строятся укрепления из мешков с песком и склады боеприпасов, во дворе паркуются грузовики. Каждый из них покупается и оплачивается отдельно, примерно в таком порядке, поэтому база укрепляется со временем, а не появляется готовой. Тяжёлая пехота и противотанковое отделение добавляются только тогда, когда фракция оказывается под достаточным давлением."
  "Ничего нового не размещается на базе, пока в ней кто-то находится, поэтому база не укрепляется у вас на глазах. Только что захваченная база или база, у которой мало ресурсов, может быть слабо удержана, а через несколько недель — укреплена. Потери там сохраняются так же, как и потери патрулей, хотя позиция не остаётся пустой навсегда: выжившие возвращаются на свои вышки и позиции в следующий раз, когда на место посмотрят, а позиция, уничтоженная до последнего человека, может быть куплена заново. Очистка позиции считается окончательной только когда база меняет владельца."
  "Бронетехника, которую оккупационная фракция выставляет на дороги, становится тяжелее по мере того, как кампания поворачивается против неё. На раннем этапе самое страшное — это вооружённый джип. Позже — пулемётный грузовик или бронеавтомобиль, а в конце — колёсный бронетранспортёр с пушкой или тяжёлым пулемётом. Каждая следующая ступень стоит в несколько раз дороже предыдущей, и моторизованные силы выставляют только то, что позволяет их бюджет, поэтому истощённая фракция продолжает посылать дешёвые. Сложность кампании смещает всю шкалу: на более высоких уровнях сложности тяжёлая техника появляется гораздо раньше."
  "Вооружённая техника, стоящая внутри базы, — не просто декорация. Она принадлежит этой базе, стоит без экипажа, пока спокойно, а когда на базе начинается бой, экипаж выводит её на огневую позицию недалеко от стрельбы, а не въезжает в неё. Техника, припаркованная на дороге в город, против которого фракция сейчас работает, также поставлена намеренно: люди, приехавшие на ней, рассредоточиваются вокруг, пока её пулемёт остаётся под прицелом, и она меняет подход каждые несколько минут, вместо того чтобы стоять на одной дороге весь день."
  "Патрули и гарнизоны"
  "Койка — один из предметов в этом списке, стоимостью тридцать, и она имеет то же действие для сна, что и кровать, поэтому в лагере или ПОБ можно обеспечить место для сна."
  "Импорт"
  "Экспорт"
  "Ресурсы"
  "Порт торгует оптом с транспортным средством, в котором вы сидите, и вы и транспорт должны находиться в пределах тридцати метров от него. Транспорт должен иметь собственное хранилище, поэтому нелегальная или вооружённая техника там вообще не может торговать. В окне порта есть стороны «Импорт» и «Экспорт»."
  "Импорт требует первого уровня торговли. Импортируемое зачисляется в хранилище транспорта, а не создаётся в нём, и плата взимается только за то, что поместилось, поэтому машина с местом для пятидесяти предметов платит за пятьдесят. Товары, которых нет в обычных магазинах, предлагаются только на пятом уровне торговли или в порту, ближайшая территория которого контролируется сопротивлением."
  "Экспорт продаёт из того же хранилища транспорта. Порт платит за предмет долю от стоимости импорта, меньшую, чем покупка там, поэтому вывозить магазинные товары обратно в порт невыгодно. Товары, которых нет в обычных магазинах, имеют те же условия, что и при ввозе, а то, что экономика не оценивает, вообще не может быть экспортировано."
  "Обе стороны окна порта также имеют вкладку «Ресурсы», торгующую оптовыми строительными материалами из грузового отсека вашего грузовика. Они оцениваются отдельно от всего остального, и их цена меняется в течение кампании, а не остаётся постоянной. Страница «Ресурсы» описывает их полностью."
  "Порты"
  "Покупка произведённого на объекте"
  "Владение объектом"
  "Публичные и частные"
  "На карте"
  "Лесопилка, сталелитейный или цементный завод могут быть производственным объектом, отмеченным большим знаком. Каждый производит один вид строительного ресурса и ничего другого, добавляя определённое количество в собственное хранилище раз в игровой час, независимо от того, принадлежит он кому-то или нет. Хранилище является ограничителем: двадцать кубометров на стандартных объектах, и объект с полным хранилищем приостанавливает производство, пока не освободится место. Скорость менее одной единицы в час всё равно суммируется, поскольку дробная часть сохраняется, а часы, проспанные, также производят ресурсы."
  "Пока объектом никто не владеет, он продаёт накопленное. Его действие «Купить запас» показывает количество и открывает экран с одной строкой, предлагающей восемьдесят процентов от текущей цены импорта этого ресурса в порту, поэтому объект конкурирует с портом. Он продаёт только то, что произвёл, и груз должен быть помещён в другое хранилище в радиусе двадцати пяти метров; экран сообщает об этом, если хранилища нет. Груз, который не помещается, отсутствует или не может быть оплачен, отклоняется целиком, поэтому покупка никогда не бывает частичной."
  "Покупка самого объекта — это действие на нём, цена которого определяется стоимостью объекта и умножается на множитель недвижимости сложности; цена на этикетке — это цена, которая списывается. Офицер может купить его из фондов сопротивления, что передаёт объект в собственность сопротивления. Покупка опустошает хранилище в тот же момент, когда списываются деньги, поэтому объект никогда не стоит покупать ради запасов. Объект никогда не продаётся, его содержание ничего не стоит, и оккупационная фракция не охотится за ним."
  "Купленный игроком объект становится частным, и частный объект открывает своё хранилище только этому игроку. Владелец может сделать его публичным, офицер может сделать то же самое с объектом, принадлежащим сопротивлению, а публичный или принадлежащий сопротивлению объект открыт для любого члена сопротивления. Тот, кто не может его открыть, всё равно видит действие «Груз», но оно заблокировано с пояснением. Принадлежащий объект перестаёт продавать: всё, что он производит, идёт на строительство, на торговлю с другим игроком или в порт на экспорт."
  "Производственные объекты отображаются на карте с тем же масштабом, что и города и базы. Значок белый, пока объект не принадлежит никому, зелёный, когда принадлежит вам, публичен или принадлежит сопротивлению, и полупрозрачный белый, когда кто-то другой держит его в частной собственности. Его информационная панель показывает статус, владельца (если есть), содержимое хранилища, объём, производительность в час и, если объект не принадлежит никому, стоимость покупки."
  "Производственные объекты"
  "Ammunition Before Money"
  "Paying for the Rest"
  "Carrying the Ammunition"
  "Every armed vehicle carries a Re-arm action, from an armed jeep to an APC to a helicopter gunship. It is one action and one full restock: every turret magazine and every rocket pod the vehicle has comes back full together, and there is no way to refill part of it."
  "A re-arm spends storage before it spends money. It looks in the vehicle's own storage first, then in every storage within twenty five metres that you are allowed to draw from, for the magazines the vehicle's weapons take, and anything it finds there is spent instead of bought. When storage covers the whole re-arm the action reads Re-arm (from storage), costs nothing and works anywhere, so a crew that hauled its own ammunition is not tied to a base."
  "Only what storage cannot cover is bought, and the price is that same share of the full one, so half the magazines covered is half the bill. That bought part is the only part with a place attached to it: the vehicle has to be standing at a built Helipad or a built Garage at a base the resistance holds, or within a hundred metres of a deployed FOB. Anywhere else with something still to buy, the action shows blocked and names the helipad, garage or FOB it wants."
  "Vehicle weapon ammunition can be imported at a port and moved from one storage list to another, but it never comes out into anyone's hands: taking it out reports it as missing and it stays on the list. That is exactly where a re-arm looks for it, so a crate of it on the list of a truck parked alongside counts for as much as a crate on the vehicle's own."
  "Re-arming Vehicles"
  "Найм рекрутов"
  "Приказы и Группы"
  "Опыт и снаряжение"
  "Управление рекрутами"
  "Удержание позиции"
  "Обмен снаряжения"
  "Поиск ваших рекрутов"
  "Экипирование рекрутов"
  "Передача рекрутов в Командование"
  "Граждан можно нанимать как рекрутов, и они будут сражаться вместе с вами. Рекруты закрепляются за игроком, который их нанял, сохраняются за ним между сессиями, а один игрок может одновременно удерживать до шестнадцати бойцов."
  "Рекрутов, удерживающих позицию, также можно передать в High Command, который управляет целыми группами, заказываемыми игроком с карты. Раздел «Удержание позиции» разделён по месту нахождения рекрутов, и каждая такая группа имеет действие «Преобразовать в High Command». Это необратимо: рекруты покидают ваш список и освобождают слоты, их имена, опыт и навыки перестают отслеживаться, но те же тела и их снаряжение продолжают существовать в новой группе."
  "Гражданина можно нанять, удерживая действие «Нанять» вблизи от него; это стоит сумму, указанную в настройках сложности. Вербовочная палатка, построенная на базе или ПОБ, вместо этого нанимает из ближайшего города за полцены и забирает одного из сторонников этого города, поэтому она работает только пока у города есть поддержка. В любом случае рекрут становится вашим, и никто не может удерживать более шестнадцати одновременно."
  "Рекруты присоединяются к вашей группе и получают приказы через обычное меню группового командования, как и любые другие подчинённые ИИ. Если вы присоединяетесь к группе другого игрока, рекруты, которые следуют за вами, переходят с вами, и этот игрок командует ими, пока вы там; они по-прежнему ваши и возвращаются под ваше командование, когда вы покидаете группу или переподключаетесь. Рекруты в радиусе пятидесяти метров от вас при быстром перемещении отправляются вместе с вами, если только они не удерживают позицию, и каждый из них добавляет к поездке ещё одну плату того же размера."
  "Рекруты получают опыт за убийство солдат оккупационной фракции и повышают собственный уровень, а их убийства, уровень и прогресс отображаются рядом с именем. Они появляются в гражданской одежде, и сохранённый комплект снаряжения можно применить к одному рекруту поблизости или ко всем сразу из экрана загрузок. Всё, что несёт рекрут, остаётся при нём и сохраняется после загрузки сохранения."
  "«Управление рекрутами» в главном меню Overthrow отображает список всех нанятых вами бойцов с указанием их родного города и того, находятся ли они сейчас в мире. Оттуда рекрута можно переименовать, отметить на карте или уволить. Рекруты сохраняются между сессиями: они покидают мир примерно через десять минут после отключения владельца и возвращаются на то же место, когда игрок возвращается. Убитый рекрут теряется навсегда, а его место в списке становится свободным."
  "Вашему рекруту можно приказать удерживать позицию, удерживая действие на самом рекруте или через переключатель на экране «Управление рекрутами». Рекрут, удерживающий позицию, покидает вашу группу и остаётся на месте, ожидая там вместо того, чтобы бродить, и открывает ответный огонь в случае атаки. Рекруты, оставленные удерживать позицию в радиусе пятидесяти метров друг от друга, объединяются в одну группу. Они по-прежнему ваши и занимают один из ваших шестнадцати слотов, не перемещаются вместе с вами при быстром перемещении и остаются на месте, когда вы присоединяетесь к группе другого игрока. Рекруту, находящемуся внутри транспортного средства, нельзя приказать удерживать позицию. После загрузки сохранения они возвращаются туда, где их оставили, и продолжают удерживать позицию."
  "У рекрута, который следует за вами, есть действие «Обмен снаряжением», доступное с близкого расстояния, которое полностью обменивает вашу экипировку на его: одежду, броню, рюкзак и оружие вместе со всем содержимым. При обмене перемещаются реальные предметы, а не копируются, поэтому ничего не может быть создано или уничтожено. Если какая-то вещь не помещается на соответствующее место, она укладывается в другой слот или, в худшем случае, остаётся на земле, а после этого появляется сообщение о том, что обмен был лишь частичным. Рекрут, удерживающий позицию, не предлагает этого действия."
  "На карте есть слой «Рекруты», который отображает маркеры всех ваших бойцов: яркие для следующих за вами и приглушённые для удерживающих позицию, со значком, показывающим, вооружён ли рекрут и есть ли у него боеприпасы. Этот слой можно отключить на панели слоёв карты, и выбор сохранится между сессиями. На экране «Управление рекрутами» отображается то же разделение на секции «Активные» и «Удерживают позицию» со значком статуса в каждой строке и счётчиком использованных слотов из шестнадцати доступных."
  "Палатка вербовки имеет второе действие — «Купить экипированного рекрута», которое открывает ваши пресеты с ценой рядом с каждым. Выбор пресета показывает количество предметов и общую стоимость: цена снаряжения в местном магазине плюс плата за удобство (зависит от сложности) плюс обычная стоимость найма в палатке. Снаряжение, уже хранящееся на складе в радиусе 150 метров, списывается со склада, а не покупается, и в квоте указывается, сколько это покрыло. Покупка создаёт рекрута рядом с палаткой уже в снаряжении, и он забирает сторонника города и слот, как и любой другой рекрут из палатки. Пресет, содержащий то, что магазины не продают, не может быть оценён и отклоняется по имени, а если рекрут появляется без части снаряжения, с вас списывается только стоимость найма."
  "Рекруты"
  "Меню позволяющее посмотреть иноформацию или изменить настройки сопротивления. Офицер здесь может назначать на должность других офицеров, а так же задавать размер налогов. (По умолчанию 0%)  это позволит вместо этого вносить сумму регулярного дохода непосредственно в фонды сопротивления. Офицер здесь может снимать деньги со счета сопротивления или передавать другому игроку. Любой игрок может делать взносы на счёт сопротивления, для его усиления."
  "Покупка и продажа в порту"
  "Перевозка"
  "Куча ящиков"
  "Строительство с ресурсами"
  "Склады"
  "Древесина, цемент, сталь и метизы — это сыпучие строительные материалы. Они не являются предметами в инвентаре: грузовик, куча ящиков или склад хранят их как количество и измеряют в кубических метрах. Четыре материала различаются по объёму и весу на единицу: древесина самая громоздкая и дешёвая, а метизы — самые компактные и дорогие. Порты продают их, производственные объекты на острове производят, грузовики перевозят, кучи ящиков хранят на земле, склады хранят, а некоторые сооружения не могут быть построены без них."
  "В окне порта есть вкладка «Ресурсы» как на импорте, так и на экспорте. Цена ресурса там является живой и меняется в течение кампании, а не фиксированной, как в магазине: она меняется не чаще одного раза за шестичасовое игровое окно, остаётся в пределах диапазона вокруг базовой цены, и панель деталей показывает, находится ли она ниже, около или выше базовой. Оккупационное давление поднимает цены, а контроль сопротивления над портами их снижает. Порт платит половину текущей цены за обратный выкуп ресурса. В любом случае торговля идёт через хранилище вашего грузовика, поэтому ресурс отображается заблокированным с пояснением, если под вами нет грузовика или в нём нет места. Сложность масштабирует как цену, так и амплитуду колебаний."
  "Грузовики — единственные транспортные средства с грузовым отсеком, поэтому у автомобилей, бронетранспортёров и вертолётов действие «Груз» вообще отсутствует. Обычный грузовик вмещает пятнадцать кубометров, транспортные варианты M923A1 и Урал — двадцать, а мобильный FOB — восемь, потому что он уже везёт базу. Сидя в грузовике, вы видите панель на экране с перечнем того, что на борту, и сколько места занято. Груз, который не помещается, отклоняется целиком, и в сообщении указывается оставшееся пространство, поэтому покупка или перемещение никогда не бывают частичными."
  "Грузовое хранилище открывает экран с двумя режимами: «Взять» и «Положить», а также список ближайших мест, куда можно отправить груз, отсортированный по расстоянию. В режиме «Взять» одним из мест назначения является земля. Отправка груза туда создаёт кучу ящиков перед вами, а сброс второго груза в пределах нескольких метров от этой кучи добавляется к ней, а не создаёт новую. Куча не имеет ограничения по объёму, отображается на карте с содержимым и объёмом, открывается как любое другое хранилище и исчезает, когда опустошается."
  "Большинство сооружений по-прежнему стоят только деньги и появляются сразу. Вертолётная площадка, гараж, склад и казарма требуют также ресурсы, и их размещение создаёт строительную площадку. Деньги списываются в этот момент, и площадка стоит до тех пор, пока материалы не будут доставлены. На площадке есть два действия: «Требования» показывает, что нужно и что есть в радиусе, и «Построить» завершает строительство, используя кучи ящиков в радиусе тридцати метров, опустошая ближайшие из них в первую очередь. Только кучи учитываются, поэтому груз в грузовике или на складе не в счёт. Если площадка удаляется, ничего не возвращается, а сложность масштабирует требуемое количество."
  "Здание склада хранит ресурсы помимо уже имеющихся предметов, с собственным действием, и ни одна из сторон не имеет ограничений. Склад также можно построить за деньги и все четыре ресурса. Его можно построить на базе, контролируемой сопротивлением, и в городе, контролируемом сопротивлением, — это единственное место, где список строительства выходит за пределы баз, FOB и лагерей; город, удерживаемый оккупантами, не позволит, как и деревня. После постройки это обычный склад, на карте, в собственности и по вместимости."
  "Ресурсы"
  "Руины бесполезны"
  "Снаряжение внутри сохраняется"
  "Восстановление"
  "Противник тоже восстанавливает"
  "Сооружение, разрушенное оккупантами на одной из ваших баз, не исчезает. Оно превращается в руины со взрывом и столбом дыма, и то, что осталось, стоит на том же месте. Сохранённая и загруженная кампания восстанавливает руины, а восстановленное сооружение загружается отремонтированным."
  "Руины инертны. На разрушенном топливном складе нет заправки, в разрушенной палатке нет вербовки, в разрушенном медицинском тенте нет лечения, в разрушенном гараже нет магазина, нет парковки и нет доступа к тому, что там хранилось. Насосы и ремонтные посты также перестают работать, поэтому ничто на этом месте не функционирует, пока оно разрушено."
  "Ничто из хранящегося в сооружении не теряется при его разрушении. Контейнеры и их содержимое остаются нетронутыми, и только доступ закрывается. Восстановление сооружения снова открывает их со всем, что было внутри."
  "На руинах есть действие «Восстановить», удерживаемое двадцать секунд, и само действие показывает цену. Восстановление стоит долю от стоимости постройки, масштабируемую той же сложностью: половина на лёгком и обычном, три четверти на сложном и полная цена на экстремальном и безумном. Деньги проверяются до начала работы и списываются по окончании, поэтому восстановление, которое вы не можете оплатить, отклоняется, а не оставляется недоделанным."
  "Оккупационная фракция делает то же самое на своей территории. Ремонтная группа отправляется на их базу, где есть разрушенные сооружения, и восстанавливает их по одному, начиная с самых дешёвых, без предупреждения. Работа идёт только когда рядом никого нет: игрок в радиусе ста пятидесяти метров от центра базы приостанавливает её."
  "Руины и ремонт"
  "Откуда берутся деньги"
  "Цены"
  "Запасы"
  "Продажа в магазины"
  "В городах есть магазины, которые как покупают у вас, так и продают вам. Ассортимент магазина зависит от его типа, запасы ограничены и пополняются каждое утро, а цены зависят от города: количество товара на ближайших складах и расстояние города до порта влияют на конечную стоимость."
  "Новый персонаж начинает с суммы денег, установленной настройками сложности кампании. После этого доход поступает из городов четыре раза в день по игровому времени: города платят налоги в зависимости от населения и стабильности, города, поддерживающие сопротивление, делают пожертвования сверх того, а города, всё ещё удерживаемые оккупационной фракцией, не платят налогов вовсе. Сначала из общей суммы вычитается налог сопротивления, а остаток распределяется между игроками, которые находятся в сети в этот момент; если никто не в сети, всё уходит в фонд сопротивления. Продажи в магазинах, выполненные задания и арендная плата от вашей недвижимости пополняют тот же баланс, который привязан к вашему игроку, а не хранится в кармане."
  "Каждый предмет имеет базовую цену, а цена в магазине — это базовая цена, скорректированная в зависимости от того, где вы находитесь. На неё влияют два фактора: насколько хорошо окрестный город обеспечен этим товаром и насколько далеко этот город находится от ближайшего порта, поэтому товары стоят дороже по мере удаления вглубь континента. Затем магазин добавляет свою наценку, поэтому он никогда не платит за предмет столько же, сколько просит при продаже. Навык торговли снижает цену покупки для вас, а цены на транспортные средства дополнительно масштабируются настройками сложности."
  "В магазинах ограниченное количество каждого товара, и город может вместить лишь определённый его объём: вместе это определяют население, стабильность и востребованность товара. Горожане покупают товары с полок с течением дней, поэтому запасы падают независимо от того, торгует ли кто-то ещё. Каждое утро магазины пополняют свои запасы до этого предела, а всё, что вы продали магазину, возвращается на его полки."
  "Магазин, торгующий одним видом товаров, выкупает только этот вид, поэтому магазин одежды не заинтересуется винтовкой, в то время как торговцы оружием и наркодилеры принимают почти всё, что имеет цену. Предмет, который надет, находится в руках или висит через плечо, нельзя продать, пока он экипирован, а предмет без стоимости вообще нельзя продать; в меню указывается соответствующее правило. Магазины транспортных средств и пункты снабжения работают только на продажу и никогда ничего не покупают. Обычная торговля также приносит пользу городу: сделки на сумму выше незначительной на некоторое время повышают стабильность этого города."
  "Деньги и магазины"
  "Получение опыта"
  "Уровни и очки"
  "Три навыка"
  "Профиль персонажа"
  "Опыт начисляется за большинство действий, совершаемых вами на благо сопротивления, и его достаточное количество повышает ваш уровень. Каждый уровень после первого даёт одно очко, и очки тратятся на навыки в листе вашего персонажа."
  "Опыт начисляется за убийство солдат оккупационной фракции, за строительство, за размещение объектов, за выполнение задания, которое даёт опыт, и в небольших количествах за торговлю в магазине или у дилера. Каждый объект строительства и размещения имеет собственную ценность, поэтому за более крупные работы вы получаете больше опыта. За торговлю опыт начисляется время от времени, а не за каждую сделку, поэтому серия мелких продаж в одной точке не суммируется. Гибель персонажа приводит к потере опыта, однако ваш общий показатель никогда не опускается ниже нуля."
  "Ваш уровень рассчитывается на основе общего количества накопленного опыта, причём каждый следующий уровень требует больше опыта, чем предыдущий. Каждый уровень после первого даёт одно очко навыков. Уже потраченные очки вычитаются из этого количества, поэтому остаток очков равен вашему уровню минус один и минус каждый уровень навыков, приобретённый вами ранее."
  "Торговля, Скрытность и Дипломатия имеют по пять уровней каждый, которые покупаются по одному уровню за раз. Торговля снижает цену покупки, открывает импорт на первом уровне, а на пятом расширяет импорт на товары, которых нет в обычных магазинах. Скрытность сокращает расстояние, на котором оккупационная фракция вас замечает, причём рекруты используют Скрытность своего командира, а не свою собственную. Дипломатия повышает шанс того, что гражданский, с которым вы заговорите, перейдёт на сторону сопротивления."
  "Вкладка Профиль персонажа в главном меню Overthrow, — это место, где тратятся очки. В нём указаны ваш уровень, прогресс до следующего, количество доступных очков, а также каждый навык с его пятью уровнями и тем, что даёт каждый уровень. Уже полученные уровни отмечены, а кнопка покупки следующего уровня появляется только при наличии свободного очка и возможности повысить навык."
  "Навыки и уровни"
  "Где работает кровать"
  "Часы всё равно идут"
  "Двенадцать часов между снами"
  "Когда действие недоступно"
  "В кровати можно спать, и это перемещает игровое время на восемь часов вперёд. Экран темнеет, задерживается на мгновение и возвращается к новому времени суток. Сон — это одиночное действие: в многопользовательской сессии оно вообще не предлагается."
  "Действие появляется на кровати, стоящей в вашем доме, в вашем лагере, на развёрнутом ПОБ или на базе, контролируемой сопротивлением. Кровать в любом другом месте ничего не предлагает, потому что эти четыре места — те же, где сопротивление может размещать свои объекты."
  "Восемь часов воспроизводятся, а не пропускаются. Налоги и пожертвования выплачиваются, магазины закупают товары каждый раз, когда проходит шестичасовая отметка, пополняются, если проходит семь утра, арендная плата перечисляется, если проходит полночь, а оккупационная фракция получает ресурсы, тратит их на базы и снижает угрозу каждые пятнадцать минут в том порядке, в котором это происходило бы, пока вы бодрствовали. Уведомления о выплатах приходят на чёрном экране и остаются, когда он исчезает."
  "Повторный сон невозможен в течение двенадцати игровых часов, отсчитываемых с момента пробуждения, а не с момента, когда вы легли. Эти двенадцать часов вы проводите бодрствуя, поэтому с учётом восьми часов сна между двумя снами проходит двадцать игровых часов, и пока они не пройдут, действие остаётся на кровати с указанием оставшегося времени."
  "Во время атаки и пока вы в розыске, действие на кровати остаётся видимым, но отклоняется с указанием причины. Кровать не на территории сопротивления — другой случай, там действие не показывается вообще."
  "Сон"
  "Что имеет хранилище"
  "Извлечение вещей"
  "Помещение вещей"
  "Загрузка и выгрузка"
  "Склады"
  "Ящики с боеприпасами, здания складов и большинство легальных колёсных транспортных средств имеют собственное хранилище: список товаров, который хранится в сохранении кампании, а не лежит внутри. Действие «Хранилище» на контейнере показывает количество предметов в списке, а открытие его показывает список, корзину для заполнения и место назначения для отправки."
  "Хранилище грузовика не имеет ограничений, обычный автомобиль вмещает триста предметов, а ящик с боеприпасами или складское здание — столько, сколько дано. Нелегальный или вооружённый транспорт вообще не имеет хранилища, как и вертолёты, поэтому на них не появляется действие «Хранилище»."
  "Корзина направляется в одно из двух мест назначения. Этот контейнер помещает товары в собственный инвентарь контейнера, откуда их можно забрать руками. Любое другое хранилище в радиусе двадцати пяти метров принимает их сразу в свой список, без промежуточного создания. Складское здание не имеет собственного инвентаря, поэтому предлагает только второй вариант."
  "Перенос всего в хранилище преобразует всё, что находится в контейнере, в список за один раз, включая кузов грузовика. Принадлежности и полные магазины попадают как отдельные предметы, а частично использованный магазин остаётся на месте. У ящика с боеприпасами также есть действие «Очистить инвентарь» только для офицеров, чтобы выбросить то, что осталось после переноса, и «Переименовать хранилище» для присвоения имени, которое отображается в выборе назначения для других контейнеров."
  "У ящика с боеприпасами есть ещё два действия, работающих с ближайшим транспортным средством. «Выгрузить транспорт в хранилище» преобразует всё, что находится в транспорте, а затем перемещает весь его список в ящик, поэтому грузовик, привезённый с поля боя, опустошается за одно действие. «Загрузить хранилище в транспорт» перемещает только список ящика и не трогает собственный инвентарь ящика, поэтому оружие, помещённое в ящик, остаётся там."
  "Складское здание показывает то же действие «Хранилище», что и всё остальное, и припаркованный у него транспорт может получить доступ к нему из меню транспорта: «Взять со склада» открывает тот же экран, а «Положить на склад» преобразует содержимое транспорта и перемещает весь его список в здание. Склад, который никто не купил, не открывается никому, частный — только владельцу, арендованный — только арендатору. Склад также хранит строительные ресурсы, через отдельное действие и список, что описано на странице «Ресурсы»."
  "Хранилище"
  "A Kit Is Not Optional"
  "Structures That Repair Fully"
  "Where the Zone Ends"
  "Damaged vehicles can be repaired in the field, and a repair costs no money and no supplies at all. What it does cost is a repair kit. Nobody repairs anything bare-handed: with no kit in your hands there is no repair action offered, not even standing beside a structure built for the job. Kits are stocked by general stores and gun dealers at around $150, and the car a new campaign starts you with carries one in its trunk."
  "A kit used out in the open brings a damaged part back to half health at most. That is enough to get a wreck rolling again, not enough to make it good as new. Damage is tracked part by part rather than as one figure, so each damaged part is repaired on its own."
  "Three structures the resistance can build repair a part the whole way instead of halfway, for anyone inside their range with a kit in hand. The Vehicle Maintenance Ramp and the Garage reach roughly 12 metres, the Helipad roughly 20. Nothing about a structure narrows what it will fix, so a car parked on the helipad is repaired just as fully as a helicopter."
  "Nothing on screen marks the edge of a repair zone, so distance is the only guide and parking close to the structure keeps you well inside it. Further out, repairs still work off the kit alone and go back to the half-health limit; closer in, they are full again. A structure that has been reduced to a ruin repairs nothing until it is repaired itself."
  "Vehicle Repair"
  "Что привлекает внимание"
  "Быть замеченным"
  "Ношение их формы"
  "Снижение активности"
  "Совершение действий, которые не одобряет оккупационная фракция, повышает ваш уровень розыска, и они начинают искать вас, пока он выше нуля. Некоторые из этих действий должны быть замечены, чтобы считаться, а некоторые — нет. Уровень снижается шаг за шагом, как только вас никто не видит, а время, необходимое для каждого шага, определяется настройками сложности."
  "Большинство из них должно быть замечено. Нахождение на виду с открыто носимым оружием, мародёрство, установка запрещённых ими объектов или нахождение рядом с их базами или радиовышками — всё это повышает уровень розыска, а одежда, выдающая вас за члена сопротивления или его сторонника, срабатывает при первом же зрительном контакте. Насилие не требует свидетелей: ранение любого человека делает вас разыскиваемым, убийство повышает уровень розыска ещё больше, и то и другое срывает маскировку. Когда убивают одного из их солдат, ответственность несёт и тот, кто сидит в транспортном средстве прямо рядом с телом. Нахождение за рулём вооружённого транспорта или мобильного ПОБ на виду у врага дополнительно повышает уровень розыска, и это транспортное средство с этого момента помечается как техника сопротивления. Выше первого уровня оккупационная фракция перестаёт считать вас гражданским и атакует как врага при первом же зрительном контакте."
  "На экране появляется значок глаза, пока кто-то из оккупационной фракции видит вас, и его яркость меняется в зависимости от того, насколько чётко вас различают. Их люди начинают замечать вас только в пределах определённой дистанции, а навык «Скрытность» сокращает этот радиус обнаружения. Рекруты подчиняются тем же правилам и обнаруживаются с использованием уровня Скрытности своего командира."
  "Если вы одеты в достаточно убедительную форму оккупационной фракции, их войска принимают вас за своего и перестают следить за вами на расстоянии. Остаётся лишь ближний радиус: достаточно близко и на виду кто-то разоблачит вас, маскировка будет сорвана, и вместе с этим придёт уровень розыска. Открытие огня по кому-либо также срывает маскировку — на любом расстоянии и независимо от того, было ли это замечено. Пока маскировка действует, нахождение рядом с базой или радиовышкой само по себе не делает вас разыскиваемым. На экране отображается иконка состояния маскировки, а дальность, на которой солдаты могут распознать маскировку, определяется настройками сложности."
  "Уровень розыска снижается только тогда, когда за вами никто не наблюдает — по одному уровню за раз, с обратным отсчётом между каждым шагом. Всё, что снова делает вас разыскиваемым, сразу устанавливает уровень в соответствии с тяжестью нарушения и перезапускает отсчёт, поэтому уровень розыска поднимается скачками, а снижается только постепенно. Последний шаг до нуля идёт по отдельному таймеру, и если вас заметят во время него, уровень снова поднимется, а не обнулится. Оба таймера определяются настройками сложности. Быстрое перемещение недоступно, пока ваш уровень розыска выше нуля."
  "Система розыска"
  "С чего вы начинаете"
  "Нет строгого порядка"
  "Жизнь в городах"
  "Overthrow — это долгосрочная песочница, разворачивающаяся на оккупированном острове. В ней нет списка целей и нет концовки: сопротивление растёт из того, что вы решите делать, а оккупационная фракция реагирует на это. Города, деньги, недвижимость, транспорт, рекруты и захваченные территории — всё это сохраняется, поэтому кампания продолжается между сессиями и после перезапусков сервера."
  "Новый персонаж получает дом в одном из городов острова, автомобиль, припаркованный перед ним, и небольшую стартовую сумму денег. Этот дом регистрируется как ваш дом, где вы возрождаетесь. Если свободного стартового дома нет, новый персонаж начинает в одном из городов — со стартовыми деньгами, но без дома и без машины, и возрождается там, где начал, пока здание в его собственности не будет назначено домом. Всё, что дальше, зарабатывается, покупается, строится или отбирается."
  "Ничто здесь не должно происходить раньше чего-либо другого. Торговля, найм рекрутов, размещение лагерей, строительство и захват баз — это инструменты, которые остаются доступными в любом порядке, который вам удобен, а на сервере каждый игрок действует на том же острове и в том же состоянии кампании."
  "Города населены. Люди выходят, когда вы приближаетесь, и исчезают, когда вы отходите, и толпа формируется заново при следующем визите, так что она никогда не бывает одинаковой. Количество людей зависит от населения города, и типы людей различаются в разных местах, поэтому портовый город и внутренняя деревня населены по-разному. Некоторые ходят по маршруту, некоторые бродят, некоторые стоят на месте несколько минут. Их можно нанимать как рекрутов, привлекать как сторонников или продавать им, как и раньше, а нанятый гражданский покидает толпу навсегда и остаётся с вами."
  "Гражданские машины стоят вдоль бордюров и обочин, по одной-две в деревне и больше в городе. Машина, к которой никто не прикасался, является частью пейзажа, и при следующем визите вы найдёте другой набор. Машина, в которую кто-то сел, перестаёт быть пейзажем: она остаётся там, где её оставили, и сохраняется вместе с кампанией между сессиями."
  "Добро пожаловать в Overthrow"
  "Что даёт дом"
  "Покупка и аренда"
  "Каждая кампания начинается с собственного дома и автомобиля, припаркованного перед ним. Право собственности привязано к вашему игроку, а не к сессии, поэтому здание, которым вы владеете, остаётся вашим между сессиями и после перезапусков сервера."
  "Здание, назначенное вашим домом, является местом возрождения вашего персонажа после смерти. Здания, которыми вы владеете или которые арендуете, также считаются точками быстрого перемещения, если только здание не сдано в аренду кому-то ещё. Повторное подключение после выхода из игры возвращает вас туда, где вы вышли, а не домой."
  "Меню недвижимости появляется в главном меню, когда вы находитесь внутри здания, которое можно приобрести, и показывает цену продажи и арендную плату этого здания. Ни то, ни другое не является фиксированной величиной: обе цифры растут с населением и стабильностью ближайшего города, поэтому один и тот же дом стоит дороже в большом, стабильном городе, чем в маленьком и нестабильном. Офицеры могут покупать и арендовать, используя средства сопротивления вместо своих собственных денег."
  "Арендная плата взимается раз в день в полночь: арендатор платит, а владелец получает оплату. Вы можете владеть более чем одним зданием и назначить любое из них своим домом. Здание нельзя продать, пока оно является вашим домом, а ваше последнее оставшееся здание вообще нельзя продать."
