  "Закрити"
  "Магазини продають вам легальні товари та викуповують назад ті, якими торгують. Їхні запаси обмежені й поповнюються щоранку. Ціни відрізняються від міста до міста, що дає можливість займатися торгівлею. Товари можна дешево імпортувати з портів, а магазини далі вглиб країни платитимуть за них більше, ніж магазини поблизу портів."
  "Купівля та продаж"
