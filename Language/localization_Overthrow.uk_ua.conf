  "Показати на мапі"
  "Ці завдання призначені як навчальний посібник для ігрового режиму. Вони не дають великого доходу і лише показують, що можливо зробити. Overthrow - це відкритий світовий ігровий режим, де ВИ вирішуєте, як просувати справу революції. Ви заробите набагато більше, збираючи підтримку та захоплюючи міста. Тож вирушайте туди, збирайте підтримку, захоплюйте бази та підкорюйте острів!"
