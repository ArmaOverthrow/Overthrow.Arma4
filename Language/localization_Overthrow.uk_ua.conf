  "Острів перебуває під контролем сил США. Вони утримують гарнізони на базах і радіовежах та патрулюють населені пункти, а їхню уніформу можна використовувати для маскування."
  "Сполучені Штати — це дружня до опору іноземна держава, а не ваша власна фракція. Поява у їхній формі одразу викликає рівень розшуку, і вони також не можуть бути окупантами."
  "Острів перебуває під контролем радянських військ. Вони розміщують гарнізони на базах і радіовежах та патрулюють міста, а їхньою уніформою можна скористатися як маскуванням."
  "Радянський Союз - це дружня до опору іноземна держава, а не ваша власна фракція. Поява у їхній формі одразу викликає розшук, і вони також не можуть бути окупантами."
  "Функція ще не реалізована"
