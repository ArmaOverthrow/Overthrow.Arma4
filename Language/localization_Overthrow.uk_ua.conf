  "Утримання позицій"
  "Захоплена вами база"
  "Удар у відповідь"
  "Військові бази перебувають під контролем окупантів і змінюють власника тільки після бою. Перехід бази під контроль опору послаблює ворога в цьому секторі, змушуючи його витрачати резерви на подальші контратаки для її відвоювання."
  "Атака розпочинається безпосередньо з території окупованої бази, і всі гравці на сервері отримують сповіщення про її початок. Окупанти реагують на це, направляючи підкріплення з найближчих баз, яке прибуває в зону бою протягом наступних кількох хвилин. Одночасно на всій карті може тривати лише один бій, тому поки він не завершиться, розпочати новий неможливо."
  "Після прибуття підкріплення починається постійний підрахунок сил на самій території: вирішальним є співвідношення кількості гравців у центрі бази та окупантів поруч із ними. Присутність гравців за повної відсутності ворогів швидко схиляє шальки терезів на вашу користь; перевага солдатів ворога діє навпаки; за рівних сил прогрес повільно повертається до нуля. Підрахунок триває до досягнення ліміту, визначеного налаштуваннями складності, в той чи інший бік, і той, хто першим досягає мети, захоплює базу. Усі гравці, які перебувають у зоні бою, отримують досвід під час битви."
  "Коли база змінює контролюючу сторону, на ній піднімається новий прапор, а всі гравці на сервері отримують сповіщення. На захоплену опором базу можна швидко переміщатися, обирати її точкою респавну, зводити на ній споруди та розміщувати гарнізон із найближчого населеного пункту. Деякі об'єкти інфраструктури функціонують лише для тих, хто контролює цю землю. Взяття бази підвищує рівень тиску на окупантів, тоді як її втрата послаблює цей тиск."
  "Жоден захоплений об'єкт не забігається за вами назавжди. Ворог накопичує резерви й розподіляє їх між утримуваними базами. Коли ресурсів стає достатньо, окупанти обирають одну з втрачених баз і починають контратаку, а після штурму беруть паузу перед наступним нападом. Захоплення міст і радіовеж відбувається за аналогічною механікою, тож контроль над локаціями може переходити з рук у руки неодноразово протягом кампанії."
  "Захоплення баз"
  "Де дозволено будівництво"
  "Табори"
  "Публічні та приватні"
  "Заборонені для розміщення об'єкти"
  "Будівництво дозволяє розміщувати у світі об'єкти опору за грошові кошти — від дрібного спорядження до цілого польового табору. Чимало предметів доступні для встановлення лише в певних зонах, а деякі з них є нелегальними, тож якщо ворог помітить процес розміщення, він одразу зреагує."
  "Опція «Будівництво» в головному меню Overthrow відображає силует об’єкта перед гравцем і блокує розміщення, якщо точка не підходить. Більшість предметів дозволено ставити біля вашого будинку чи табору, в радіусі ПБП або на території захопленої базі. Плакати та піратські радіостанції мають протилежні вимоги: їх слід встановлювати безпосередньо в містах, де для них діє обмеження за кількістю. Окрім цього, загальна кількість збудованих об’єктів на одну локацію лімітується налаштуваннями сервера."
  "Табір розміщується як і будь-який інший об'єкт, але після встановлення він реєструється як позиція опору та повинен розташовуватися щонайменше за сто метрів від іншого табору. Табір слугує точкою для швидкого переміщення, місцем для відродження, зоною, де дозволено розміщувати інші об'єкти, а також одним із місць, де працює меню будівництва. Ви можете утримувати лише один табір одночасно: розміщення нового автоматично згортає попередній."
  "Табір має власне меню, яке використовується безпосередньо в ньому: воно дає змогу перемикати статус між публічним і приватним, а також згортати його. Публічний табір відображається на карті кожного гравця, і будь-хто може швидко переміститися до нього. Приватний табір видно на карті лише його власнику, і тільки цей гравець має змогу туди телепортуватися."
  "Встановлювати плакати, піратські радіостанції, мішки з піском та протитранспортні їжаки — незаконно. Якщо окупанти помітять вас за цим заняттям, ви миттєво отримаєте рівень розшуку (як і під час лутання трупів на видноті). Зроблене потайки залишиться непоміченим. Плакати й радіостанції підвищують лояльність населення до опору в місті, де вони встановлені, поки діє ефект. При цьому місто має ліміт: лише кілька плакатів та одна радіостанція одночасно."
  "Табори та будівництво"
  "Початок гри"
  "Гроші та торгівля"
  "Overthrow"
  "Переховування"
  "Опір"
  "The Build-Up"
  "What Sabotage Costs"
  "A Base of Their Own"
  "The Encirclement"
  "The occupying faction works toward one place at a time. It picks a single base, town or city the resistance holds and spends the following hours building up against it, and the choice is not a lottery: bigger towns, ground close to the bases it still holds, places its radio towers still reach, and towns whose support has already slipped are what draw it. Villages, radio towers and resistance FOBs are never the target themselves. The target can change while the build-up is still in its early stage; once the occupiers have committed to it they see it through unless the build-up is broken."
  "The first sign is traffic. Groups are driven out from a base the occupiers still hold, dropped at a road short of the target and left to walk the rest of the way, and the truck turns round and goes home. In a town they make for the centre, and a group that holds it with nobody there to contest it drives the town's support for the resistance down a step; the next one drives it down again. A radio tower the resistance holds nearby draws a team of its own, which has to reach the tower and stand on it for a long stretch before it flips back. At a base they infiltrate and start pulling down what was built there. Standing in any of those places pauses the clock the group is working against, and killing the group ends the attempt outright."
  "What saboteurs pull down at a base stays where it stood. The structure is wrecked rather than taken away, with an explosion and smoke to mark it, and the ruin can be put back for a share of what it cost to build; a campaign saved and loaded again brings it back as a ruin. Gear stored inside survives the demolition, though nothing about the place works until it is repaired. They take the cheapest thing standing first and work upward, so bunkers and tents go before the garage does, and only what belongs to that base is ever at risk. A single player inside the base stops the demolitions where they are, and one message goes out per mission, on the first thing destroyed."
  "Once the build-up has told, the occupiers put a forward base of their own on the ground between their nearest holding and the target. A supply truck drives out to raise it, so it can be ambushed on the road, and nothing announces the base once it is standing: it is found, not reported. From then on it is where their groups come from, and it is also the shortest way to stop the whole thing. Take or empty the base supplying it, or stay close to the forward base itself, and after a while it is pulled down and the occupiers start looking elsewhere. With the site clear of their soldiers, a held action on its flag takes it down on the spot, and that costs them more than starving it does."
  "The counter attack itself arrives without a word. Nothing is announced, no battle panel appears and no circle is drawn on the map; the whole force is put down at once at the usual landing distances and walks in to form a ring roughly a hundred to a hundred and fifty metres out from the centre. The one thing that gives it away early is that no battle of your own can be started while it is forming, so a capture or an uprising that was available a minute ago is quietly not on offer. Counter attacks only ever begin in daylight, between roughly 05:00 and 15:00, and the waves come in from the side the occupying faction actually holds, including from its forward base."
  "The word comes when the last of them is in place, and with it fifteen real minutes in which nothing at all is scored. That time belongs to the resistance: it is long enough to drive in, gather recruits, dig in on the ground that matters, or decide the place is not worth the fight and leave. The battle panel names the place being fought over and counts down to the moment scoring begins. If every attacker on the ring is killed before it runs out the battle ends there and then in the resistance's favour, with no assault at all. Otherwise the clock reaches zero, the ring closes in and the ground is counted exactly as it is in any other battle. Whatever the outcome, their forward base comes down afterwards and the occupiers begin choosing again."
  "Counter Attacks"
  "Відкрийте мапу та виберіть місце, до якого можна переміститися: будинок, яким ви володієте або який орендуєте, власний табір чи будь-який громадський табір, FOB або базу, контрольовану опором. На інформаційній панелі цього місця є кнопка переміщення із зазначеною вартістю. Вартість швидкого переміщення дорівнює відстані в кілометрах, помноженій на ціну швидкого переміщення з налаштувань складності, при цьому мінімальна оплата стягується як за один кілометр. Рекрути в радіусі 50 метрів за замовчуванням переміщуються разом із вами, і за кожного з них стягується повна вартість проїзду; на панелі є перемикач, щоб залишити їх позаду. Ви не можете скористатися швидким переміщенням, якщо перебуваєте в розшуку, якщо пункт призначення ближчий за мінімальну відстань переміщення або якщо ви є пасажиром у транспортному засобі — транспорт переміщується лише разом із водієм. Крім того, активна QRF може блокувати швидке переміщення залежно від налаштувань складності. Для поїздки автобусом скористайтеся «Сісти на автобус» на автобусній зупинці та виберіть іншу автобусну зупинку на мапі: для автобусного тарифу немає мінімальної відстані, і ви повинні бути пішки."
  "Розгортання FOB"
  "Що дає FOB"
  "Будівництво"
  "Рух уперед"
  "FOB — це передова оперативна база, яку опір може розгорнути в польових умовах. Її потрібно розміщувати подалі від баз і радіовеж. Будівництво дозволяє зводити споруди на базі, яку контролює опір, на FOB або в таборі, а доступні споруди залежать від того, де саме ви перебуваєте."
  "FOB починається як мобільна вантажівка FOB, яку купують так само, як і будь-який інший транспортний засіб, а дія на вантажівці розгортає FOB на місці, де вона стоїть. Її не можна розгорнути поблизу будь-якої бази, незалежно від того, хто її контролює — окупаційна фракція чи опір, а також у межах сімдесяти метрів від радіовежі. Мапа затінює ці зони, щоб їх можна було побачити заздалегідь. Розгортати FOB можуть лише офіцери, якщо на сервері не встановлено інше."
  "Будь-який гравець може швидко переміщуватися до FOB, FOB можна встановити як місце відродження, а також використовувати як територію для розміщення об’єктів і будівництва. На FOB можна розмістити гарнізон солдатів, оплачений і сформований із прихильників найближчого міста; табори отримують гарнізон так само. Офіцер може позначити один FOB як пріоритетний, що надає йому окремий значок на мапі та залишає його видимим незалежно від масштабу мапи."
  "«Будівництво» в головному меню Overthrow відкриває список споруд і камеру для вибору місця їх розташування неподалік від вас. Споруда коштує лише грошей: не потрібно заздалегідь збирати окремі запаси матеріалів. Кожна споруда має власні вимоги до місця розміщення, а для більшості з них потрібна база, контрольована опором, або FOB, тому в таборі це меню пропонує менше варіантів, ніж на захопленій базі."
  "FOB не закріплена на одному місці. Якщо згорнути її, вона знову перетвориться на вантажівку, а контейнери навколо неї разом із їхнім вмістом буде завантажено в транспортний засіб, тож FOB можна перемістити, а не залишати. Окупаційна фракція, зі свого боку, дізнається про розташування таборів і FOB опору та відправляє туди солдатів на розвідку, коли має вільні сили."
  "FOB та будівництво"
  "When the Money Runs Out"
  "Fuel That Costs Nothing"
  "The Fuel Depot"
  "Fuel is something the resistance buys. Refuelling at a fuel pump or a static fuel tank costs money for every litre actually delivered, taken while the fuel flows. The Refuel action shows the rate next to the tank reading, for example ($1/L). That rate is a difficulty setting: half a dollar a litre at the easiest end, four dollars at the hardest, and a server can set it to zero so fuel costs nothing anywhere. Vehicles and the Fuel Depot also carry a Fill Tank action: one five-second hold that fills the tank you are standing at in a single go, shows the exact price before you start, and sells you as much fuel as your money buys when you cannot afford a full load."
  "If you cannot cover the next moment of flow, the Refuel action is greyed out and reads that you cannot afford fuel here. If the money runs out while fuel is already moving, the flow stops, every litre already delivered stays in the tank, and you are told once. A few dollars can be left unspendable that way, because refuelling only starts when you can pay for a whole moment of flow."
  "Moving fuel from a fuel truck into a vehicle costs nothing, and neither does pouring a jerrycan. What costs is filling them: a jerrycan or a truck's own cargo tank topped up at a pump is charged at the usual rate. Fuel carried in a truck has already been paid for."
  "The resistance can build a Fuel Depot at a base it holds. It stores 10,000 litres - two full truck loads - and arrives empty, so it has no fuel to give until it is filled: park a fuel truck alongside and drain it into the depot from the depot's own actions. After that it refuels vehicles parked beside it for nothing, and whatever is left in it is kept in the campaign save."
  "Fuel"
  "Пошук дилера"
  "Що у них є в наявності"
  "Продаж дилеру"
  "Торговець зброєю — це торговець, який продає озброєння та військове спорядження замість побутових товарів. У торговців зброєю власний перелік товарів, їхній асортимент оновлюється окремо від звичайних крамниць, а розцінки безпосередньо залежать від налаштувань складності кампанії."
  "Кожне місто, більше за село, має одного торгівця зброєю, а в селах їх немає взагалі. Торговець — це персонаж, який стоїть у певній точці міста, а не за стійкою всередині магазину, і як тільки місто визначається з цим місцем, воно залишається незмінним до кінця кампанії. Зброярі та звичайні крамниці позначені на карті власними іконками."
  "Торговець зброєю має власний каталог, який відрізняється від асортименту звичайних крамниць. Базовий товар — це пістолети, патрони, обвіси, вибухівка та гранати. Додатково при створенні міста скупник процедурно отримує по одній випадковій позиції зі штурмових гвинтівок, снайперських гвинтівок, кулеметів та гранатометів. Цей набір зброї закріплюється за ним назавжди: коли товар закінчується, запас поповнюється тим самим зразком, тому асортимент важкого озброєння в кожному місті унікальний. Трофейне спорядження окупантів у скупників майже не продається."
  "На відміну від звичайних крамниць, які скуповують лише свій профільний товар, торговець зброєю бере практично будь-які речі, що мають ціну. Сума виплати становить відсоток від базової вартості предмета й залежить від налаштувань складності гри (якщо коефіцієнт рівний нулю, скупка буде повністю вимкнена). Угоди на великі суми привертають увагу: вони розхитують стабільність у місті, але водночас збільшують лояльність містян до сил опору."
  "Торговці зброєю"
  "Barracks"
  "Buying a Group"
  "Orders and Stances"
  "Manage Groups"
  "Ammunition and Fuel"
  "Turning Recruits Over"
  "Holding Ground"
  "High Command is how the resistance fields soldiers of its own rather than an escort. A player buys a whole group at a barracks, owns it outright, and moves it anywhere on the island from the map. The group is really there: it walks or drives to where it is sent, fights what it meets on the way, and holds its ground whether or not anybody is nearby to watch."
  "Groups are bought at a barracks standing on a base the resistance holds. Some bases already have military barracks on them, and a barracks can also be built at a base like any other structure, at the highest price on the build list: $20000 along with timber, cement, steel and hardware. The action sits on the radio set inside the barracks, the same kind of radio a recruitment tent carries, and any player at that base can use it. A barracks reduced to a ruin offers nothing until it is repaired."
  "The screen lists eleven groups, from small teams up to a rifle squad, three of which arrive with a vehicle. Picking one asks the server for a price and shows what it is made of: the recruit cost of every man in it, the gear each of them needs, and, where there is a vehicle, that vehicle at the full price a shop would charge. Gear already stocked in a registered warehouse within 150 metres is taken off the shelves rather than bought, and the quote shows how much that covered. A purchase also draws supporters out of the nearest town, so a town with no support left cannot raise a group. Each player has a cap on how many High Command soldiers they can hold at once, and a purchase that would pass it is refused before any money moves."
  "Every player's map draws every High Command group as a green symbol, your own at full strength and other players' dimmed, and the map's layer panel can switch them off again. Selecting one shows who owns it, its stance, how far it is from its destination, how far it is from you, and how many of its men are still alive. A group you own can be ordered to the spot under the map cursor, and its stance cycled between Defend, which holds the ground it was sent to, Patrol, which walks a ring around it, and Attack, which sweeps it for the enemy. A group on the move draws a dashed line to where it is going. A mark appears on the symbol while it is in contact with the enemy, and an ammunition badge when it has run dry. Ordering a group another player owns is refused."
  "Manage Groups, on the Overthrow main menu, lists the groups you own with their status and how many of your soldier slots are in use. From there a group can be shown on the map, or dismissed after a confirmation, which takes it, its vehicle and its orders out of the world for good."
  "A group left near a registered warehouse tops its magazines back up out of the stock held there, by itself, every so often. A group with a vehicle parked near a fuel source fills its tank the same way, and the fuel is charged to the group's owner at the same price a player filling up by hand would pay; a fuel depot the resistance built is free."
  "Recruits that are holding position can be handed to High Command instead of being managed one by one. The Manage Recruits screen shows the ones holding position grouped by where they are standing, and each of those groups carries a Convert to High Command action. The change is one way. Those recruits leave your recruit roster and give their slots back, and their names, experience and skill tracking end with their records, but the same bodies carry on in the new group with the gear they were already wearing."
  "Bases, camps and FOBs no longer take a bought garrison, and the menus that sold one are gone. Ground is held by parking a High Command group on it in Defend stance, which unlike a garrison can be picked up and sent somewhere else at any time. A campaign saved before the change loads without its old garrisons."
  "High Command"
  "Відкрийте головне меню за допомогою <color rgba='226,168,79,255'><action name=\"OverthrowMainMenu\"/></color> щоб отримати доступ до більшості функцій Overthrow."
  "Меню відкривається для міста, у якому ви перебуваєте: воно відображає населення, стабільність, кількість прихильників та журнал останніх сповіщень. Звідси можна перейти до інформації на карті й швидкого переміщення, розміщення й будівництва, меню опору, завдань, меню нерухомості для будівлі, у якій ви стоїте, керування рекрутами, характеристики персонажа, останньої показаної підказки та запиту на збереження кампанії. Деякі пункти працюють лише за певних умов: нерухомість залишається неактивною, якщо будівлю не можна придбати, підказки — доки не з'явиться перша підказка, а збереження доступне лише офіцерам. Перебування біля певних місць, наприклад прилавка магазину, натомість відкриває особисте меню цього місця."
  "Головне меню"
  "Поїздка автобусом"
  "Мапа — це огляд кампанії. Окрім місцевості, на ній позначено будівлі та транспортні засоби, якими ви володієте, табори й FOB, розміщені опором, а також відомі магазини, торговців зброєю та порти. Щоб користуватися інформацією на мапі та можливостями швидкого переміщення, потрібно мати мапу в інвентарі."
  "Панель вказує найближче місто до обраної точки та відображає його населення, відстань до нього, рівень стабільності й кількість прихильників, а також поточні модифікатори, що підвищують або знижують стабільність і підтримку у цьому місті."
  "Швидке переміщення працює за певних умов. Точка призначення має розташовуватися поруч із об'єктом під контролем опору: будинком у вашій власності чи оренді, вашим власним або спільним табором, ПБП чи базою під контролем опору. Окрім цього, ціль має бути достатньо віддаленою від вашої поточної позиції. Телепорт недоступний під час розшуку, а активні сили швидкого реагування (QRF) можуть блокувати його залежно від налаштувань складності."
  "Плата за переміщення залежить від налаштувань складності, а не є фіксованою сумою. Рекрути, які стоять поруч із вами, переміщуються разом із вами, коли ви йдете пішки, і кожен із них додає до вартості таку ж суму. Швидке переміщення зсередини транспорту працює лише в тому разі, якщо ви перебуваєте за кермом."
  "Автобусні зупинки пропонують альтернативний спосіб переміщення картою. Взаємодія із зупинкою відкриває карту, де ви обираєте ціль поруч із будь-якою іншою зупинкою, а вартість поїздки вираховується за кілометраж згідно з налаштуваннями складності. Подорож автобусом ігнорує рівень розшуку та статус контролю території, але ви маєте бути пішки, а за кожного рекрута поблизу доведеться доплатити."
  "Мапа та швидке переміщення"
  "Вплив"
  "Вибір місця на мапі — наведенням курсора на його маркер або натисканням на нього, щоб закріпити інформаційну панель, — показує пунктирні лінії до інших місць, з якими воно пов’язане впливом. Якщо вибрати місто, до нього простягнуться лінії від радіовеж і військових баз, зона впливу яких його охоплює, а також лінії революційного імпульсу між ним і будь-яким достатньо близьким містом. Такий імпульс поширюється від міста, контрольованого опором, до сусіднього окупованого міста. Якщо вибрати радіовежу або військову базу, лінії простягнуться до кожного міста в межах її впливу, а пунктирне кільце покаже межі цієї зони; кільце відображається лише контуром, без заливки, щоб мапа всередині залишалася читабельною. Вибір будь-чого іншого — будинку, магазину, передової бази, транспортного засобу чи автобусної зупинки — не показує жодних ліній, оскільки ці об’єкти не створюють і не отримують вплив. Кожна лінія має колір фракції, що чинить вплив: власника радіовежі чи бази або міста, від якого поширюється імпульс. Це той самий колір, яким позначено маркер відповідного місця."
  "Яскрава лінія з довгими штрихами означає зв’язок, який кампанія зараз враховує, а місто, до якого вона веде, показує його на своїй інформаційній панелі як «Радіовежа поблизу», «База поблизу» або «Революційний імпульс». Тьмяна лінія з коротшими й рідшими штрихами означає, що зв’язок існує, але кампанія зараз його не враховує. Наразі це може бути спричинено двома причинами, і жодна з них не є вичерпною. Перша — ворожий джерело переважає дружнє того самого типу: одна окупаційна радіовежа або база в зоні досяжності переважає будь-яку кількість дружніх, тому місто може перебувати в зоні впливу дружньої радіовежі й водночас мати негативний запис. Друга — саботована радіовежа, яка не веде мовлення ні для кого, поки не працює. Цей шар лише об’єднує в одне зображення зв’язки, які вже показані на панелях місць, не відкриваючи нічого нового, і ніяк не впливає на кампанію. У панелі фільтрів мапи для нього є окремий рядок «Вплив», а його стан зберігається у вашому профілі так само, як і стан інших шарів."
  "Щоб відкрити мапу за допомогою <color rgba='226,168,79,255'><action name=\"GadgetMap\"/></color>, у вашому інвентарі має бути мапа. Overthrow позначає на ній міста, бази, FOB, табори, будинки, магазини, торговців зброєю, склади, порти, радіовежі, автобусні зупинки, ваші транспортні засоби та маршрутні точки. Наведіть курсор мапи на маркер, щоб відобразити інформаційну панель про це місце, а потім натисніть на маркер, щоб закріпити панель. Натискання на порожню ділянку мапи знову відкріпить її."
  "Фільтрування мапи"
  "Пункт фільтра на панелі значків ліворуч від мапи відкриває панель із перемикачами. Кожна категорія маркерів має власний перемикач — від міст і баз до будинків, автобусних зупинок і ваших транспортних засобів, — як і кожен шар, що відображається під ними: затінення території та кільця заборонених зон. Маркери гравців також мають окремий перемикач, якщо їх відображення дозволене налаштуваннями складності. Вимкнення перемикача одразу приховує відповідну категорію, не закриваючи мапу, а повторне ввімкнення повертає її. За замовчуванням усе ввімкнено, і навіть увімкнена категорія зберігає власний поріг масштабу, тому дрібніші маркери з’являються лише при наближенні. Панеллю можна користуватися як мишею, так і контролером."
  "Приховані параметри зберігаються у вашому ігровому профілі, а не в збереженні конкретної кампанії, тому ваші налаштування залишаться незмінними під час наступного відкриття карти, у наступних ігрових сесіях та на будь-яких інших серверах чи в нових кампаніях. Це ніяк не впливає на сам перебіг гри: фільтр змінює лише те, що відображається на вашому екрані, тоді як інші гравці бачать карту згідно зі своїми власними налаштуваннями."
  "Територія"
  "Мапа затінює територію, яку все ще контролює окупаційна фракція, її власним кольором. Території, захоплені опором, залишаються незатіненими, тож у міру проходження кампанії затінення відступає, а на повністю звільненому острові воно зникає зовсім. Регіони визначаються за містами, військовими базами, радіовежами та FOB опору, і що більший об’єкт, то далі простягається його територія: база має більший вплив, ніж місто, а столиця — більший, ніж село. Територія обмежується узбережжям, але річки та внутрішні озера її не розділяють."
  "Там, де окупована територія межує з територією, яку контролює опір, уздовж межі відображається смуга; узбережжя такої смуги не має. Регіон із діагональним штрихуванням є спірним: окупанти все ще його контролюють, але половина або більше населення міста підтримує опір — використовується той самий показник підтримки, що відображається на інформаційній панелі міста. Так позначатися можуть лише міста, оскільки бази, радіовежі та FOB не мають населення, рівень підтримки якого можна виміряти. Затінення кожні кілька секунд оновлює дані про те, хто яку територію контролює, тому зміна контролю відображається без закриття мапи."
  "Losses Stay Lost"
  "Patrols Keep Moving"
  "Radio Towers"
  "Defending a Base"
  "Armour and Checkpoints"
  "The occupying faction keeps standing forces in the field: defences at the military bases it holds, foot patrols working the towns it still controls, vehicle patrols on the roads, and a garrison at each radio tower it holds. Base defences, vehicle patrols and tower garrisons are all bought out of one and the same pool of resources, so a faction that is short of them fields fewer of every kind; foot patrols in a town cost it nothing."
  "Armed vehicles are also driven to battles. When a base or a town is being fought over, the faction can send as many as two of them by road from a holding of its own; they take the time the drive takes, arriving behind the men who came in on foot, and the road they come down is a road somebody could be waiting on. Stopping one does not end the force it carried: the men get out and carry on walking. A vehicle lost in the open marks that ground as somewhere worth looking at, and another may be sent to work the area over for a while before it leaves again. An anti-tank launcher starts paying for the weight it costs around the middle of a campaign."
  "Soldiers killed out of a patrol, a base defence or a tower garrison are gone for good. When that group stops being watched and later comes back into view it returns with only the men who lived through the last fight, and a campaign saved and loaded again brings back the same survivors rather than a fresh full-strength unit. A base is left in the state you left it in, then. A force wiped out to the last man can be replaced later, at a cost to the faction that fielded it."
  "A town patrol walks its round whether or not anybody is there to see it. With nobody nearby it keeps covering the same circuit, so it will not be waiting on the corner it was last seen standing on; it turns up wherever along that route it had got to. A patrol working a base perimeter behaves the same way. A garrison posted at a radio tower is a different matter and holds the ground it was put on, and so do the men in a base's fighting positions, on its towers and at its checkpoints."
  "A radio tower the occupying faction holds changes hands when the men garrisoning it are all dead, and only then. Standing next to a tower does nothing on its own, and walking away and coming back neither resets the fight nor finishes it: the garrison is still short by everyone who fell, and the tower stays occupied until the last of them does. It can go back the other way as well: a tower the resistance holds close to whatever the occupiers are working toward draws a team of their own, and the tower is theirs again only if that team is still standing on it when its hold time is up. Being there yourself pauses their clock."
  "A tower may also be found with nobody on it. The garrison is paid for out of the faction's reserves, so a faction that is stretched leaves towers bare, and one that recovers can post a garrison at a tower you walked past unguarded days earlier. While a battle is actually being fought anywhere on the island, and while nobody at all is connected, no new force of any kind is put out; the ones already in the field carry on as they were."
  "A military base is held by whatever its owners have managed to put there. A patrol works the perimeter, men hold prepared fighting positions, guards stand on the towers, marksmen take marked ground, checkpoints go up on the roads in, sandbagged positions and ammunition caches are built inside the wire, and trucks are parked in the yard. Each of those is bought and paid for on its own, roughly in that order, so a base thickens up over a campaign rather than arriving finished. Heavier infantry and an anti-tank section are only added once the faction is under enough pressure to want them."
  "Nothing new is put into a base while somebody is standing in it, so a base does not fortify in front of you. One that has just changed hands, or one whose owners are short of resources, can be found lightly held and thicker again weeks later. Losses there last the way patrol losses do, though a post does not stay empty for good: the men who lived are back on their towers and in their firing positions the next time the place is looked at, and a position wiped out to the last man can be bought again later. Clearing a post is settled only when the base itself changes hands."
  "The armed vehicles the occupying faction puts on the road get heavier as the campaign turns against it. Early on an armed jeep is the worst of it. Later a gun truck or a scout car, and late on a wheeled armoured carrier with a cannon or a heavy machine gun on it. Each rung up costs the faction several times what the one below it does, and a mounted force only fields what its own budget covers, so a stretched faction keeps sending the cheap one. Campaign difficulty moves the whole scale: on the harder settings the heavier vehicles turn up far earlier than they would otherwise."
  "An armed vehicle standing inside a base compound is not scenery. It belongs to that base, it sits there unmanned while the place is quiet, and when fighting starts at that base a crew takes it out to a firing position short of the shooting rather than driving into it. A vehicle parked on a road into a town the faction is currently working against is put there on purpose too: the men who rode in spread out around it while its gun stays manned, and it moves to a different approach every few minutes instead of holding one road all day."
  "Patrols and Garrisons"
  "A cot is one of the items on that list, at a cost of thirty, and it carries the same sleeping action a bed does, so a camp or a FOB can be given somewhere to sleep."
  "Importing"
  "Exporting"
  "Resources"
  "A port trades in bulk with the vehicle you are sitting in, and both you and the vehicle have to be within thirty metres of it. The vehicle needs storage of its own, so an illegal or armed one cannot trade there at all. The port screen has an Import side and an Export side."
  "Importing needs the first level of Trade. What you import is credited to the vehicle's storage rather than spawned into it, and you are charged only for what fitted, so a car with room for fifty more items pays for fifty. Goods no ordinary shop stocks are offered only at the fifth level of Trade, or at a port whose nearest ground the resistance controls."
  "Export sells out of that same vehicle's storage. What a port pays for an item is a fraction of what importing one costs, held under what buying one there would cost, so carrying shop stock back out to a port does not pay. Goods no ordinary shop stocks carry the same condition they do on the way in, and anything the economy does not price cannot be exported at all."
  "Both sides of the port screen carry a Resources tab as well, trading bulk construction materials into and out of the cargo store of the truck you are sitting in. Those are priced separately from everything else here, and their price moves over the campaign instead of holding still. The Resources page covers them in full."
  "Ports"
  "Buying What a Site Has Made"
  "Owning a Site"
  "Public and Private"
  "On the Map"
  "A sawmill, a steel mill or a cement plant can be a production site, marked by a large sign standing at it. Each one makes a single construction resource and nothing else, dripping a set number of units into a cargo store of its own once every in-game hour, whether anybody owns it or not. That store is the throttle: twenty cubic metres on the shipped sites, and a site whose store is full pauses until room is made in it. A rate below one unit an hour still adds up, because the part unit is carried rather than lost, and hours slept through are produced as well."
  "While nobody owns it, a site sells what it has accumulated. Its Buy stock action carries the amount on hand and opens a one row screen quoting eighty per cent of what a port charges to import that resource at that moment, so a site undercuts the port it competes with. It sells only what it has actually produced, and the load has to go into another cargo store standing within twenty five metres of it, which the screen says plainly when there is none. A cart that will not fit, is not stocked or cannot be paid for is refused whole, so nothing is ever part bought."
  "Buying the site itself is an action on it, priced from what that site was set up to cost and scaled by the difficulty's real estate multiplier; the price on the label is the price that is charged. An officer can buy one out of resistance funds instead, which puts it in the resistance's name. Buying empties the store in the same moment it takes the money, so a site is never worth buying for the stock it was sitting on. A site is never sold back, costs nothing to keep, and is not something the occupying faction comes after."
  "A site bought by a player starts private, and a private one opens its storage to that player alone. The owner can flip it to public, an officer can do the same on a resistance owned site, and a public or resistance owned site opens to anyone in the resistance. Anyone who may not open it still sees the site's Cargo action, blocked with a reason rather than hidden. An owned site stops selling altogether: what it makes goes into building, into a trade agreed with another player, or out to a port for export."
  "Production sites draw at the same zoom as towns and bases. The icon is white while the site is unowned, green when it is yours, public or the resistance's, and half faded white when somebody else is keeping it private. Its info panel gives the status, the owner once it has one, what is in the store against how much room there is, its output per hour, and, while it is unowned, what buying it would cost."
  "Production Sites"
  "Найм рекрутів"
  "Накази та групи"
  "Досвід та спорядження"
  "Керування рекрутами"
  "Утримання позиції"
  "Обмін спорядження"
  "Пошук ваших рекрутів"
  "Споряджені рекрути"
  "Handing Recruits to High Command"
  "Цивільних можна наймати як рекрутів, і вони воюватимуть пліч-о-пліч із вами. Рекрути закріплюються за гравцем, який їх найняв, зберігаються за ним між сесіями, а один гравець може утримувати до шістнадцяти бійців одночасно."
  "Recruits that are holding position can also be handed over to High Command, which fields whole groups a player orders from the map. The Holding Position section is split by where the recruits are standing, and each of those groups carries a Convert to High Command action. It is one way: the recruits leave your roster and free their slots, and their names, experience and skills stop being tracked, while the same bodies and their gear carry on in the new group."
  "Найняти цивільного можна, затиснувши дію «Найняти» з близької відстані; це коштує стільки, скільки вказано в налаштуваннях складності. Вербувальний намет, побудований на базі чи ПБП, натомість вербує бійців з найближчого міста за вдвічі меншу ціну й забирає одного з прихильників цього міста, тому він працює лише доти, доки місто має підтримку. У будь-якому разі рекрут стає вашим, а один гравець не може утримувати більше шістнадцяти бійців одночасно."
  "Нездовзі після найму рекрути вступають у ваш загін і підпорядковуються стандартному меню наказів ШІ-союзникам. У разі приєднання до групи іншого гравця ваші бійці переходять під його тимчасове командування, але залишаються вашою власністю та автоматично повертаються у ваш загін після виходу з групи чи перезаходу в гру. Під час швидкого телепорту всі рекрути в радіусі 50 метрів переміщуються разом із вами (якщо їм не наказано утримувати позицію), збільшуючи підсумковий чек на вартість проїзду за кожного бійця."
  "Бійці отримують досвід за ліквідацію солдатів ворога й підвищують свій рівень (статистика вбивств, рівень і прогрес показуються поруч із ім'ям бійця). Початково вони одягнені в цивільний одяг, але ви можете швидко видати збережений пресет спорядження одному або всім рекрутам одразу через меню пресетів. Усе видане екіпірування зберігається за бійцем і залишається в його інвентарі після перезавантаження сесії."
  "Пункт «Керування рекрутами» в головному меню Overthrow містить список усіх найнятих вами бійців із зазначенням їхнього рідного міста та поточного статусу у світі. Звідти рекрута можна перейменувати, позначити на карті або звільнити. Бійці зберігаються між сесіями: вони залишають світ приблизно через десять хвилин після від'єднання власника й повертаються на те саме місце, коли гравець знову входить у гру. Загиблий рекрут втрачається назавжди, а його місце в списку стає вільним."
  "Ви можете наказати своєму рекруту утримувати позицію за допомогою утримання клавіші дії на самому бійцеві або через перемикач на екрані «Керування рекрутами». Боєць, який утримує позицію, залишає вашу групу та залишається на місці: він чекає там замість того, щоб блукати довкола, і відкриває вогонь у відповідь у разі нападу. Рекрути, залишені утримувати позицію в радіусі п'ятдесяти метрів один від одного, об'єднуються в єдину групу. Вони залишаються вашими та продовжують займати один із шістнадцяти слотів, не переміщуються разом із вами під час швидкого переміщення й залишаються на місці, коли ви приєднуєтеся до групи іншого гравця. Рекруту, який перебуває всередині транспорту, не можна наказати утримувати позицію. Після завантаження збереження вони повертаються туди, де їх залишили, і продовжують утримувати позицію."
  "Рекрут, який слідує за вами, має дію «Обмін спорядженням», доступну з близької відстані, яка повністю обмінює ваше екіпірування на його: одяг, броню, рюкзак та зброю разом із усім вмістом. Під час обміну переміщуються реальні предмети, а не дублюються, тому нічого не може створитися або зникнути. Якщо якась річ не поміщається на відповідне місце, вона складається в інший слот або, в гіршому випадку, залишається на землі, а після цього з'являється повідомлення про те, що обмін був лише частковим. Рекрут, який утримує позицію, не пропонує цієї дії."
  "На карті є шар «Рекрути», який відображає маркери всіх ваших бійців: яскравий колір для тих, хто слідує за вами, та тьмяний — для тих, хто утримує позицію. Поруч із маркером є значок, який показує, чи озброєний боєць і чи має він боєприпаси. Цей шар можна вимкнути в панелі шарів карти, і ваш вибір збережеться між сесіями. На екрані «Керування рекрутами» відображається той самий поділ на розділи «Активні» та «Утримують позицію» з іконкою статусу в кожному рядку та лічильником використаних слотів із шістнадцяти доступних."
  "У вербувальному наметі доступна додаткова функція — «Купити спорядженого рекрута», яка відкриває перелік ваших пресетів із цінниками. При виборі пресета ви бачите кількість предметів та підсумковий кошторис: ринкову вартість майна в найближчому магазині + націнку за сервіс (залежить від складності) + базову вартість найму в наметі. Після оплати боєць спавниться біля намету вже повністю екіпірованим. Купівля так само списує одного лояльного містянина й займає слот загону. Якщо пресет містить дефіцитні предмети, які не продаються в магазинах, замовити його неможливо (система видасть відмову з назвою пресета). Якщо ж із якихось причин рекрут заспавнився без спорядження, з вас буде списано гроші лише за найм бійця."
  "Рекрути"
  "Відкриває меню, що дозволяє переглянути інформацію або змінити налаштування спротиву. Офіцери можуть призначати інших офіцерів тут або встановлювати податкову ставку (за замовчуванням 0%), яка буде переводити частину регулярного доходу безпосередньо до Фонду Спротиву. Офіцери можуть знімати кошти з фонду спротиву або переказувати їх іншому гравцю. Будь-який гравець також може пожертвувати кошти на підтримку спротиву тут."
  "Buying and Selling at a Port"
  "Hauling"
  "Crate Piles"
  "Building With Resources"
  "Warehouses"
  "Timber, cement, steel and hardware are bulk construction materials. They are not items in an inventory: a truck, a crate pile or a warehouse holds them as a quantity, and measures what it is holding in cubic metres. The four differ in how much space and weight a unit takes, with timber the bulkiest and cheapest and hardware the most compact and dearest. Ports sell them, production sites on the island make them, trucks carry them, crate piles hold them on the ground, warehouses keep them, and some structures cannot go up without them."
  "The port screen carries a Resources tab on both the Import and the Export side. What a resource costs there is a live price that moves over the campaign rather than the fixed one a shop uses: it changes at most once in each six-hour window of game time, stays inside a band around its base price, and the details panel says whether it currently sits below, near or above that base. Occupying pressure pushes prices up and resistance control of the ports pushes them down. A port pays half the going price to take a resource back off you. Either way the trade runs through the store of the truck you are sitting in, so a resource is listed disabled with a reason when there is no truck under you or no room left in it. Difficulty scales both the price and how far it swings."
  "Trucks are the only vehicles with a cargo store, so no car, armoured carrier or helicopter shows a cargo action at all. An ordinary truck takes fifteen cubic metres, the transport variants of the M923A1 and the Ural take twenty, and the Mobile FOB truck takes eight because it is already carrying a base. Sitting in a truck puts a panel on the screen listing what is aboard and how much of the space is gone. A load that will not fit is refused whole, with the space left over named in the message, so nothing is ever part-bought or half-moved."
  "A cargo store opens a screen with a Take side and a Put side, and a list of everywhere nearby the load could go, nearest first. In Take, one of those destinations is the ground. Sending a load there drops a crate pile in front of you, and dropping a second load within a few metres of that pile adds to it rather than starting another. A pile has no capacity limit of its own, shows on the map with its contents and its volume, opens like any other store, and disappears once it has been emptied."
  "Most structures still cost money alone and appear the moment they are placed. The Helipad, the Garage, the Warehouse and the Barracks want resources as well, and placing one of those raises a construction site instead. The money is taken at that point and the site then stands until the materials reach it. Two actions sit on a site: Requirements lists what it needs against what is within reach of it, and Build finishes it, drawing on crate piles standing within thirty metres and emptying the nearest of them first. Only piles count towards a site, so a load still aboard a truck or sitting in a warehouse is not in reach. Nothing is refunded if a site is removed, and difficulty scales what a structure asks for."
  "A warehouse building holds resources beside the items it already stores, under an action of its own, and neither side of it has a limit. A warehouse is also something the resistance can build, for money and all four resources. It can go up at a base the resistance holds, and inside a town the resistance controls, which is the only place the build list reaches beyond bases, FOBs and camps; a town the occupying faction still holds refuses it, and so does a village. Once it is up it is a warehouse like any other, on the map, in who owns it and in what it will hold."
  "Resources"
  "A Ruin Does Nothing"
  "The Gear Inside Survives"
  "Putting It Back"
  "The Other Side Repairs Too"
  "A structure the occupying faction wrecks at one of your bases does not vanish. It goes up with an explosion and a column of smoke, and what is left stands where it stood, on the same ground, as a ruin. A campaign saved and loaded again brings a ruin back as a ruin, and a structure that has been put back comes back repaired."
  "A ruin is inert. There is no refuelling at a wrecked fuel depot, no recruiting from a collapsed tent, no treatment at a flattened medical tent, no shop at a ruined garage, no parking, and no reaching into the rubble for what was stored there. Pumps and repair bays stop answering from a vehicle's side as well, so nothing about the place works while it is wreckage."
  "Nothing stored in a structure is lost when it is wrecked. Containers and their contents come through the destruction untouched, and only the way in is closed. Putting the structure back opens them again with everything where it was left."
  "A ruin carries a repair action, held for twenty seconds, and the action itself shows the price. Repair costs a share of what the structure cost to build, scaled by the same difficulty that priced the build: half on Easy and Normal, three quarters on Hard, and the full build price at Extreme and Insane. The money is checked before the work counts and taken when it finishes, so a repair beyond your means is turned down rather than left half done."
  "The occupying faction does the same on ground it holds. A repair detail is sent to a base of theirs where something stands wrecked, and it puts structures back one at a time, cheapest first, without announcing anything. The work only goes on while nobody is close: a player within about a hundred and fifty metres of the base centre pauses it where it is."
  "Ruins and Repair"
  "Джерела надходжень"
  "Ціни"
  "Запаси"
  "Продаж товарів у магазини"
  "Міські магазини здійснюють купівлю та продаж товарів. Наявний асортимент визначається спеціалізацією торгової точки, а лімітований запас товарів автоматично оновлюється щоранку. Ціноутворення прив'язане до економіки регіону: чим більше аналогічного краму є на місцевих складах і чим далі місто розташоване від порту, тим вищою буде підсумкова ціна."
  "Стартовий капітал нового персонажа залежить від вибраного рівня складності кампанії. Подальші надходження з міст нараховуються чотири рази на ігрову добу: обсяг податків визначається населенням і стабільністю міста, а підконтрольні опору поселення додатково надсилають добровільні внески. Захоплені окупантами міста прибутків не приносять. З загального нарахування спочатку відраховується частка в казну опору, а залишок порівну ділиться між онлайн-гравцями (якщо сервер порожній, увесь прибуток іде до казни). Торгівля в крамницях, виконання контрактів та оренда власної нерухомості зараховуються на ваш особистий банківський рахунок, а не зберігаються у вигляді готівки в інвентарі."
  "Кожен предмет має базову ціну, а підсумкова вартість у магазині — це базова ціна, скоригована залежно від вашого місцеперебування. На неї впливають два чинники: наскільки добре навколишнє місто забезпечене цим товаром і наскільки далеко воно розташоване від найближчого порту, тому товари коштують дорожче вглиб континенту. Крім того, магазин додає власну маржу, через що він ніколи не платить за предмет стільки ж, скільки просить за нього при продажу. Навичка торгівлі знижує ціну купівлі для вас, а ціни на транспорт додатково коригуються налаштуваннями складності."
  "Магазини мають обмежену кількість кожного предмета, а місто може вмістити лише певний його обсяг: чисельність населення, стабільність та затребуваність товару разом визначають цей ліміт. Містяни купують товари з полиць із плином днів, тому запаси зменшуються незалежно від того, чи торгує хтось інший. Щоранку магазини поповнюють свої запаси до цього ліміту, а все, що ви продали магазину, повертається на його полиці."
  "Спеціалізований магазин купує лише ті товари, якими торгує сам, тому магазин одягу не зацікавиться гвинтівкою, тоді як збройні та наркодилери приймають майже все, що має цінність. Предмет, який надітий, утримується в руках або висить через плече, неможливо продати, поки він екіпірований, а предмет без цінності взагалі не підлягає продажу; у меню вказується відповідне правило. Автосалони та пункти постачання працюють лише на продаж і ніколи нічого не купують. Звичайна торгівля також іде на користь місту: угоди на суми, вищі за символічні, на певний час підвищують стабільність цього міста."
  "Гроші та магазини"
  "Здобуття досвіду"
  "Рівні та бали"
  "Три навички"
  "Профіль персонажа"
  "Досвід нараховується за більшість дій, які ви здійснюєте на користь опору, і його достатня кількість підвищує ваш рівень. Кожен рівень після першого дає одне очко, а очки витрачаються на навички у профілі вашого персонажа."
  "Досвід нараховується за ліквідацію солдатів окупаційної фракції, будівництво, розміщення об'єктів, виконання завдань із винагородою у вигляді досвіду, а також у невеликих кількостях за торгівлю в магазинах або у дилерів. Кожен об'єкт будівництва та розміщення має власну цінність, тому за більші обсяги робіт ви отримуєте більше досвіду. За торгівлю досвід нараховується лише час від часу, а не за кожну операцію, тому серія дрібних продажів при одному зверненні до прилавка не сумується. Смерть персонажа призводить до втрати досвіду, однак ваш загальний показник ніколи не опускається нижче нуля."
  "Ваш рівень розраховується на основі загальної кількості накопиченого досвіду, і кожен наступний рівень вимагає більше досвіду, ніж попередній. Кожен рівень після першого дає одне очко навичок. Уже витрачені очки враховуються проти цього значення, тому залишок очок дорівнює вашому рівню мінус один і мінус кожен рівень навичок, придбаний вами раніше."
  "Навички «Торгівля», «Стелс» та «Дипломатія» мають по п'ять рівнів кожна, які купуються покроково по одному рівню. «Торгівля» знижує ціни при купівлі товарів, відкриває доступ до імпорту на першому рівні, а на п'ятому розширює імпорт до товарів, які відсутні в асортименті звичайних магазинів. «Стелс» зменшує дистанцію, на якій вас виявляють бійці окупаційної фракції, причому рекрутів бачать за рівнем «Стелсу» їхнього командира, а не за їхнім власним. «Дипломатія» підвищує шанс того, що цивільний після розмови з вами перейде на бік опору."
  "Вкладка «Профіль персонажа» в головному меню Overthrow слугує для прокачування бійця. Тут вказано ваш поточний рівень, шкалу прогресу до наступного, кількість вільних очок, а також усі три гілки навичок із їхніми 5 рівневими бонусами. Уже розблоковані рівні відмічені відповідними позначками, а кнопка купівлі наступного рівня активується лише за наявності вільних очок прокачування та наявних недосліджених рівнів у навичці."
  "Навички та підвищення рівня"
  "Where a Bed Works"
  "The Hours Still Count"
  "Twelve Hours Between Sleeps"
  "When It Will Not Perform"
  "A bed can be slept in, and doing so moves the world clock forward by eight in-game hours. The screen fades to black, holds there a moment, and fades back in on the new time of day. Sleeping is a single-player thing: the action is not offered in a multiplayer session at all."
  "The action shows up on a bed standing inside a house you own, in your own camp, at a deployed FOB, or inside a base the resistance holds. A bed anywhere else offers nothing at all, because those four places are the same ones the resistance is allowed to put its own things down in."
  "The eight hours are replayed rather than skipped over. Taxes and donations pay out and the town shops buy their stock once for every six-hour mark the window passes, the shops restock if it passes seven in the morning, rent moves if it passes midnight, and the occupying faction gains resources, spends them on its bases and lets its threat decay quarter hour by quarter hour, in the order it would have while you were awake. The payout notifications arrive over the black screen and are still there when it clears."
  "Sleeping again is not possible for twelve in-game hours, counted from the moment you wake rather than from the moment you lie down. Those twelve are all spent awake, so with the eight the skip itself covers it is twenty in-game hours from one sleep to the next, and until they are up the action stays on the bed with the time remaining written into its label."
  "While an attack is underway, and while you are wanted, the action stays visible on the bed but refuses, and says which of the two is in the way. A bed that is nowhere the resistance holds is the other case, and that one shows no action rather than a refusal."
  "Sleeping"
  "What Has Storage"
  "Taking Things Out"
  "Putting Things In"
  "Loading and Unloading"
  "Warehouses"
  "Ammo boxes, warehouse buildings and most legal wheeled vehicles keep storage of their own: a list of goods the container holds, kept in the campaign save rather than sitting loose inside it. The Storage action on the container carries the number of items on that list, and opening it shows the list, a cart to fill from it, and a destination to send the cart to."
  "A truck's storage has no limit and an ordinary car holds three hundred items, while an ammo box or a warehouse building holds as much as it is given. An illegal or armed vehicle has none at all, and neither does a helicopter, so no Storage action appears on them."
  "The cart goes to one of two sorts of destination. This container spawns the goods into the container's own inventory, where they can be picked up by hand. Any other storage standing within twenty five metres takes them straight onto its own list instead, with nothing spawned in between. A warehouse building has no inventory of its own, so it only offers the second."
  "Transfer all to storage converts everything the container is carrying into list entries in one go, a truck's bed included. Attachments and full magazines go on as items in their own right, while a part-used magazine stays where it is. An ammo box also carries an officers-only Clear inventory action for discarding what a transfer left behind, and Rename storage gives the container a name of its own, which is what the destination picker on every other container nearby shows."
  "An ammo box carries two more actions that work with the nearest vehicle. Unload vehicle into storage converts whatever that vehicle is carrying loose and then moves its whole list into the box, so a truck brought back from a battlefield empties in one action. Load storage into vehicle moves only the box's list and leaves the box's own inventory alone, so a weapon parked in a box stays there."
  "A warehouse building shows the same Storage action as anything else, and a vehicle parked at one can reach it from the vehicle menu as well: Take from warehouse opens the same screen, and Put in warehouse converts what the vehicle is carrying and moves its whole list into the building. A warehouse nobody has bought opens to nobody, a private one opens only to its owner, and a rented one only to the player renting it. A warehouse also holds construction resources, on an action and a list of their own, which the Resources page covers."
  "Storage"
  "Що привертає увагу"
  "Бути поміченим"
  "Носіння їхньої уніформи"
  "Зниження уваги"
  "Будь-яка протиправна дія з точки зору окупантів піднімає ваш рівень розшуку — поки він вищий за нуль, за вами полюватимуть патрулі. Деякі порушення фіксуються лише за наявності свідків, інші ж викликають підозру автоматично. Як тільки ви відірветеся від спостереження, рівень розшуку почне поступово спадати, а швидкість його зниження залежить від вибраного рівня складності."
  "Більшість правопорушень фіксується лише за наявності свідків. Відкрите носіння зброї, обшук трупів/майна, встановлення нелегальних об'єктів або перебування поруч із ворожими базами чи радіовежами миттєво піднімають рівень розшуку. Якщо ж ваш одяг видає у вас бійця або прибічника опору, ворог задозрить вас одразу при зоровому контакті. Насильство не потребує свідків: поранення будь-кого робить вас розшукуваним, убивство підвищує рівень розшуку ще більше, а будь-яка з цих дій розкриває ваше маскування. Коли вбивають одного з їхніх солдатів, той, хто сидить у транспорті поруч із тілом, також вважається відповідальним. Перебування за кермом озброєного транспорту або пересувної бази (FOB) на очах у ворога додатково підвищує рівень розшуку, а цей транспорт відтоді позначається як техніка опору. Вище першого рівня окупаційна фракція перестає вважати вас цивільним і атакує як ворога при першому ж зоровому контакті."
  "Іконка ока з'являється на вашому екрані, коли вас бачить хтось із бійців окупаційної фракції, і її прозорість змінюється залежно від того, наскільки чітко вас помічають. Вороги починають помічати вас лише в межах певної дистанції, а навичка «Стелс» зменшує цей радіус виявлення. На рекрутів поширюються ті ж самі правила, і їх виявляють за рівнем «Стелсу» їхнього командира."
  "Якщо ви перевдягнені у переконливий комплект однострою окупаційної фракції, їхні війська сприймають вас як свого й припиняють стежити за вами здалеку. Ризик залишається лише на близькій відстані: якщо підійти занадто близько й залишатися на видноті, хтось розкриє ваше маскування, після чого воно скинеться й ви отримаєте рівень розшуку. Відкриття вогню по кому завгодно також миттєво зриває маскування — на будь-якій дистанції та незалежно від наявності свідків. Доки маскування діє, перебування поблизу бази чи радіовежі само по собі не підвищує рівень розшуку. Стан вашого маскування відображається відповідною іконкою на екрані, а дистанція, з якої ворожі солдати розпізнають обман, визначається налаштуваннями складності."
  "Рівень розшуку знижується лише тоді, коли за вами ніхто не спостерігає — по одному рівню за раз із відліком часу між кожним кроком. Будь-яка дія, що знову робить вас розшукуваним, одразу встановлює рівень відповідно до цінності цієї дії та перезапускає відлік, тому рівень розшуку зростає стрибкоподібно, а знижується лише поступово. Останній крок до повного скидання запускється на окремому таймері, і якщо вас помітять під час нього, рівень розшуку знову зросте, замість того щоб обнулитися. Обидва таймери визначаються налаштуваннями складності. Швидке переміщення недоступне, поки ваш рівень розшуку вищий за нуль."
  "Система розшуку"
  "З чим ви починаєте"
  "Довільний порядок"
  "Life in the Towns"
  "Overthrow — це динамічна персистентна кампанія-пісочниця про визволення окупованого острова. У грі немає фіксованого сюжетного лінійного списку завдань чи кінцевої точки: опір формується та розвивається виключно через ваші рішення, а ворожа фракція гнучко реагує на будь-які загрози. Контроль над містами, фінансовий баланс, нерухомість, автопарк, набрані рекрути та відвойовані території зберігаються у реальному часі, тож прогрес кампанії продовжується між ігровими сесіями та не зникає після рестарту сервера."
  "На старті новий персонаж отримує власне житло в одному з міст острова, припаркований поруч автомобіль та початковий капітал. Цей будинок автоматично призначається вашим домом — точкою відродження (респавну). Якщо ж вільного житла на карті немає, гравець починає в одному з поселень лише зі стартовими грошима; у такому разі точкою респавну слугуватиме місце першої появи, доки ви не придбаєте нерухомість і не призначите її домом. Будь-які інші ресурси, техніка та спорядження доведеться заробляти, купувати, зводити або відбирати у ворога."
  "У грі немає жорсткої послідовності чи обов'язкових кроків: торгівля, вербування рекрутів, облаштування таборів, зведення споруд та штурм ворожих баз доступні в будь-якому порядку. Ви самі обираєте власну стратегію розвитку. При грі на сервері всі учасники знаходяться в одному світі й діють у межах єдиної спільної кампанії, змінюючи її стан у реальному часі."
  "Towns are inhabited. People come out as you approach a town and are gone once you are well away from it, and the crowd is put together again from scratch on your next visit, so it is never quite the same gathering twice. How many are about follows the town's population, and which sorts of people appear differs from place to place, so a port city and an inland hamlet are not populated alike. Some walk a route between two points, some drift around several spots, and some stand in one place for minutes at a time. They can be hired as recruits, won over as supporters or sold to as before, and a civilian you have hired leaves the crowd for good and stays with you."
  "Civilian cars stand parked along the kerbs and roadsides of a town, in ones and twos in a village and rather more in a city. One nobody has touched is scenery like the crowd, and a later visit finds a different set of them. One somebody gets into stops being scenery: it stays where it is left and is kept with the rest of the campaign between sessions."
  "Ласкаво просимо до Overthrow"
  "Що дає власне житло"
  "Купівля та оренда"
  "Кожна кампанія стартує з того, що ви отримуєте власне житло та припарковане поруч авто. Право власності прив'язується безпосередньо до вашого профілю гравця, а не до поточної сесії. Це гарантує, що вся ваша нерухомість зберігається під час виходу з гри та не зникає після рестарту сервера."
  "Будинок, призначений вашим домом, слугує точкою респавну після загибелі персонажа. Будь-яка нерухомість, що перебуває у вашій власності або оренді, також працює як точка швидкого переміщення (Fast Travel) — за умови, що ви не здаєте її в оренду іншим особам. Зверніть увагу: при повторному вході на сервер ви з'явитеся саме там, де вийшли з гри минулого разу, а не на точці домашнього респавну."
  "Меню нерухомості з'являється в головному меню щоразу, коли ви перебуваєте всередині будівлі, яку можна придбати, і відображає її ціну продажу та вартість оренди. Жоден із цих показників не є фіксованим: обидва зростають відповідно до чисельності населення та рівня стабільності найближчого міста. Через це однаковий тип будинку коштуватиме дорожче у великому, спокійному місті, ніж у малому чи нестабільному. Офіцери мають можливість купувати та орендувати нерухомість за кошти опору замість власних грошей."
  "Орендна плата розраховується один раз на добу опівночі: той, хто орендує будівлю, сплачує кошти, а власник отримує виплату. Ви можете володіти кількома будівлями та обрати будь-яку з них як свій дім. Будівлю не можна продати, поки вона призначена вашим домом, а вашу останню нерухомість продати неможливо взагалі."
