  "Прибуток"
  "Ласкаво просимо до Overthrow! Це ваш дім, ви відродитеся тут і зможете швидко подорожувати сюди за невелику плату, відкривши головне меню <color rgba='226,168,79,255'><action name=\"OverthrowMainMenu\"/></color>. "\
  ""\
  "У вас є машина, припаркована у вашому гаражі, а пістолет у ваших штанях. Ворог вважає вас цивільним, якщо вони не бачать у вас зброї, і не стрілятимуть у вас, тому будьте обережні, споряджаючи зброю навколо них. Зірки з’являться у верхньому правому куті, якщо вас \"розшукує\" ворог."\
  ""\
  "Для отримання додаткової інформації про функції та ігровий процес Повалення просто подивіться на \"Польовий посібник\""
  "Ваша домівка (Точка відродження)"
  "Чверть унції найкращої травки. Можна продати цивільним з невеликим прибутком."
  "Травка"
  "Досягнуто ліміт предметів у цьому місці"
  "Предмет %1 з %2"
  "Предмет видалено"
  "Маркер з маршрутної точкою доданий на мапу"
  "Убивство офіцера"
  "Саме командир цієї бази тримає в страху весь навколишній регіон. Ваша мета — проникнути на об'єкт, ліквідувати офіцера та оперативно відійти. Ворожий гарнізон миттєво підніме тривогу й кине всі сили на ваш пошук, проте цей удар по окупантах підніме бойовий дух місцевих жителів і схилить сусідні міста на бік опору."
  "Знищити зрадника"
  "Учасник опору дезертирував і перебуває під охороною ворога. Ми відстежили місцезнаходження його будинку."\
  ""\
  "Усуньте цього зрадника, перш ніж він зможе розкрити будь-яку інформацію."
  "Розвідка"
  "Відвідайте сусідню базу, щоб визначити силу її захисту. Щоб добре роздивитися базу, вам потрібно підійти на відстань до 100 метрів."\
  ""\
  "Будьте обережні, щоб вас не побачили в забороненій зоні, позначеній на вашій мапі червоним кольором, інакше по вас стрілятимуть."
  "Знайти торговця зброєю"
  "Торговці зброєю розташовані у великих містах. Це незалежні торговці, які зберігають зброю та інші незаконні предмети."\
  ""\
  "Зверніться до найближчого дилера зброї, щоб дізнатися, які предмети є в наявності."
  "Знайти магазин"
  "У багатьох населених пунктах на карті є різні магазини, де можна придбати легальні речі. Вони позначаються на карті різними значками, що представляють тип магазину."\
  ""\
  "Відвідайте найближчий магазин і подивіться, які товари там є, виконавши дію на касовому апараті."
  "Виконується:"
  "Піратське радіо"
  "Слово розходиться далі, ніж папір. Встановіть у цьому місті піратський радіопередавач, щоб вести мовлення на підтримку опору. Вам доведеться придбати передавач самостійно через пункт «Розмістити» в головному меню, але зважте: якщо ворожі солдати помітять вас під час його встановлення, ви потрапите у розшук."
  "Навчання - Розмістіть табір"
  "Табори можна розміщувати будь-де, де вони не будуть занадто близько до бази."\
  ""\
  "Вони створюють точку швидкого переміщення, якою може користуватися будь-який гравець, і дозволяють розміщувати/будувати базові предмети поруч."\
  ""\
  "Також ви можете скористатися опцією \"Керувати табором\", щоб зробити табір приватним, якщо не хочете, щоб інші гравці могли використовувати його для швидкого переміщення."\
  ""\
  "Кожному гравцеві дозволено мати лише один табір одночасно. Розміщення нового табору видалить ваш старий та всі предмети, які ви навколо нього розмістили або побудували."\
  ""\
  "Ви також можете встановити табір як \"домашній\", щоб відроджуватися там після смерті."\
  ""\
  "Щоб розмістити табір, відкрийте меню Overthrow і виберіть \"Розмістити\". Встановіть його у корисному місці, щоб легко повертатися до зони, де ви зараз дієте, або де залишили свій транспорт."
  "Навчання - Розмістіть ящик із екіпіруванням"
  "Ящик із екіпіруванням — це дуже корисний контейнер для зберігання з додатковими функціями в Overthrow."\
  ""\
  "Він може:"\
  "- Зберігати будь-яке спорядження"\
  "- Бути замкненим, щоб інші гравці не мали доступу"\
  "- Вивантажуватися у поруч розташовану техніку"\
  "- Завантажуватися з поруч розташованої техніки"\
  "- Зберігати ваш поточний комплект спорядження та застосовувати його до себе або рекрутів поблизу"\
  ""\
  "Використайте опцію \"Розмістити\" в меню Overthrow, щоб встановити його у вашому будинку, таборі, на FOB або базі."
  "Розповсюдження пропаганди"
  "Місцевим жителям треба нагадати, хто тут окупанти. Розклейте плакат опору десь у місті — на видному місці, на стіні, де його побачать люди. Головне — не попадіться на очі окупаційним військам під час роботи."
  "Збільшити підтримку"
  "Прихильники в цьому населеному пункті принесуть необхідне джерело доходу опору у вигляді пожертвувань."\
  ""\
  "Залучайте підтримку, розміщуючи плакати в населеному пункті та навколо нього за допомогою опції \"Розмістити\" в меню Overthrow та чекаючи, поки вони привернуть увагу 15% мешканців. Ви також можете доставити медичні товари, як-от бинти та пляшки з аспірином, помістивши їх у свій автомобіль і скориставшись опцією \"Доставити медичні товари\" у своєму багажнику."\
