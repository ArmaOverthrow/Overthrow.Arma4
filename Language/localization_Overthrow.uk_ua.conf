  "A fuel depot stores 10,000 litres and arrives empty, so it has no fuel to give until it is filled. A fuel truck parked alongside can be drained into it using the depot's own actions, and after that it refuels vehicles parked beside it for free."
  "Fuel Depot"
  "Groups bought here are yours, and stay yours between sessions. The price covers the recruit cost of every man, the gear each of them needs, and, for a group that comes with a vehicle, that vehicle at its full shop price. Gear already stocked in a registered warehouse within 150 metres is taken off the shelves rather than bought, and the quote shows how much that covered. A purchase also draws supporters out of the nearest town, and there is a cap on how many High Command soldiers one player can hold at once."
  "Every player's map shows these groups as green symbols, your own at full strength and other players' dimmed. Selecting one shows its owner, stance, destination and status, and a group you own can be sent to the spot under the map cursor or have its stance cycled between Defend, Patrol and Attack. Travel happens in real time, on foot or by road, and carries on while you are offline. Manage Groups, on the main menu, lists what you own."
  "High Command"
  "Нерухомість можна купувати, орендувати та продавати. Не всі будівлі можна придбати, але більшість будинків — можна. Будівля, встановлена як ваш дім, є місцем відродження вашого персонажа, а будівлі, якими ви володієте або які орендуєте, доступні як точки швидкого переміщення. Бази та FOB також можна встановити як «Дім». Через цей екран також можна купувати різні склади, які дають змогу зберігати та забирати велику кількість предметів."
  "Володіння нерухомістю"
  "Дізнатися більше"
  "Мапа позначає будівлі та транспортні засоби, якими ви володієте, табори й FOB, розміщені опором, а також магазини, торговців зброєю та порти, доступні для імпорту. Затінення місцевості показує території, які все ще контролює окупаційна фракція, і зникає там, де їх захоплює опір. Фільтр на панелі значків ліворуч відкриває меню з перемикачами для кожного типу маркера та кожного шару. Щоб відкрити мапу, ви повинні мати її як предмет у своєму інвентарі, тож не загубіть її!"
  "Мапа"
  "Меню Overthrow"
  "Далі"
  "Наразі немає підказок для показу"
  "%1 / %2"
  "Розміщення дає змогу за гроші встановлювати у світі об'єкти опору — від дрібних предметів до повноцінного табору. Деякі об'єкти заборонені, і якщо встановити такий об'єкт на очах в окупаційної фракції, вас оголосять у розшук. Предмети можна розміщувати на будь-якій нерухомості або в таборі, якими ви володієте, а також на базах і FOB, контрольованих опором."
  "Розміщення об'єктів"
  "Намет для найму дозволяє найняти неспорядженого цивільного з найближчого міста або, за допомогою «Найняти спорядженого новобранця», новобранця, який прибуде вже у збереженому вами комплекті спорядження. Вартість спорядженого новобранця включає ціну його спорядження за місцевими магазинними цінами та додаткову плату за послугу понад звичайну вартість найму. Загальну ціну буде показано перед підтвердженням найму."
  "Споряджені рекрути"
  "Рекрут належить гравцеві, який його найняв, приєднується до групи цього гравця та виконує накази через звичайне меню командування групою. Рекрути завжди залишаються зі своїм власником, навіть якщо ви змінюєте групу.<br/><br/>Використовуйте меню командування <color rgba='226,168,79,255'><action name=\"OpenCommandMenu\"/></color>, щоб віддавати їм накази або відкривати їхній інвентар, дивлячись на них. Накази, віддані без наведення погляду на конкретного рекрута, застосовуються до всіх ваших рекрутів."
  "Ваші рекрути"
  "Рекрутам, які належать вам, можна наказати утримувати позицію — з цього екрана або за допомогою утримуваної дії на самому рекруті. Рекрут, який утримує позицію, залишає вашу групу й залишається на місці, але все ще належить вам і займає один із ваших шістнадцяти слотів для рекрутів."
  "Утримання позиції"
  "Рекрут, який слідує за вами, має дію «Обміняти спорядження»: утримуючи її поблизу, ви повністю обмінюєтеся з ним спорядженням, включно з одягом і зброєю. Обмінюються саме наявні предмети, тому нічого не створюється й не зникає; усе, що не вміститься, буде покладено до сховища або, у крайньому разі, залишено на землі."
  "Обмін спорядження"
  "Підказки знову увімкнено, і вони з’являтимуться під час гри"
  "Знову увімкнути підказки"
  "Торговець зброєю продає зброю та військове спорядження замість звичайних товарів, має власний асортимент і поповнює запаси окремо від звичайних магазинів. Кожен торговець зброєю має набір унікальної зброї та боєприпасів до неї, тому, щоб знайти потрібну зброю, можливо, доведеться пошукати в кількох містах."
  "Торговці зброєю"
  "Досвід нараховується за більшість завдань, які ви виконуєте для опору, а кожен рівень після першого дає одне очко навичок. Очки можна витрачати на підвищення трьох навичок — Торгівлі, Скритності та Дипломатії — у меню персонажа."
  "Навички та рівні"
  "Ammo boxes, warehouse buildings and most legal wheeled vehicles keep storage of their own: a list of goods the container holds rather than items sitting loose inside it. The number beside the Storage action is how many are on that list.<br/><br/>Anything on the list can be taken out into this container, where it turns back into items you can pick up, or sent straight onto the list of another container standing within twenty five metres.<br/><br/>Other actions on the container put everything it is carrying onto the list at once, or give it a name of its own."
  "Storage"
  "Підказка"
  "Окупаційна фракція оголосила вас у розшук і тепер полюватиме на вас. Щоб позбутися рівня розшуку, потрібно зникнути з їхнього поля зору та деякий час переховуватися. Коли зірки знову зникнуть, вас більше не вважатимуть ворогом.<br/><br/>Ви можете замаскуватися, одягнувши форму ворога. Коли значок «одяг» стає червоним, ви замасковані й можете входити до заборонених зон, але не підходьте до ворогів надто близько, інакше вони вас упізнають. Ніч, рослинність і навички можуть зменшити відстань, з якої вас помічають."
  "Перебування в розшуку"
  "Overthrow — це постійна кампанія-пісочниця на окупованому острові. Тут немає списку цілей чи обов’язкового порядку дій, а острів реагує на ваші вчинки.<br/><br/>Міста, гроші, нерухомість, транспорт і захоплені території зберігаються, тож кампанія продовжується між ігровими сесіями та після перезапусків сервера.<br/><br/>Найпростіше отримувати гроші завдяки пожертвам від прихильників у містах. Щоб збільшити підтримку опору, потрібно підвищувати обізнаність про нього або зменшувати вплив окупаційних сил на населення."
  "Вам надали будинок в одному з міст острова, автомобіль, припаркований у прилеглому гаражі, та трохи грошей на початок.<br/><br/>Цей будинок є вашим «домом» — місцем, де ви відроджуєтеся. Ви також можете швидко переміщуватися назад до цього будинку або до будь-якого іншого будинку, яким володієте, з будь-якого місця.<br/><br/>Інший варіант пересування — дістатися автобусної зупинки, звідки за невелику плату можна поїхати до будь-якої іншої автобусної зупинки на мапі."
  "Більшість можливостей, які додає Overthrow, доступні в меню Overthrow, яке відкривається за допомогою <color rgba='226,168,79,255'><action name=\"OverthrowMainMenu\"/></color>.<br/><br/>У ньому доступні всі можливості, які пропонує Overthrow.<br/><br/>Коли ви перебуваєте в транспортному засобі, також можна скористатися <color rgba='226,168,79,255'><action name=\"OverthrowVehicleMenu\"/></color>, щоб відкрити «Меню транспорту» з додатковими параметрами для транспортних засобів."
  "Періодично з’являтимуться такі підказки, коли щось нове відбувається вперше, і кожна з них показується лише один раз.<br/><br/>Пункт «Підказки» в меню Overthrow дозволяє знову відкрити останню підказку, вимкнути підказки або скинути навчання.<br/><br/>Для отримання додаткової інформації відкрийте «Польовий посібник» у меню Reforger і прокрутіть до розділів Overthrow або відвідайте нашу вікі за адресою <a href='https://wiki.armaoverthrow.com'>[https://wiki.armaoverthrow.com](https://wiki.armaoverthrow.com)</a>"
  "Ласкаво просимо до Overthrow"
  "Вільного стартового будинку не знайшлося, тому ви почали гру в одному з міст острова, а не у власному домі. Таке може траплятися на дуже завантажених серверах.<br/><br/>У вас усе ще є стартові гроші, а поки що ви відроджуватиметеся там, де почали гру. Нерухомість на острові можна купувати, а будівлю, якою ви володієте, можна встановити як свій дім."
